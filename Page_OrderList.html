<!-- Page_OrderList.html : 발주 내역 조회 (완전 기능 구현) -->

<style>
  .orderlist-wrap {
    font-size: 13px;
  }

  /* 검색 필터 카드 */
  .orderlist-filter-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .orderlist-filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .orderlist-filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .orderlist-filter-label {
    font-size: 11px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
  }

  .orderlist-input {
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
  }

  .orderlist-input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }

  .orderlist-btn-group {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .orderlist-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .orderlist-btn-sm {
    padding: 6px 12px;
    font-size: 12px;
  }

  .orderlist-btn-primary {
    background: #3b82f6;
    color: white;
  }

  .orderlist-btn-primary:hover {
    background: #2563eb;
  }

  .orderlist-btn-secondary {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
  }

  .orderlist-btn-secondary:hover {
    background: #e5e7eb;
  }

  .orderlist-btn-danger {
    background: #ef4444;
    color: white;
  }

  .orderlist-btn-danger:hover {
    background: #dc2626;
  }

  .orderlist-btn-success {
    background: #10b981;
    color: white;
  }

  .orderlist-btn-success:hover {
    background: #059669;
  }

  /* 결과 카드 */
  .orderlist-result-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
  }

  .orderlist-result-header {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .orderlist-result-title {
    font-size: 16px;
    font-weight: 700;
    color: #111827;
  }

  .orderlist-result-count {
    font-size: 14px;
    color: #6b7280;
  }

  .orderlist-result-actions {
    display: flex;
    gap: 8px;
  }

  /* 테이블 */
  .orderlist-table-wrapper {
    overflow-x: auto;
  }

  .orderlist-table {
    width: 100%;
    border-collapse: collapse;
  }

  .orderlist-table th,
  .orderlist-table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
  }

  .orderlist-table th {
    background: #f9fafb;
    font-weight: 600;
    color: #374151;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .orderlist-table th:hover {
    background: #f3f4f6;
  }

  .orderlist-table th.sortable::after {
    content: '⇅';
    margin-left: 4px;
    color: #9ca3af;
    font-size: 10px;
  }

  .orderlist-table th.sortable.asc::after {
    content: '↑';
    color: #3b82f6;
  }

  .orderlist-table th.sortable.desc::after {
    content: '↓';
    color: #3b82f6;
  }

  .orderlist-table td {
    font-size: 13px;
    color: #111827;
  }

  .orderlist-table tbody tr {
    cursor: pointer;
    transition: background 0.15s;
  }

  .orderlist-table tbody tr:hover {
    background: #f9fafb;
  }

  .orderlist-table .text-right {
    text-align: right;
    font-family: 'Courier New', monospace;
  }

  .orderlist-table .text-center {
    text-align: center;
  }

  .orderlist-ordercode {
    color: #3b82f6;
    font-weight: 600;
  }

  /* 페이지네이션 */
  .orderlist-pagination {
    padding: 16px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-top: 1px solid #e5e7eb;
  }

  .orderlist-page-btn {
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .orderlist-page-btn:hover {
    background: #f3f4f6;
  }

  .orderlist-page-btn.active {
    background: #3b82f6;
    color: white;
    border-color: #3b82f6;
  }

  .orderlist-page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .orderlist-page-info {
    font-size: 13px;
    color: #6b7280;
    margin: 0 12px;
  }

  /* 모달 */
  .orderlist-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .orderlist-modal-overlay.show {
    display: flex;
  }

  .orderlist-modal {
    background: white;
    border-radius: 12px;
    max-width: 1000px;
    width: 90%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  }

  .orderlist-modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .orderlist-modal-title {
    font-size: 18px;
    font-weight: 700;
    color: #111827;
  }

  .orderlist-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #9ca3af;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  .orderlist-modal-close:hover {
    background: #f3f4f6;
    color: #374151;
  }

  .orderlist-modal-body {
    padding: 24px;
    overflow-y: auto;
  }

  .orderlist-modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .orderlist-detail-section {
    margin-bottom: 24px;
  }

  .orderlist-detail-section-title {
    font-size: 14px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #e5e7eb;
  }

  .orderlist-detail-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .orderlist-detail-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .orderlist-detail-label {
    font-size: 11px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
  }

  .orderlist-detail-value {
    font-size: 14px;
    color: #111827;
    font-weight: 500;
  }

  .orderlist-detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .orderlist-detail-table th,
  .orderlist-detail-table td {
    padding: 8px 12px;
    text-align: left;
    border: 1px solid #e5e7eb;
  }

  .orderlist-detail-table th {
    background: #f9fafb;
    font-weight: 600;
    color: #374151;
  }

  /* 상태 수정 폼 */
  .orderlist-status-form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
    background: #f9fafb;
    border-radius: 8px;
  }

  .orderlist-status-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .orderlist-status-select {
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
  }

  .orderlist-empty {
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
  }

  .orderlist-empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .orderlist-empty-text {
    font-size: 14px;
  }

  /* 상태 뱃지 */
  .orderlist-status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  /* 매입발주 */
  .badge-buy-order-pending {
    background: #fee2e2;
    color: #991b1b;
  }
  .badge-buy-order-done {
    background: #d1fae5;
    color: #065f46;
  }

  /* 매입결제 */
  .badge-pay-buy-unpaid {
    background: #fef3c7;
    color: #92400e;
  }
  .badge-pay-buy-partial {
    background: #fed7aa;
    color: #9a3412;
  }
  .badge-pay-buy-paid {
    background: #d1fae5;
    color: #065f46;
  }

  /* 매출결제 */
  .badge-pay-sell-unpaid {
    background: #fef3c7;
    color: #92400e;
  }
  .badge-pay-sell-partial {
    background: #fed7aa;
    color: #9a3412;
  }
  .badge-pay-sell-paid {
    background: #d1fae5;
    color: #065f46;
  }

  /* 출고 */
  .badge-ship-pending {
    background: #e0e7ff;
    color: #3730a3;
  }
  .badge-ship-partial {
    background: #c7d2fe;
    color: #4338ca;
  }
  .badge-ship-done {
    background: #d1fae5;
    color: #065f46;
  }
</style>

<div class="orderlist-wrap">
  <!-- 검색 필터 -->
  <div class="orderlist-filter-card">
    <div class="orderlist-filter-grid">
      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">시작일</label>
        <input type="date" id="orderlist-start-date" class="orderlist-input" />
      </div>

      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">종료일</label>
        <input type="date" id="orderlist-end-date" class="orderlist-input" />
      </div>

      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">발주번호</label>
        <input type="text" id="orderlist-order-code" class="orderlist-input" placeholder="발주번호 검색" />
      </div>

      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">발주처</label>
        <input type="text" id="orderlist-buyer" class="orderlist-input" placeholder="발주처명" />
      </div>

      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">브랜드</label>
        <input type="text" id="orderlist-brand" class="orderlist-input" placeholder="브랜드명" />
      </div>

      <div class="orderlist-filter-group">
        <label class="orderlist-filter-label">매입처</label>
        <input type="text" id="orderlist-supplier" class="orderlist-input" placeholder="매입처명" />
      </div>
    </div>

    <div class="orderlist-btn-group">
      <button type="button" id="orderlist-btn-reset" class="orderlist-btn orderlist-btn-secondary">
        초기화
      </button>
      <button type="button" id="orderlist-btn-search" class="orderlist-btn orderlist-btn-primary">
        조회
      </button>
    </div>
  </div>

  <!-- 결과 테이블 -->
  <div class="orderlist-result-card">
    <div class="orderlist-result-header">
      <div>
        <div class="orderlist-result-title">발주 내역</div>
        <div class="orderlist-result-count" id="orderlist-result-count">조회 버튼을 클릭하세요</div>
      </div>
      <div class="orderlist-result-actions">
        <button type="button" id="orderlist-btn-excel" class="orderlist-btn orderlist-btn-sm orderlist-btn-secondary">
          📥 엑셀 다운로드
        </button>
      </div>
    </div>

    <div class="orderlist-table-wrapper">
      <table class="orderlist-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="orderDate">발주일</th>
            <th class="sortable" data-sort="orderCode">발주번호</th>
            <th class="sortable" data-sort="buyer">발주처</th>
            <th class="sortable" data-sort="brand">브랜드</th>
            <th class="sortable" data-sort="supplier">매입처</th>
            <th class="sortable text-center" data-sort="itemCount">품목수</th>
            <th class="sortable text-right" data-sort="totalPurchaseAmount">매입액</th>
            <th class="sortable text-right" data-sort="totalAmount">공급액</th>
            <th class="sortable text-center" data-sort="buyOrderStatus">매입발주</th>
            <th class="sortable text-center" data-sort="payBuyStatus">매입결제</th>
            <th class="sortable text-center" data-sort="paySellStatus">매출결제</th>
            <th class="sortable text-center" data-sort="shipStatus">출고</th>
            <th class="text-center">액션</th>
          </tr>
        </thead>
        <tbody id="orderlist-tbody">
          <tr>
            <td colspan="13" class="orderlist-empty">
              <div class="orderlist-empty-icon">📋</div>
              <div class="orderlist-empty-text">조회 버튼을 클릭하여 발주 내역을 확인하세요</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이지네이션 -->
    <div class="orderlist-pagination" id="orderlist-pagination" style="display: none;">
      <button type="button" class="orderlist-page-btn" id="orderlist-page-first">«</button>
      <button type="button" class="orderlist-page-btn" id="orderlist-page-prev">‹</button>
      <div id="orderlist-page-numbers"></div>
      <button type="button" class="orderlist-page-btn" id="orderlist-page-next">›</button>
      <button type="button" class="orderlist-page-btn" id="orderlist-page-last">»</button>
      <span class="orderlist-page-info" id="orderlist-page-info"></span>
    </div>
  </div>
</div>

<!-- 발주 상세 모달 -->
<div id="orderlist-modal" class="orderlist-modal-overlay">
  <div class="orderlist-modal">
    <div class="orderlist-modal-header">
      <div class="orderlist-modal-title" id="orderlist-modal-title">발주 상세</div>
      <button type="button" class="orderlist-modal-close" id="orderlist-modal-close">×</button>
    </div>
    <div class="orderlist-modal-body" id="orderlist-modal-body">
      <!-- 동적으로 로드됨 -->
    </div>
    <div class="orderlist-modal-footer">
      <button type="button" id="orderlist-btn-delete" class="orderlist-btn orderlist-btn-sm orderlist-btn-danger">
        🗑️ 발주 삭제
      </button>
      <div style="flex: 1;"></div>
      <button type="button" id="orderlist-btn-save-status" class="orderlist-btn orderlist-btn-sm orderlist-btn-success">
        💾 상태 저장
      </button>
    </div>
  </div>
</div>
