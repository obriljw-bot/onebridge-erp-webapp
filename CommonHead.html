<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OneBridge ERP</title>

<style>
  /* ===== 기본 리셋 ===== */
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #f3f4f6;
    color: #111827;
  }

  .ob-body {
    height: 100vh;
    overflow: hidden;
  }

  .ob-app-shell {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    grid-template-rows: 100vh;
  }

  /* ===== 사이드바 ===== */
  .ob-sidebar {
    background: #111827;
    color: #e5e7eb;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-right: 1px solid #000;
  }

  .ob-logo {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.04em;
    padding: 8px 10px;
    border-radius: 10px;
    background: #1f2937;
    color: #f9fafb;
  }

  .ob-sidebar-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9ca3af;
    margin: 12px 4px 4px;
  }

  .ob-nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .ob-nav-item {
    margin-bottom: 2px;
  }

  .ob-nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: #e5e7eb;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .ob-nav-link:hover {
    background: #1f2937;
    border-color: #374151;
  }

  .ob-nav-link.active {
    background: #f97316;
    color: #111827;
    border-color: #f97316;
  }

  .ob-nav-icon {
    font-size: 14px;
    width: 18px;
    text-align: center;
  }

  /* ===== 메인 ===== */
  .ob-main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .ob-header {
    height: 52px;
    padding: 8px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ob-main-content {
    flex: 1;
    overflow: auto;
    padding: 16px 20px 24px;
  }

  .ob-page-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .ob-page-subtitle {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 16px;
  }

  /* 카드 레이아웃 */
  .ob-card {
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03);
  }

  .ob-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .ob-card-title {
    font-size: 14px;
    font-weight: 600;
  }

  .ob-card-subtitle {
    font-size: 12px;
    color: #6b7280;
  }

  /* 그리드 */
  .ob-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .ob-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  /* 인풋, 버튼 */
  .ob-input {
    width: 100%;
    padding: 7px 9px;
    border-radius: 9px;
    border: 1px solid #d1d5db;
    font-size: 13px;
    outline: none;
  }
  .ob-input:focus {
    border-color: #f97316;
    box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.4);
  }

  .ob-select {
    width: 100%;
    padding: 7px 9px;
    border-radius: 9px;
    border: 1px solid #d1d5db;
    font-size: 13px;
    background: #ffffff;
  }

  .ob-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 12px;
    cursor: pointer;
    background: #111827;
    color: #f9fafb;
  }
  .ob-button.secondary {
    background: #ffffff;
    color: #111827;
    border-color: #d1d5db;
  }
  .ob-button.danger {
    background: #b91c1c;
  }
  .ob-button.sm {
    padding: 5px 9px;
    font-size: 11px;
  }
  .ob-button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  /* 태그 / 상태 뱃지 */
  .ob-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #4b5563;
  }
  .ob-badge.info {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
  }
  .ob-badge.success {
    background: #ecfdf5;
    border-color: #bbf7d0;
    color: #15803d;
  }
  .ob-badge.warning {
    background: #fffbeb;
    border-color: #fef3c7;
    color: #92400e;
  }

  /* 테이블 */
  .ob-table-wrap {
    width: 100%;
    overflow: auto;
  }

  table.ob-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
  }
  .ob-table th,
  .ob-table td {
    border-bottom: 1px solid #e5e7eb;
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
  }
  .ob-table thead {
    background: #f9fafb;
  }
  .ob-table tbody tr:hover {
    background: #f3f4f6;
  }

  .ob-text-muted {
    color: #9ca3af;
  }

  .ob-text-right {
    text-align: right;
  }

  .ob-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background: #111827;
    color: #f9fafb;
  }

  .ob-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .ob-kpi-card {
    background: #111827;
    color: #f9fafb;
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.4);
  }

  .ob-kpi-label {
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  .ob-kpi-value {
    font-size: 16px;
    font-weight: 600;
  }

  .ob-kpi-delta {
    font-size: 11px;
    margin-top: 2px;
  }

  .ob-kpi-delta.up {
    color: #4ade80;
  }
  .ob-kpi-delta.down {
    color: #f97316;
  }

  .ob-flex {
    display: flex;
  }

  .ob-flex-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ob-flex-center {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ob-gap-8 {
    gap: 8px;
  }

  .ob-mb-8 { margin-bottom: 8px; }
  .ob-mb-12 { margin-bottom: 12px; }

  .ob-tag-pill {
    border-radius: 999px;
    padding: 2px 8px;
    background: #f3f4f6;
    font-size: 11px;
  }

  /* 파일 드롭존 */
  .ob-dropzone {
    border: 1px dashed #9ca3af;
    border-radius: 14px;
    padding: 16px;
    background: #f9fafb;
    text-align: center;
    cursor: pointer;
  }
  .ob-dropzone.dragover {
    border-color: #f97316;
    background: #fffbeb;
  }

  /* 로딩 오버레이 */
  .ob-loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.18);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .ob-loading-overlay.show {
    display: flex;
  }
  .ob-loading-box {
    background: #111827;
    color: #f9fafb;
    border-radius: 16px;
    padding: 14px 18px;
    min-width: 200px;
    box-shadow: 0 20px 45px rgba(15, 23, 42, 0.7);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ob-spinner {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid rgba(249, 250, 251, 0.3);
    border-top-color: #f97316;
    animation: ob-spin 0.7s linear infinite;
  }

  @keyframes ob-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ===== 결제 모달 스타일 ===== */
  .payment-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .payment-modal-content {
    background: #ffffff;
    border-radius: 12px;
    width: 90%;
    max-width: 700px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .payment-modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .payment-modal-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    color: #111827;
  }

  .payment-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: #6b7280;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.2s;
  }

  .payment-modal-close:hover {
    color: #111827;
  }

  .payment-modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  .payment-modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  /* 단계 표시 */
  .payment-step-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .payment-step-indicator {
    font-size: 12px;
    font-weight: 600;
    color: #f97316;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .payment-step-desc {
    font-size: 14px;
    color: #6b7280;
    margin: 0;
  }

  /* 결제 타입 선택 */
  .payment-type-selection {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 8px;
  }

  .payment-type-card {
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #ffffff;
  }

  .payment-type-card:hover {
    border-color: #f97316;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.1);
    transform: translateY(-2px);
  }

  .payment-type-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .payment-type-card h4 {
    margin: 0 0 8px 0;
    font-size: 18px;
    font-weight: 600;
    color: #111827;
  }

  .payment-type-card p {
    margin: 0 0 4px 0;
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
  }

  .payment-type-label {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
  }

  /* 청구서 검색 */
  .invoice-search-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .invoice-search-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s;
  }

  .invoice-search-input:focus {
    outline: none;
    border-color: #f97316;
  }

  .invoice-search-results {
    max-height: 400px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .invoice-item {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    background: #ffffff;
  }

  .invoice-item:hover {
    border-color: #f97316;
    background: #fff7ed;
  }

  .invoice-item div {
    font-size: 13px;
    color: #4b5563;
    margin-bottom: 4px;
  }

  .invoice-item div:last-child {
    margin-bottom: 0;
  }

  .invoice-id {
    font-size: 14px;
    font-weight: 600;
    color: #f97316;
    margin-bottom: 8px;
    display: block;
  }

  /* 청구서 상세 */
  .invoice-detail-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 13px;
  }

  .invoice-detail-table th {
    background: #f9fafb;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: #374151;
    border-bottom: 2px solid #e5e7eb;
  }

  .invoice-detail-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #f3f4f6;
    color: #4b5563;
  }

  .invoice-detail-table tr:last-child td {
    border-bottom: none;
  }

  .invoice-detail-table tr:hover {
    background: #f9fafb;
  }

  /* 결제 정보 배너 */
  .payment-info-banner {
    background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
    color: #ffffff;
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 결제 입력 폼 */
  .payment-form-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .payment-form-section input,
  .payment-form-section select,
  .payment-form-section textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .payment-form-section input:focus,
  .payment-form-section select:focus,
  .payment-form-section textarea:focus {
    outline: none;
    border-color: #f97316;
  }

  .payment-form-section input:disabled,
  .payment-form-section select:disabled {
    background: #f3f4f6;
    color: #9ca3af;
    cursor: not-allowed;
  }

  .payment-form-section textarea {
    resize: vertical;
    min-height: 80px;
  }

  /* 금액 검증 결과 */
  .amount-validation {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 12px;
  }

  .amount-validation.success {
    background: #ecfdf5;
    border: 1px solid #10b981;
    color: #065f46;
  }

  .amount-validation.error {
    background: #fef2f2;
    border: 1px solid #ef4444;
    color: #991b1b;
  }

  .amount-validation div {
    margin-bottom: 6px;
  }

  .amount-validation div:last-child {
    margin-bottom: 0;
  }

  /* 버튼 */
  .payment-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .payment-btn.primary {
    background: #f97316;
    color: #ffffff;
  }

  .payment-btn.primary:hover:not(:disabled) {
    background: #ea580c;
  }

  .payment-btn.secondary {
    background: #ffffff;
    color: #374151;
    border: 1px solid #d1d5db;
  }

  .payment-btn.secondary:hover:not(:disabled) {
    background: #f9fafb;
    border-color: #9ca3af;
  }

  .payment-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* 임시 청구서 생성 */
  .temp-invoice-creation {
    text-align: center;
    padding: 20px;
  }

  .temp-invoice-creation button {
    margin-top: 12px;
  }

  /* 정보 박스 */
  .info-box {
    background: #eff6ff;
    border: 1px solid #3b82f6;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #1e40af;
    margin-top: 16px;
  }

  .info-box.warning {
    background: #fef3c7;
    border-color: #f59e0b;
    color: #92400e;
  }

  .info-box.error {
    background: #fee2e2;
    border-color: #ef4444;
    color: #991b1b;
  }

  /* 검색 박스 */
  .payment-search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .payment-search-box input {
    flex: 1;
  }

  /* 메시지 스타일 */
  .payment-empty-msg,
  .payment-loading-msg,
  .payment-error-msg,
  .payment-info-msg {
    text-align: center;
    padding: 20px;
    font-size: 14px;
    color: #6b7280;
  }

  .payment-loading-msg {
    color: #3b82f6;
  }

  .payment-error-msg {
    color: #ef4444;
  }

  .payment-info-msg {
    color: #3b82f6;
    background: #eff6ff;
    border-radius: 8px;
    padding: 12px;
  }

  /* 청구서 아이템 상세 */
  .invoice-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .invoice-item-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .invoice-status {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .invoice-status.status-issued {
    background: #dbeafe;
    color: #1e40af;
  }

  .invoice-status.status-draft {
    background: #fef3c7;
    color: #92400e;
  }

  .invoice-status.status-paid {
    background: #d1fae5;
    color: #065f46;
  }

  /* 청구서 상세 헤더 */
  .invoice-detail-header {
    background: #f9fafb;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .invoice-detail-header div {
    margin-bottom: 4px;
  }

  .invoice-detail-header div:last-child {
    margin-bottom: 0;
  }

  .invoice-detail-section {
    margin-top: 16px;
  }

  .invoice-detail-section h4 {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin: 0 0 8px 0;
  }

  /* 테이블 정렬 */
  .text-right {
    text-align: right !important;
  }

  /* 결제 폼 행 */
  .payment-form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .payment-form-row label {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }

  .payment-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .payment-input:focus {
    outline: none;
    border-color: #f97316;
  }

  .payment-input:disabled {
    background: #f3f4f6;
    color: #9ca3af;
    cursor: not-allowed;
  }

  /* 금액 검증 결과 컨테이너 */
  .amount-validation-result {
    margin-top: 16px;
  }

  .amount-validation .validation-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .amount-validation .validation-details {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .amount-validation .validation-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .amount-validation .validation-row {
    font-size: 13px;
  }

  .amount-validation .validation-message {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.9;
  }

  /* 경고 박스 */
  .payment-warning-box {
    background: #fef3c7;
