<style>
.ob-container{padding:20px;}

/* 탭 네비게이션 */
.tab-navigation{
  display:flex;
  gap:0;
  background:white;
  border-radius:8px 8px 0 0;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
  margin-bottom:0;
  border-bottom:2px solid #e5e7eb;
}
.tab-nav-item{
  padding:12px 24px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
  color:#6b7280;
  border-bottom:3px solid transparent;
  transition:all 0.2s;
  user-select:none;
}
.tab-nav-item:hover{
  color:#2563eb;
  background:#f9fafb;
}
.tab-nav-item.active{
  color:#2563eb;
  border-bottom-color:#2563eb;
  background:white;
}

/* 탭 콘텐츠 */
.tab-content{
  display:none;
  animation:fadeIn 0.3s;
}
.tab-content.active{
  display:block;
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* 상단 옵션바 */
.ob-topbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  background:white;
  padding:12px;
  border-radius:0 8px 8px 8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
  margin-bottom:16px;
  align-items:center;
}
.ob-topbar select,.ob-topbar input{
  padding:6px 8px;
  border:1px solid #d1d5db;
  border-radius:6px;
  font-size:13px;
}

.ob-btn{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  transition: all 0.2s;
}
.primary{background:#2563eb;color:white;}
.primary:hover{background:#1d4ed8;}
.secondary{background:#e5e7eb;}
.secondary:hover{background:#d1d5db;}
.success{background:#10b981;color:white;}
.success:hover{background:#059669;}

/* 일괄선택 버튼 그룹 */
.bulk-select-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#f9fafb;
  padding:8px;
  border-radius:6px;
  border:1px solid #e5e7eb;
}
.bulk-select-btn{
  padding:6px 12px;
  border:1px solid #d1d5db;
  border-radius:4px;
  background:white;
  cursor:pointer;
  font-size:12px;
  transition: all 0.2s;
}
.bulk-select-btn:hover{
  background:#f3f4f6;
  border-color:#9ca3af;
}

/* 청구서 요약 카드 */
.billing-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  margin-bottom:16px;
  display:none;
}
.billing-summary.active{
  display:grid;
}
.billing-summary-card{
  background:white;
  padding:16px;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
.billing-summary-label{
  font-size:12px;
  color:#64748b;
  margin-bottom:4px;
}
.billing-summary-value{
  font-size:20px;
  font-weight:700;
  color:#1e293b;
}

/* 테이블 */
.ob-table-wrap{
  overflow:auto;
  max-height:720px;
  background:white;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
  margin-bottom:16px;
}
.ob-table-wrap table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.ob-table-wrap th,
.ob-table-wrap td{
  padding:8px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}
.ob-table-wrap th{
  background:#f1f5f9;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}
.ob-table-wrap td.num{
  text-align:right;
}

/* 정렬 가능 헤더 */
.ob-table-wrap th.sortable{
  cursor:pointer;
  user-select:none;
}
.ob-table-wrap th.sortable:hover{
  background:#e2e8f0;
}
.ob-table-wrap th.sortable::after{
  content:' ⇅';
  opacity:0.3;
  font-size:11px;
}
.ob-table-wrap th.sortable.asc::after{
  content:' ↑';
  opacity:1;
}
.ob-table-wrap th.sortable.desc::after{
  content:' ↓';
  opacity:1;
}

/* 페이지네이션 */
.pagination-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:white;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
.pagination-controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.pagination-btn{
  padding:6px 12px;
  border:1px solid #d1d5db;
  border-radius:4px;
  background:white;
  cursor:pointer;
  font-size:13px;
}
.pagination-btn:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.pagination-btn:not(:disabled):hover{
  background:#f3f4f6;
}
.pagination-btn.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}
.page-info{
  font-size:13px;
  color:#6b7280;
}
</style>

<div class="ob-container">

  <!-- 탭 네비게이션 -->
  <div class="tab-navigation">
    <div class="tab-nav-item active" data-tab="order-output">
      📋 발주번호별 출력
    </div>
    <div class="tab-nav-item" data-tab="bulk-billing">
      💳 일괄 청구서
    </div>
  </div>

  <!-- =============================================== -->
  <!-- 탭 1: 발주번호별 출력 (기존) -->
  <!-- =============================================== -->
  <div id="tab-order-output" class="tab-content active">

    <!-- 상단 옵션바 -->
    <div class="ob-topbar" style="flex-direction:column;gap:16px;">

      <!-- 첫 번째 줄: 기본 검색 옵션 -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <label>발주번호</label>
        <input id="inv-order-code" placeholder="OB2025-..." style="min-width:150px;">

        <label>기간</label>
        <input id="inv-start-date" type="date">
        <input id="inv-end-date" type="date">

        <label>매입처</label>
        <input id="inv-supplier" placeholder="업체명" style="min-width:120px;">

        <button id="inv-search-btn" class="ob-btn primary">🔍 조회</button>
      </div>

      <!-- 두 번째 줄: 출력 옵션 -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px;background:#f8fafc;border-radius:6px;border:1px solid #e5e7eb;">

        <label style="font-weight:600;color:#1e293b;">📄 출력 설정</label>
        <span style="border-left:1px solid #cbd5e1;height:20px;"></span>

        <label>문서 유형</label>
        <select id="inv-doc-type">
          <option value="ORDER_PURCHASE">발주서(매입)</option>
          <option value="INVOICE_VAT">거래명세서(부포)</option>
          <option value="INVOICE_NVAT">거래명세서(영세)</option>
        </select>

        <label>출력 형식</label>
        <select id="inv-output-format">
          <option value="PDF">PDF</option>
          <option value="EXCEL">Excel</option>
        </select>

        <span style="border-left:1px solid #cbd5e1;height:20px;"></span>

        <label>문서 날짜</label>
        <input id="inv-doc-date" type="date" title="발주서: 발주일 / 거래명세서: 출고일">

        <label>비고란 입력</label>
        <input type="checkbox" id="inv-manual-remark" style="width:16px;height:16px;cursor:pointer;" title="체크 시 비고란 내용을 직접 입력할 수 있습니다">
        <label for="inv-manual-remark" style="margin:0;font-size:12px;color:#64748b;cursor:pointer;">수동입력</label>

        <span style="border-left:1px solid #cbd5e1;height:20px;"></span>

        <div style="display:flex;gap:8px;align-items:center;margin-left:auto;padding:6px 12px;background:#f0f9ff;border-radius:6px;border:1px solid #bfdbfe;">
          <input type="checkbox" id="inv-merge-by-supplier" style="width:16px;height:16px;cursor:pointer;">
          <label for="inv-merge-by-supplier" style="margin:0;font-size:13px;font-weight:500;color:#1e40af;cursor:pointer;">매입처별 통합 출력</label>
        </div>
      </div>

      <!-- 세 번째 줄: 출력 버튼 -->
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="inv-export-selected" class="ob-btn success" style="font-size:14px;padding:10px 20px;">✅ 선택항목 출력</button>
      </div>

    </div>

    <!-- 테이블 -->
    <div class="ob-table-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="inv-check-all"></th>
            <th class="sortable" data-sort="orderDate">발주일</th>
            <th class="sortable" data-sort="orderCode">발주번호</th>
            <th class="sortable" data-sort="brand">브랜드</th>
            <th class="sortable" data-sort="supplier">매입처</th>
            <th class="sortable" data-sort="buyer">발주처</th>
            <th class="sortable num" data-sort="itemCount">품목수</th>
            <th class="sortable num" data-sort="totalPurchaseAmount">매입액합계</th>
            <th class="sortable num" data-sort="totalAmount">공급액합계</th>
          </tr>
        </thead>
        <tbody id="inv-result-tbody">
          <tr><td colspan="9" style="text-align:center;color:#777;padding:40px;">조회 결과가 없습니다.</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination-container" id="inv-pagination" style="display:none;">
      <div class="page-info" id="inv-page-info">0-0 / 0</div>
      <div class="pagination-controls">
        <button class="pagination-btn" id="inv-page-first">처음</button>
        <button class="pagination-btn" id="inv-page-prev">이전</button>
        <div id="inv-page-numbers" style="display:flex;gap:4px;"></div>
        <button class="pagination-btn" id="inv-page-next">다음</button>
        <button class="pagination-btn" id="inv-page-last">마지막</button>
      </div>
    </div>

  </div>

  <!-- =============================================== -->
  <!-- 탭 2: 일괄 청구서 (신규) -->
  <!-- =============================================== -->
  <div id="tab-bulk-billing" class="tab-content">

    <!-- 검색 옵션바 -->
    <div class="ob-topbar">
      <label>거래처</label>
      <input id="billing-company" placeholder="발주처 입력" style="min-width:200px;">

      <label>기간</label>
      <input id="billing-start-date" type="date">
      <input id="billing-end-date" type="date">

      <button id="billing-search-btn" class="ob-btn primary">🔍 조회</button>
      <button id="billing-reset-btn" class="ob-btn secondary">초기화</button>
    </div>

    <!-- 청구서 요약 -->
    <div class="billing-summary" id="billing-summary">
      <div class="billing-summary-card">
        <div class="billing-summary-label">총 품목수</div>
        <div class="billing-summary-value" id="billing-total-items">0</div>
      </div>
      <div class="billing-summary-card">
        <div class="billing-summary-label">총 발주수량</div>
        <div class="billing-summary-value" id="billing-total-order-qty">0</div>
      </div>
      <div class="billing-summary-card">
        <div class="billing-summary-label">총 확정수량</div>
        <div class="billing-summary-value" id="billing-total-confirmed-qty">0</div>
      </div>
      <div class="billing-summary-card">
        <div class="billing-summary-label">총 청구금액</div>
        <div class="billing-summary-value" id="billing-total-amount">₩0</div>
      </div>
    </div>

    <!-- 상세 테이블 -->
    <div class="ob-table-wrap">
      <table>
        <thead>
          <tr>
            <th>발주번호</th>
            <th>발주일</th>
            <th>매입처</th>
            <th>브랜드</th>
            <th>제품명</th>
            <th>품목코드</th>
            <th class="num">발주수량</th>
            <th class="num">확정수량</th>
            <th class="num">공급가</th>
            <th class="num">공급액</th>
          </tr>
        </thead>
        <tbody id="billing-result-tbody">
          <tr><td colspan="10" style="text-align:center;color:#777;padding:40px;">거래처와 기간을 선택하여 조회하세요</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 액션 버튼 -->
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:16px;background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1);" id="billing-actions" style="display:none;">
      <button class="ob-btn secondary" id="billing-export-xlsx">📥 엑셀 다운로드</button>
      <button class="ob-btn success" id="billing-export-pdf">📄 PDF 청구서 생성</button>
      <button class="ob-btn primary" id="billing-save-db">💾 청구서 DB 저장 + 발행</button>
    </div>

  </div>

</div>
