<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거래명세서</title>
<style>
  /* ===== 초기화 및 기본 설정 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 10pt;
    color: #333;
    background: #fff;
    line-height: 1.4;
    padding: 10mm;
  }

  .page {
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
    background: #fff;
    position: relative;
  }

  /* 테이블 공통 스타일 */
  table { width: 100%; border-collapse: collapse; border-spacing: 0; margin-bottom: 20px; }
  th, td { padding: 6px 8px; font-size: 10pt; vertical-align: middle; }

  /* ===== 1. 상단 헤더 영역 ===== */
  .header-section {
    text-align: center;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
    margin-bottom: 25px;
  }

  .doc-title {
    font-size: 24pt; font-weight: 800; color: #111; letter-spacing: -0.5px;
  }

  /* ===== 2. 공급자/공급받는자 정보 (카드 형태) ===== */
  .info-grid {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
  }

  .info-box {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 4px;
    overflow: hidden;
  }

  .info-title {
    background: #f3f4f6;
    color: #333;
    font-weight: 700;
    text-align: center;
    padding: 6px 0;
    border-bottom: 1px solid #ddd;
    font-size: 10pt;
    letter-spacing: 2px;
  }

  .clean-table td { border-bottom: 1px solid #eee; padding: 7px 10px; }
  .clean-table tr:last-child td { border-bottom: none; }
  .clean-table td.label { width: 70px; color: #111; font-weight: 600; background: #fff; }
  .clean-table td.value { color: #111; font-weight: 500; }

  /* ===== 3. 금액 합계 (가장 강조) ===== */
  .total-wrapper {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 15px 20px;
    margin-bottom: 25px;
  }

  .total-title { font-size: 11pt; font-weight: 600; color: #111; margin-right: 20px; }
  .total-price { font-size: 16pt; font-weight: 800; color: #111; letter-spacing: -0.5px; }
  .total-text { font-size: 10pt; color: #111; margin-left: 10px; font-weight: 500; }

  /* ===== 4. 품목 리스트 (가독성 중심) ===== */
  .items-section { margin-bottom: 70px; }
  .section-title { font-size: 11pt; font-weight: 700; color: #111; margin-bottom: 8px; border-left: 4px solid #333; padding-left: 8px; line-height: 1; }

  .list-table { border-top: 2px solid #333; border-bottom: 1px solid #aaa; }
  .list-table th {
    background: #f9f9f9;
    color: #111;
    font-weight: 700;
    padding: 10px 5px;
    border-bottom: 1px solid #ddd;
    font-size: 10pt;
  }
  .list-table td {
    padding: 10px 5px;
    border-bottom: 1px solid #eee;
    color: #111;
    font-size: 10pt;
  }
  .list-table th, .list-table td { border-left: none; border-right: none; }

  /* 컬럼 스타일 */
  .tc { text-align: center; }
  .tl { text-align: left; padding-left: 10px !important; }
  .tr { text-align: right; padding-right: 10px !important; }
  .t-bold { font-weight: 600; }
  .col-bg { background-color: #fcfcfc; }

  /* ===== 5. 하단 정보 (부가세, 비고) ===== */
  .bottom-layout { display: flex; gap: 20px; margin-top: 10px; }
  .bottom-left { flex: 1; }
  .bottom-right { width: 35%; }

  .summary-table { border: 1px solid #ddd; margin-bottom: 0; }
  .summary-table td { padding: 8px 10px; border: 1px solid #ddd; }
  .summary-table .label { background: #f3f4f6; width: 100px; text-align: center; font-weight: 600; color: #111; }
  .summary-table .content { min-height: 80px; vertical-align: top; line-height: 1.6; white-space: pre-line; color: #111; }

  .vat-box { border: 1px solid #ddd; background: #fff; padding: 15px; border-radius: 4px; }
  .vat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10pt; font-weight: 600; color: #111; }
  .vat-row.total { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; font-weight: 700; color: #111; }

  /* ===== 6. 푸터 및 인쇄 설정 ===== */
  .footer {
    margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px;
    text-align: center; font-size: 8pt; color: #999;
  }
  .page-number { text-align: center; font-size: 9pt; color: #888; margin-top: 5px; }

  @media print {
    body { padding: 0; background: #fff; }
    .page { max-width: 100%; margin: 0; padding: 0; }
    .page-break { page-break-after: always; }
    .info-title, .total-wrapper, .list-table th, .summary-table .label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<?
  var rowCount = items && items.length ? items.length : 0;
  var ITEMS_PER_PAGE = 15;
  var ITEMS_PER_PAGE_CONTINUATION = 50;
  var totalPages = rowCount <= ITEMS_PER_PAGE ? 1 : (1 + Math.ceil((rowCount - ITEMS_PER_PAGE) / ITEMS_PER_PAGE_CONTINUATION));
  var firstPageItems = Math.min(rowCount, ITEMS_PER_PAGE);
?>

<div class="page">

  <!-- 1. 헤더 -->
  <div class="header-section">
    <div class="doc-title"><?= docTitle || '거 래 명 세 서' ?></div>
  </div>

  <!-- 2. 공급자/납품처 정보 -->
  <div class="info-grid">
    <!-- 공급처 -->
    <div class="info-box">
      <div class="info-title">공급처</div>
      <table class="clean-table">
        <tr>
          <td class="label">상 호</td>
          <td class="value"><?= supplierName ?></td>
        </tr>
        <tr>
          <td class="label">등록번호</td>
          <td class="value"><?= supplierBizNo ?></td>
        </tr>
        <tr>
          <td class="label">대표/담당</td>
          <td class="value"><?= supplierManager ?></td>
        </tr>
        <tr>
          <td class="label">주 소</td>
          <td class="value"><?= supplierAddress || '' ?></td>
        </tr>
      </table>
    </div>

    <!-- 발주처/공급처 (동적) -->
    <div class="info-box">
      <div class="info-title"><?= buyerLabel || '발주처' ?></div>
      <table class="clean-table">
        <tr>
          <td class="label">상 호</td>
          <td class="value"><?= buyerName ?></td>
        </tr>
        <tr>
          <td class="label">등록번호</td>
          <td class="value"><?= buyerBizNo ?></td>
        </tr>
        <tr>
          <td class="label">연락처</td>
          <td class="value"><?= buyerPhone ?></td>
        </tr>
        <tr>
          <td class="label">현장주소</td>
          <td class="value"><?= buyerAddress ?></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 3. 합계 금액 강조 -->
  <div class="total-wrapper">
    <span class="total-title">합계금액 (VAT포함)</span>
    <span class="total-price">₩<?= totalAmount ?></span>
    <span class="total-text">(<?= amountHangul ?>)</span>
  </div>

  <!-- 4. 품목 내역 -->
  <div class="items-section">
    <div class="section-title">
      품목 상세 내역
      <span style="font-weight:400; color:#888; margin-left:5px;">
        (Page 1 / <?= totalPages ?>)
      </span>
    </div>

    <table class="list-table">
      <colgroup>
        <col style="width: 40px;">
        <col style="width: 75px;">
        <col style="width: auto;">
        <col style="width: 50px;">
        <col style="width: 45px;">
        <col style="width: 75px;">
        <col style="width: 100px;">
        <col style="width: 50px;">
      </colgroup>
      <thead>
        <tr>
          <th class="tc">No</th>
          <th class="tc">코드</th>
          <th class="tl">품명</th>
          <th class="tc">규격</th>
          <th class="tr">수량</th>
          <th class="tr">단가</th>
          <th class="tr">금액</th>
          <th class="tc">비고</th>
        </tr>
      </thead>
      <tbody>
        <? for (var i = 0; i < firstPageItems; i++) {
             var it = items[i]; ?>
          <tr>
            <td class="tc" style="color:#111;"><?= i + 1 ?></td>
            <td class="tc" style="font-family:'Courier New'"><?= it.code || '' ?></td>
            <td class="tl"><?= it.name || '' ?></td>
            <td class="tc" style="color:#111;"><?= it.spec || '' ?></td>
            <td class="tr"><?= it.qty || '' ?></td>
            <td class="tr" style="color:#111;"><?= it.price || '' ?></td>
            <td class="tr t-bold" style="color:#111;"><?= it.amount || '' ?></td>
            <td class="tc" style="color:#111;"><?= it.note || '' ?></td>
          </tr>
        <? } ?>
      </tbody>
    </table>
  </div>

  <!-- 5. 하단 정보 -->
  <div class="bottom-layout">
    <!-- 왼쪽: 비고 -->
    <div class="bottom-left">
      <table class="summary-table">
        <tr>
          <td class="label">비 고</td>
          <td class="content"><?= remark || '' ?></td>
        </tr>
      </table>
    </div>

    <!-- 오른쪽: 금액 요약 -->
    <? if (totalVatNum > 0) { ?>
    <div class="bottom-right">
      <div class="vat-box">
        <div class="vat-row">
          <span>공급가액</span>
          <span>₩<?= totalSupply ?></span>
        </div>
        <div class="vat-row">
          <span>부가세 (10%)</span>
          <span>₩<?= totalVat ?></span>
        </div>
        <div class="vat-row total">
          <span>합 계</span>
          <span>₩<?= totalAmount ?></span>
        </div>
      </div>
    </div>
    <? } ?>
  </div>

  <!-- 푸터 -->
  <div class="footer">
    본 문서는 (주)원브릿지 ERP 시스템에서 전자적으로 발행되었습니다.<br>
    문의사항: <?= supplierManager ?> <? if (supplierPhone) { ?>(<?= supplierPhone ?>)<? } ?>
  </div>

</div>

<!-- ===== 추가 페이지 ===== -->
<? for (var pageNum = 2; pageNum <= totalPages; pageNum++) {
     var startIdx = ITEMS_PER_PAGE + (pageNum - 2) * ITEMS_PER_PAGE_CONTINUATION;
     var endIdx = Math.min(startIdx + ITEMS_PER_PAGE_CONTINUATION, rowCount);
?>

<div class="page-break"></div>
<div class="page">

  <div class="header-section" style="margin-bottom: 15px; padding-bottom: 5px;">
    <div class="doc-title" style="font-size: 16pt;"><?= docTitle || '거래명세서' ?> (계속)</div>
    <div style="text-align: center; font-size: 9pt; color: #888; margin-top: 5px;">Page <?= pageNum ?>/<?= totalPages ?></div>
  </div>

  <div class="items-section">
    <table class="list-table">
      <colgroup>
        <col style="width: 40px;">
        <col style="width: 75px;">
        <col style="width: auto;">
        <col style="width: 50px;">
        <col style="width: 45px;">
        <col style="width: 75px;">
        <col style="width: 100px;">
        <col style="width: 50px;">
      </colgroup>
      <thead>
        <tr>
          <th class="tc">No</th>
          <th class="tc">코드</th>
          <th class="tl">품명</th>
          <th class="tc">규격</th>
          <th class="tr">수량</th>
          <th class="tr">단가</th>
          <th class="tr">금액</th>
          <th class="tc">비고</th>
        </tr>
      </thead>
      <tbody>
        <? for (var k = startIdx; k < endIdx; k++) {
             var it = items[k]; ?>
          <tr>
            <td class="tc" style="color:#111;"><?= k + 1 ?></td>
            <td class="tc" style="font-family:'Courier New'"><?= it.code || '' ?></td>
            <td class="tl"><?= it.name || '' ?></td>
            <td class="tc" style="color:#111;"><?= it.spec || '' ?></td>
            <td class="tr"><?= it.qty || '' ?></td>
            <td class="tr" style="color:#111;"><?= it.price || '' ?></td>
            <td class="tr t-bold" style="color:#111;"><?= it.amount || '' ?></td>
            <td class="tc" style="color:#111;"><?= it.note || '' ?></td>
          </tr>
        <? } ?>
      </tbody>
    </table>
  </div>

  <div class="footer">
    (주)원브릿지 ERP 시스템 - <?= pageNum ?> 페이지
  </div>
</div>
<? } ?>

</body>
</html>
