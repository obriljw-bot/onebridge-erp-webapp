<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거래명세서</title>
<!-- 고품질 한글 웹폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 초기화 및 기본 설정 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 8pt;
    color: #000;
    background: #fff;
    line-height: 1.4;
    padding: 10mm;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .page {
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
    background: #fff;
    position: relative;
  }

  /* 테이블 공통 스타일 */
  table { width: 100%; border-collapse: collapse; border-spacing: 0; margin-bottom: 15px; }
  th, td { padding: 4px 6px; font-size: 8pt; vertical-align: middle; }

  /* ===== 1. 상단 헤더 영역 ===== */
  .header-section {
    text-align: center;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
    margin-bottom: 25px;
  }

  .doc-title {
    font-size: 20pt; font-weight: 800; color: #000; letter-spacing: -0.5px;
  }

  /* ===== 2. 공급자/공급받는자 정보 (카드 형태) ===== */
  .info-grid {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    justify-content: space-between;
  }

  .info-box {
    flex: 0 0 40%;
    border: none;
    border-bottom: 1px solid #ddd;
    overflow: hidden;
  }

  .info-title {
    background: #f3f4f6;
    color: #333;
    font-weight: 700;
    text-align: center;
    padding: 4px 0;
    border-bottom: 1px solid #ddd;
    font-size: 8pt;
    letter-spacing: 1px;
  }

  .clean-table td { border-bottom: 1px solid #eee; padding: 5px 8px; }
  .clean-table tr:last-child td { border-bottom: none; }
  .clean-table td.label { width: 60px; color: #000; font-weight: 600; background: #fff; font-size: 8pt; }
  .clean-table td.value { color: #000; font-weight: 500; font-size: 8pt; word-break: break-all; }

  /* ===== 3. 품목 리스트 (가독성 중심) ===== */
  .items-section { margin-bottom: 50px; }
  .section-title { font-size: 9pt; font-weight: 700; color: #000; margin-bottom: 6px; border-left: 3px solid #333; padding-left: 6px; line-height: 1; }

  .list-table { border-top: 2px solid #333; border-bottom: 1px solid #aaa; }
  .list-table th {
    background: #f9f9f9;
    color: #000;
    font-weight: 700;
    padding: 6px 4px;
    border-bottom: 1px solid #ddd;
    font-size: 8pt;
  }
  .list-table td {
    padding: 6px 4px;
    border-bottom: 1px solid #eee;
    color: #000;
    font-size: 8pt;
  }
  .list-table th, .list-table td { border-left: none; border-right: none; }
  .list-table td.code-col { color: #000 !important; font-family: 'Courier New', monospace !important; white-space: nowrap !important; }

  /* 컬럼 스타일 */
  .tc { text-align: center; word-wrap: break-word; word-break: break-word; }
  .tl { text-align: left; padding-left: 10px !important; word-wrap: break-word; word-break: break-word; }
  .tr { text-align: right; padding-right: 10px !important; }
  .t-bold { font-weight: 600; }
  .col-bg { background-color: #fcfcfc; }

  /* ===== 5. 하단 정보 (비고) ===== */
  .bottom-layout { margin-top: 20px; }

  .summary-table { border: 1px solid #ddd; margin-bottom: 0; }
  .summary-table td { padding: 6px 8px; border: 1px solid #ddd; font-size: 8pt; }
  .summary-table .label { background: #f3f4f6; width: 80px; text-align: center; font-weight: 600; color: #000; }
  .summary-table .content { min-height: 60px; vertical-align: top; line-height: 1.5; white-space: pre-line; color: #000; word-wrap: break-word; word-break: break-word; }

  /* ===== 6. 푸터 및 인쇄 설정 ===== */
  .footer {
    margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px;
    text-align: center; font-size: 8pt; color: #999;
  }
  .page-number { text-align: center; font-size: 9pt; color: #888; margin-top: 5px; }

  @page {
    size: A4;
    margin: 10mm 15mm;
  }

  @media print {
    body {
      padding: 0;
      background: #fff;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }

    * {
      -webkit-font-smoothing: subpixel-antialiased;
      text-rendering: optimizeLegibility;
    }

    .page { max-width: 100%; margin: 0; padding: 0; }
    .page-break { page-break-after: always; }
    .info-title, .list-table th, .summary-table .label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<?
  var rowCount = items && items.length ? items.length : 0;
  var ITEMS_PER_PAGE = 10;
  var ITEMS_PER_PAGE_CONTINUATION = 50;
  var totalPages = rowCount <= ITEMS_PER_PAGE ? 1 : (1 + Math.ceil((rowCount - ITEMS_PER_PAGE) / ITEMS_PER_PAGE_CONTINUATION));
  var firstPageItems = Math.min(rowCount, ITEMS_PER_PAGE);
?>

<div class="page">

  <!-- 1. 헤더 -->
  <div class="header-section">
    <div class="doc-title"><?= docTitle || '거 래 명 세 서' ?></div>
  </div>

  <!-- 2. 공급자/납품처 정보 -->
  <div class="info-grid">
    <!-- 공급처 -->
    <div class="info-box">
      <div class="info-title">공급처</div>
      <table class="clean-table">
        <tr>
          <td class="label">상 호</td>
          <td class="value"><?= supplierName ?></td>
        </tr>
        <tr>
          <td class="label">등록번호</td>
          <td class="value"><?= supplierBizNo ?></td>
        </tr>
        <tr>
          <td class="label">대표/담당</td>
          <td class="value"><?= supplierManager ?></td>
        </tr>
        <tr>
          <td class="label">주 소</td>
          <td class="value"><?= supplierAddress || '' ?></td>
        </tr>
      </table>
    </div>

    <!-- 발주처/공급처 (동적) -->
    <div class="info-box">
      <div class="info-title"><?= buyerLabel || '발주처' ?></div>
      <table class="clean-table">
        <tr>
          <td class="label">상 호</td>
          <td class="value"><?= buyerName ?></td>
        </tr>
        <tr>
          <td class="label">등록번호</td>
          <td class="value"><?= buyerBizNo ?></td>
        </tr>
        <tr>
          <td class="label">연락처</td>
          <td class="value"><?= buyerPhone ?></td>
        </tr>
        <tr>
          <td class="label">현장주소</td>
          <td class="value"><?= buyerAddress ?></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 4. 품목 내역 -->
  <div class="items-section">
    <div class="section-title">
      품목 상세 내역
      <span style="font-weight:400; color:#888; margin-left:5px;">
        (Page 1 / <?= totalPages ?>)
      </span>
    </div>

    <table class="list-table">
      <colgroup>
        <col style="width: 40px;">
        <col style="width: 75px;">
        <col style="width: auto;">
        <col style="width: 50px;">
        <col style="width: 45px;">
        <col style="width: 75px;">
        <col style="width: 100px;">
        <col style="width: 50px;">
      </colgroup>
      <thead>
        <tr>
          <th class="tc">No</th>
          <th class="tc">코드</th>
          <th class="tc">품명</th>
          <th class="tc">규격</th>
          <th class="tr">수량</th>
          <th class="tr">단가</th>
          <th class="tr">금액</th>
          <th class="tc">비고</th>
        </tr>
      </thead>
      <tbody>
        <? for (var i = 0; i < firstPageItems; i++) {
             var it = items[i]; ?>
          <tr>
            <td class="tc" style="color:#000;"><?= i + 1 ?></td>
            <td class="tc code-col"><?= it.code || '' ?></td>
            <td class="tl"><?= it.name || '' ?></td>
            <td class="tc" style="color:#000;"><?= it.spec || '' ?></td>
            <td class="tr"><?= it.qty || '' ?></td>
            <td class="tr" style="color:#000;"><?= it.price || '' ?></td>
            <td class="tr t-bold" style="color:#000;"><?= it.amount || '' ?></td>
            <td class="tc" style="color:#000;"><?= it.note || '' ?></td>
          </tr>
        <? } ?>
      </tbody>
      <tfoot>
        <tr style="border-top: 1px solid #ccc;">
          <td colspan="4" class="tr" style="font-weight: 700; padding: 8px 10px; border-bottom: 1px solid #ccc;">합계수량</td>
          <td class="tr" style="font-weight: 700; padding: 8px 10px; border-bottom: 1px solid #ccc;"><?= totalQty || '' ?></td>
          <? if (totalVatNum >= 0) { ?>
          <td class="tr" style="font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #ccc;">공급가액</td>
          <td class="tr" style="font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #ccc;">₩<?= totalSupply ?></td>
          <? } else { ?>
          <td colspan="2" style="border-bottom: 1px solid #ccc;"></td>
          <? } ?>
          <td style="border-bottom: 1px solid #ccc;"></td>
        </tr>
        <? if (totalVatNum >= 0) { ?>
        <tr>
          <td colspan="5" style="border-bottom: 1px solid #ccc;"></td>
          <td class="tr" style="font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #ccc;">부가세 (10%)</td>
          <td class="tr" style="font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #ccc;">₩<?= totalVat ?></td>
          <td style="border-bottom: 1px solid #ccc;"></td>
        </tr>
        <tr>
          <td colspan="5" style="border-bottom: 1px solid #ccc;"></td>
          <td class="tr" style="font-weight: 700; padding: 8px 10px; border-bottom: 1px solid #ccc; background: #f9f9f9;">합 계</td>
          <td class="tr" style="font-weight: 700; padding: 8px 10px; border-bottom: 1px solid #ccc; background: #f9f9f9;">₩<?= totalAmount ?></td>
          <td style="border-bottom: 1px solid #ccc; background: #f9f9f9;"></td>
        </tr>
        <? } ?>
      </tfoot>
    </table>
  </div>

  <!-- 5. 하단 정보 (비고란) -->
  <div class="bottom-layout">
    <table class="summary-table" style="width: 100%;">
      <tr>
        <td class="label">비 고</td>
        <td class="content"><?= remark || '' ?></td>
      </tr>
    </table>
  </div>

  <!-- 푸터 -->
  <div class="footer">
    본 문서는 (주)원브릿지 ERP 시스템에서 전자적으로 발행되었습니다.<br>
    문의사항: <?= supplierManager ?> <? if (supplierPhone) { ?>(<?= supplierPhone ?>)<? } ?>
  </div>

</div>

<!-- ===== 추가 페이지 ===== -->
<? for (var pageNum = 2; pageNum <= totalPages; pageNum++) {
     var startIdx = ITEMS_PER_PAGE + (pageNum - 2) * ITEMS_PER_PAGE_CONTINUATION;
     var endIdx = Math.min(startIdx + ITEMS_PER_PAGE_CONTINUATION, rowCount);
?>

<div class="page-break"></div>
<div class="page">

  <div class="header-section" style="margin-bottom: 15px; padding-bottom: 5px;">
    <div class="doc-title" style="font-size: 16pt;"><?= docTitle || '거래명세서' ?> (계속)</div>
    <div style="text-align: center; font-size: 9pt; color: #888; margin-top: 5px;">Page <?= pageNum ?>/<?= totalPages ?></div>
  </div>

  <div class="items-section">
    <table class="list-table">
      <colgroup>
        <col style="width: 40px;">
        <col style="width: 75px;">
        <col style="width: auto;">
        <col style="width: 50px;">
        <col style="width: 45px;">
        <col style="width: 75px;">
        <col style="width: 100px;">
        <col style="width: 50px;">
      </colgroup>
      <thead>
        <tr>
          <th class="tc">No</th>
          <th class="tc">코드</th>
          <th class="tc">품명</th>
          <th class="tc">규격</th>
          <th class="tr">수량</th>
          <th class="tr">단가</th>
          <th class="tr">금액</th>
          <th class="tc">비고</th>
        </tr>
      </thead>
      <tbody>
        <? for (var k = startIdx; k < endIdx; k++) {
             var it = items[k]; ?>
          <tr>
            <td class="tc" style="color:#000;"><?= k + 1 ?></td>
            <td class="tc code-col"><?= it.code || '' ?></td>
            <td class="tl"><?= it.name || '' ?></td>
            <td class="tc" style="color:#000;"><?= it.spec || '' ?></td>
            <td class="tr"><?= it.qty || '' ?></td>
            <td class="tr" style="color:#000;"><?= it.price || '' ?></td>
            <td class="tr t-bold" style="color:#000;"><?= it.amount || '' ?></td>
            <td class="tc" style="color:#000;"><?= it.note || '' ?></td>
          </tr>
        <? } ?>
      </tbody>
    </table>
  </div>

  <div class="footer">
    (주)원브릿지 ERP 시스템 - <?= pageNum ?> 페이지
  </div>
</div>
<? } ?>

</body>
</html>
