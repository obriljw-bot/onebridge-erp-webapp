<script>
  // ===== 전역 네임스페이스 =====
  window.OB = window.OB || {};
  
  // ===== 페이지 파라미터 초기 설정 =====
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var pageFromUrl = urlParams.get('page') || 'orderFile';
    
    OB.state = {
      currentPage: pageFromUrl,
      isLoading: false,
      initializedPages: {}
    };
  })();

  // ===== 공통 페이지 초기화 로직 =====
  OB.initCurrentPage = function(page) {
    console.log('🔧 initCurrentPage 호출:', page);
    
    if (OB.state.initializedPages[page]) {
      console.log('⏭️  이미 초기화됨:', page);
      return;
    }

    var initFuncName = null;

    switch(page) {
      case 'orderInput':
        initFuncName = 'initOrderInputPage';
        break;
      case 'orderFile':
        initFuncName = 'initOrderFilePage';
        break;
      case 'dashboard':
        initFuncName = 'initDashboardPage';
        break;
      case 'orderList':
        initFuncName = 'initOrderListPage';
        break;
      case 'invoiceOutput':
        initFuncName = 'initInvoiceOutputPage';
        break;
      case 'transactionLedger':
        initFuncName = 'initTransactionLedgerPage';
        break;
      case 'settlement':
        initFuncName = 'initSettlementPage';
        break;
      case 'purchaseSettlement':
        initFuncName = 'initPurchaseSettlementPage';
        break;
      case 'salesSettlement':
        initFuncName = 'initSalesSettlementPage';
        break;
      case 'monthlyClosing':
        initFuncName = 'initMonthlyClosingPage';
        break;
      case 'billingManagement':
        initFuncName = 'initBillingManagementPage';
        break;
      case 'invoiceManagement':
        initFuncName = 'initInvoiceManagementPage';
        break;
      case 'paymentManagement':
        initFuncName = 'initPaymentManagementPage';
        break;
      case 'receivable':
        initFuncName = 'initReceivablePage';
        break;
      case 'settings':
        initFuncName = 'initSettingsPage';
        break;
    }

    if (initFuncName && typeof OB[initFuncName] === 'function') {
      console.log('✅ 초기화 함수 실행:', initFuncName);
      
      try {
        OB[initFuncName]();
        OB.state.initializedPages[page] = true;
        console.log('✅ 초기화 완료:', page);
      } catch (err) {
        console.error('❌ 초기화 실패:', page, err);
      }
    } else {
      console.warn('⚠️  초기화 함수 없음:', page, initFuncName);
    }
  };

  // ===== 로딩 오버레이 =====
  OB.showLoading = function (message) {
    var overlay = document.getElementById('ob-loading-overlay');
    var textEl = document.getElementById('ob-loading-text');
    if (!overlay || !textEl) return;
    textEl.textContent = message || '처리 중입니다.';
    overlay.classList.add('show');
    OB.state.isLoading = true;
  };

  OB.hideLoading = function () {
    var overlay = document.getElementById('ob-loading-overlay');
    if (!overlay) return;
    overlay.classList.remove('show');
    OB.state.isLoading = false;
  };

  // ===== API 래퍼 =====
  OB.api = {
    ping: function () {
      OB.showLoading('시스템 상태 확인 중.');
      google.script.run
        .withSuccessHandler(function (res) {
          OB.hideLoading();
          console.log('ping result:', res);
          alert('서버 연결 완료: ' + (res && res.status));
        })
        .withFailureHandler(function (err) {
          OB.hideLoading();
          console.error(err);
          alert('서버 연결 실패');
        })
        .ping();
    },

    loadPage: function (page) {
      OB.showLoading('페이지 불러오는 중...');
      console.log('📄 페이지 로드 시작:', page);

      google.script.run
        .withSuccessHandler(function (html) {
          OB.hideLoading();

          var container = document.getElementById('app-main');
          if (!container) {
            console.error('❌ app-main 컨테이너를 찾을 수 없음');
            return;
          }

          container.innerHTML = html;

          // 페이지 상태 업데이트
          OB.state.currentPage = page;
          
          // 새로 로드한 페이지는 초기화 상태 리셋
          OB.state.initializedPages[page] = false;

          // 네비게이션 하이라이트
          OB.highlightActiveNav(page);

          // 약간의 지연 후 초기화 (DOM 렌더링 완료 대기)
          setTimeout(function() {
            OB.initCurrentPage(page);
          }, 50);
        })
        .withFailureHandler(function (err) {
          OB.hideLoading();
          console.error('❌ 페이지 로드 실패:', err);
          alert('페이지 로드 실패: ' + err.message);
        })
        .getPageContent(page);
    }
  };

  // ===== 네비게이션 액티브 표시 =====
  OB.highlightActiveNav = function(page) {
    var links = document.querySelectorAll('.ob-nav-link');
    links.forEach(function(link) {
      var navPage = link.getAttribute('data-nav-page');
      if (navPage === page) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  };

  // ===== 네비게이션 이벤트 설정 =====
  function setupNavLinks() {
    var links = document.querySelectorAll('.ob-nav-link');
    links.forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        var page = link.getAttribute('data-nav-page');
        if (page) OB.api.loadPage(page);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 DOMContentLoaded - 초기 페이지:', OB.state.currentPage);

    setupNavLinks();
    OB.highlightActiveNav(OB.state.currentPage);
    OB.initCurrentPage(OB.state.currentPage);
  });

  // ===== 유틸리티 함수 =====
  OB.formatNumber = function(num) {
    if (num === null || num === undefined || num === '') return '0';
    return Number(num).toLocaleString('ko-KR');
  };

  OB.formatDate = function(date) {
    if (!date) return '';

    // 문자열이든 Date 객체든 항상 Date로 변환 후 년-월-일만 추출
    var d = date instanceof Date ? date : new Date(date);

    // Invalid Date 체크
    if (isNaN(d.getTime())) return '';

    var year = d.getFullYear();
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');

    return year + '-' + month + '-' + day;
  };

  // ===== 청구서 네비게이션 함수 (컨텍스트 기반 - Phase 2) =====
  OB.navigateToInvoice = function(orderNumber, company) {
    if (!orderNumber) {
      alert('발주번호가 필요합니다.');
      return;
    }

    OB.showLoading('청구서 확인 중...');

    // 1. 청구서 존재 여부 확인
    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('청구서 확인 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        if (result.exists && result.invoices.length > 0) {
          // 청구서 존재 → 네비게이션
          var invoice = result.invoices[0];
          alert('기존 청구서가 있습니다.\n청구ID: ' + invoice.invoiceId + '\n상태: ' + invoice.status);

          // billingManagement 페이지로 이동 + 필터링
          OB.state.pendingInvoiceFilter = orderNumber;
          OB.api.loadPage('billingManagement');

        } else {
          // 청구서 없음 → 생성 제안
          if (confirm('발주번호: ' + orderNumber + '\n\n청구서가 없습니다. 생성하시겠습니까?')) {
            OB.createDirectInvoiceForOrder(orderNumber, company);
          }
        }
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        alert('서버 오류: ' + error.message);
      })
      .checkInvoiceExistsApi({ orderNumber: orderNumber });
  };

  // ===== 청구서 직접 생성 함수 (Track A - Fast Path, Phase 1) =====
  OB.createDirectInvoiceForOrder = function(orderNumber, company) {
    if (!orderNumber || !company) {
      alert('발주번호와 거래처 정보가 필요합니다.');
      return;
    }

    OB.showLoading('청구서 생성 중...');

    var today = new Date();
    var invoiceDateStr = today.getFullYear() + '-' +
                         String(today.getMonth() + 1).padStart(2, '0') + '-' +
                         String(today.getDate()).padStart(2, '0');

    var params = {
      orderNumbers: [orderNumber],
      type: 'SALES',  // 매출 청구서
      company: company,
      invoiceDate: invoiceDateStr,
      notes: '거래원장에서 직접 생성'
    };

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('청구서 생성 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('청구서가 생성되었습니다!\n청구ID: ' + result.invoiceId);

        // 청구서 관리 페이지로 이동
        OB.state.pendingInvoiceFilter = orderNumber;
        OB.api.loadPage('invoiceManagement');
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        alert('서버 오류: ' + error.message);
      })
      .createDirectBillingApi(params);
  };

  // ===== 포맷 함수 (Phase 4.1) =====
  OB.formatCurrency = function(amount) {
    if (amount === null || amount === undefined || amount === '') return '₩0';
    return '₩' + Number(amount).toLocaleString('ko-KR');
  };

  OB.getStatusBadge = function(status, type) {
    if (!status) return '<span class="badge badge-gray">-</span>';

    var config = {
      // 거래 상태
      transaction: {
        '매입발주': { label: '매입발주', color: '#3B82F6', bg: '#DBEAFE' },
        '매입결제': { label: '매입결제', color: '#8B5CF6', bg: '#EDE9FE' },
        '매출결제': { label: '매출결제', color: '#10B981', bg: '#D1FAE5' },
        '출고': { label: '출고', color: '#059669', bg: '#A7F3D0' }
      },
      // 발주 진행 상태
      order: {
        '대기': { label: '대기', color: '#6B7280', bg: '#F3F4F6' },
        '확정': { label: '확정', color: '#059669', bg: '#D1FAE5' },
        '완료': { label: '완료', color: '#1D4ED8', bg: '#DBEAFE' },
        '취소': { label: '취소', color: '#DC2626', bg: '#FEE2E2' }
      },
      // 청구서 상태
      billing: {
        'DRAFT': { label: '임시', color: '#6B7280', bg: '#F3F4F6' },
        'PENDING': { label: '대기', color: '#D97706', bg: '#FEF3C7' },
        'PAID': { label: '완료', color: '#059669', bg: '#D1FAE5' },
        'CANCELLED': { label: '취소', color: '#DC2626', bg: '#FEE2E2' }
      },
      // 마감 상태
      settlement: {
        'OPEN': { label: '진행중', color: '#3B82F6', bg: '#DBEAFE' },
        'CLOSED': { label: '완료', color: '#059669', bg: '#D1FAE5' },
        'CANCELLED': { label: '취소', color: '#DC2626', bg: '#FEE2E2' }
      }
    };

    var typeConfig = config[type] || config.order;
    var statusConfig = typeConfig[status] || { label: status, color: '#6B7280', bg: '#F3F4F6' };

    return '<span class="badge" style="color:' + statusConfig.color + ';background:' + statusConfig.bg + ';padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;">' +
           statusConfig.label + '</span>';
  };

  // ===========================================================
  // ✅ InvoiceOutput 페이지 초기화 함수
  // ===========================================================
  OB.invoiceOutputState = {
    allOrders: [],
    filteredOrders: [],
    currentPage: 1,
    itemsPerPage: 20,
    currentSort: {
      column: 'orderDate',
      direction: 'desc'
    },
    modesByOrder: {}
  };

  OB.initInvoiceOutputPage = function() {
    console.log('🔧 InvoiceOutput 페이지 초기화 시작');

    var state = OB.invoiceOutputState;

    // ========================================
    // 유틸리티 함수
    // ========================================
    function formatDateInput(d) {
      if (!d) return '';
      if (!(d instanceof Date)) d = new Date(d);
      if (isNaN(d.getTime())) return '';
      var year = d.getFullYear();
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return year + month + day;
    }

    function renderEmpty() {
      var tbody = document.getElementById("inv-result-tbody");
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#777;padding:40px;">조회 결과가 없습니다.</td></tr>';
      }
      document.getElementById('inv-pagination').style.display = 'none';
      document.getElementById('inv-bulk-select').style.display = 'none';
    }

    // ========================================
    // 1. Excel 다운로드
    // ========================================
    function downloadExcel() {
      // 체크된 발주번호 수집
      var selectedOrderCodes = [];
      document.querySelectorAll(".inv-row-check:checked").forEach(function(c) {
        selectedOrderCodes.push(c.dataset.oc);
      });

      if (selectedOrderCodes.length === 0) {
        alert('다운로드할 발주를 선택해주세요.');
        return;
      }

      // 선택된 발주만 필터링
      var selectedOrders = state.filteredOrders.filter(function(order) {
        return selectedOrderCodes.indexOf(order.orderCode) !== -1;
      });

      if (selectedOrders.length === 0) {
        alert('선택된 발주 데이터를 찾을 수 없습니다.');
        return;
      }

      var csv = [];

      // 헤더
      csv.push(['발주일', '발주번호', '발주처', '브랜드', '매입처', '품목수', '매입액', '공급액'].join(','));

      // 데이터
      selectedOrders.forEach(function(order) {
        var row = [
          OB.formatDate(order.orderDate),
          order.orderCode || '',
          order.buyer || '',
          order.brand || '',
          order.supplier || '',
          order.itemCount || 0,
          order.totalPurchaseAmount || 0,
          order.totalAmount || 0
        ];
        csv.push(row.join(','));
      });

      // BOM 추가 (한글 깨짐 방지)
      var csvContent = '\uFEFF' + csv.join('\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', '발주출력목록_' + formatDateInput(new Date()) + '.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      console.log('✅ Excel 다운로드 완료: ' + selectedOrders.length + '건');
    }

    // ========================================
    // 2. 정렬 기능
    // ========================================
    function sortOrders(column, direction) {
      state.filteredOrders.sort(function(a, b) {
        var aVal = a[column];
        var bVal = b[column];

        // 날짜 처리
        if (column === 'orderDate') {
          aVal = new Date(aVal).getTime();
          bVal = new Date(bVal).getTime();
        }

        // 숫자 처리
        if (column === 'itemCount' || column === 'totalPurchaseAmount' || column === 'totalAmount') {
          aVal = Number(aVal) || 0;
          bVal = Number(bVal) || 0;
        }

        // 문자열 처리
        if (typeof aVal === 'string') {
          aVal = aVal.toLowerCase();
          bVal = bVal.toLowerCase();
        }

        if (aVal < bVal) return direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return direction === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function updateSortIndicators() {
      var headers = document.querySelectorAll('.ob-table-wrap th.sortable');
      headers.forEach(function(header) {
        header.classList.remove('asc', 'desc');
        if (header.dataset.sort === state.currentSort.column) {
          header.classList.add(state.currentSort.direction);
        }
      });
    }

    // ========================================
    // 3. 페이지네이션
    // ========================================
    function renderPagination(totalPages) {
      var paginationContainer = document.getElementById('inv-pagination');
      var pageInfo = document.getElementById('inv-page-info');
      var pageNumbers = document.getElementById('inv-page-numbers');
      var btnFirst = document.getElementById('inv-page-first');
      var btnPrev = document.getElementById('inv-page-prev');
      var btnNext = document.getElementById('inv-page-next');
      var btnLast = document.getElementById('inv-page-last');

      if (totalPages <= 1) {
        paginationContainer.style.display = 'none';
        return;
      }

      paginationContainer.style.display = 'flex';

      // 버튼 활성화/비활성화
      btnFirst.disabled = state.currentPage === 1;
      btnPrev.disabled = state.currentPage === 1;
      btnNext.disabled = state.currentPage === totalPages;
      btnLast.disabled = state.currentPage === totalPages;

      // 페이지 번호 버튼
      pageNumbers.innerHTML = '';

      var maxButtons = 5;
      var startPage = Math.max(1, state.currentPage - Math.floor(maxButtons / 2));
      var endPage = Math.min(totalPages, startPage + maxButtons - 1);

      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      for (var i = startPage; i <= endPage; i++) {
        var btn = document.createElement('button');
        btn.className = 'pagination-btn';
        btn.textContent = i;
        btn.dataset.page = i;

        if (i === state.currentPage) {
          btn.classList.add('active');
        }

        btn.addEventListener('click', function() {
          state.currentPage = parseInt(this.dataset.page);
          renderOrders();
        });

        pageNumbers.appendChild(btn);
      }

      // 페이지 정보
      var startIdx = (state.currentPage - 1) * state.itemsPerPage + 1;
      var endIdx = Math.min(state.currentPage * state.itemsPerPage, state.filteredOrders.length);
      pageInfo.textContent = startIdx + '-' + endIdx + ' / ' + state.filteredOrders.length;

      // 버튼 이벤트
      btnFirst.onclick = function() { state.currentPage = 1; renderOrders(); };
      btnPrev.onclick = function() { if (state.currentPage > 1) { state.currentPage--; renderOrders(); } };
      btnNext.onclick = function() { if (state.currentPage < totalPages) { state.currentPage++; renderOrders(); } };
      btnLast.onclick = function() { state.currentPage = totalPages; renderOrders(); };
    }

    // ========================================
    // 4. 브랜드/매입처별 일괄 선택
    // ========================================
    function renderBulkSelectButtons() {
      var bulkSelectContainer = document.getElementById('inv-bulk-select');
      var brandBtnsContainer = document.getElementById('inv-brand-btns');
      var supplierBtnsContainer = document.getElementById('inv-supplier-btns');

      if (state.filteredOrders.length === 0) {
        bulkSelectContainer.style.display = 'none';
        return;
      }

      bulkSelectContainer.style.display = 'flex';

      // 브랜드 목록 추출
      var brands = {};
      var suppliers = {};
      state.filteredOrders.forEach(function(order) {
        if (order.brand) brands[order.brand] = true;
        if (order.supplier) suppliers[order.supplier] = true;
      });

      var brandList = Object.keys(brands).sort();
      var supplierList = Object.keys(suppliers).sort();

      // 브랜드 버튼 생성
      brandBtnsContainer.innerHTML = '';
      brandList.forEach(function(brand) {
        var btn = document.createElement('button');
        btn.className = 'bulk-select-btn';
        btn.textContent = brand;
        btn.addEventListener('click', function() {
          selectByBrand(brand);
        });
        brandBtnsContainer.appendChild(btn);
      });

      // 매입처 버튼 생성
      supplierBtnsContainer.innerHTML = '';
      supplierList.forEach(function(supplier) {
        var btn = document.createElement('button');
        btn.className = 'bulk-select-btn';
        btn.textContent = supplier;
        btn.addEventListener('click', function() {
          selectBySupplier(supplier);
        });
        supplierBtnsContainer.appendChild(btn);
      });
    }

    function selectByBrand(brand) {
      var checkboxes = document.querySelectorAll('.inv-row-check');
      var startIdx = (state.currentPage - 1) * state.itemsPerPage;
      var endIdx = Math.min(startIdx + state.itemsPerPage, state.filteredOrders.length);

      for (var i = startIdx; i < endIdx; i++) {
        var order = state.filteredOrders[i];
        if (order.brand === brand) {
          var checkbox = checkboxes[i - startIdx];
          if (checkbox) checkbox.checked = true;
        }
      }
    }

    function selectBySupplier(supplier) {
      var checkboxes = document.querySelectorAll('.inv-row-check');
      var startIdx = (state.currentPage - 1) * state.itemsPerPage;
      var endIdx = Math.min(startIdx + state.itemsPerPage, state.filteredOrders.length);

      for (var i = startIdx; i < endIdx; i++) {
        var order = state.filteredOrders[i];
        if (order.supplier === supplier) {
          var checkbox = checkboxes[i - startIdx];
          if (checkbox) checkbox.checked = true;
        }
      }
    }

    // ========================================
    // 테이블 렌더링
    // ========================================
    function renderOrders() {
      var tbody = document.getElementById('inv-result-tbody');

      if (!state.filteredOrders || state.filteredOrders.length === 0) {
        renderEmpty();
        return;
      }

      // 정렬
      sortOrders(state.currentSort.column, state.currentSort.direction);
      updateSortIndicators();

      // 페이지네이션 계산
      var totalPages = Math.ceil(state.filteredOrders.length / state.itemsPerPage);
      var startIdx = (state.currentPage - 1) * state.itemsPerPage;
      var endIdx = Math.min(startIdx + state.itemsPerPage, state.filteredOrders.length);
      var pageOrders = state.filteredOrders.slice(startIdx, endIdx);

      // 테이블 렌더링
      tbody.innerHTML = '';
      pageOrders.forEach(function(o) {
        var mode = state.modesByOrder[o.orderCode] || document.getElementById('inv-default-mode').value || 'auto';
        var dateStr = OB.formatDate(o.orderDate);

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><input type="checkbox" class="inv-row-check" data-oc="' + o.orderCode + '"></td>' +
          '<td>' + dateStr + '</td>' +
          '<td>' + (o.orderCode || '') + '</td>' +
          '<td>' + (o.brand || '') + '</td>' +
          '<td>' + (o.supplier || '') + '</td>' +
          '<td>' + (o.buyer || '') + '</td>' +
          '<td class="num">' + (o.itemCount || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(o.totalPurchaseAmount) + '</td>' +
          '<td class="num">' + OB.formatNumber(o.totalAmount) + '</td>' +
          '<td>' +
            '<select class="inv-mode" data-oc="' + o.orderCode + '">' +
              '<option value="auto"' + (mode === 'auto' ? ' selected' : '') + '>자동</option>' +
              '<option value="full"' + (mode === 'full' ? ' selected' : '') + '>전체</option>' +
              '<option value="short"' + (mode === 'short' ? ' selected' : '') + '>단축</option>' +
            '</select>' +
          '</td>';

        tbody.appendChild(tr);
      });

      // 출력방식 변경 이벤트
      document.querySelectorAll('.inv-mode').forEach(function(sel) {
        sel.addEventListener('change', function() {
          state.modesByOrder[this.dataset.oc] = this.value;
        });
      });

      // 페이지네이션 렌더링
      renderPagination(totalPages);

      // 일괄 선택 버튼 렌더링
      renderBulkSelectButtons();

      console.log('✅ 테이블 렌더링 완료: ' + pageOrders.length + '/' + state.filteredOrders.length + '건');
    }

    // ========================================
    // 조회 기능
    // ========================================
    function searchOrders() {
      console.log('🔍 조회 버튼 클릭됨');

      var params = {
        orderCode: document.getElementById("inv-order-code").value,
        supplier: document.getElementById("inv-supplier").value,
        startDate: document.getElementById("inv-start-date").value,
        endDate: document.getElementById("inv-end-date").value
      };

      console.log('📋 조회 파라미터:', params);

      OB.showLoading('발주 목록 조회 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          console.log('✅ 서버 응답:', res);

          OB.hideLoading();

          if (!res) {
            alert("서버 응답이 없습니다.");
            renderEmpty();
            return;
          }

          if (!res.success) {
            alert("오류 발생: " + (res.error || '알 수 없는 오류'));
            renderEmpty();
            return;
          }

          if (!res.orders || res.orders.length === 0) {
            renderEmpty();
            return;
          }

          // 데이터 저장
          state.allOrders = res.orders;
          state.filteredOrders = res.orders.slice();
          state.currentPage = 1;

          // 렌더링
          renderOrders();

          console.log('✅ 조회 완료: ' + res.orders.length + '건');
        })
        .withFailureHandler(function(err) {
          console.error('❌ 서버 오류:', err);
          OB.hideLoading();
          alert("서버 통신 오류: " + (err.message || err));
          renderEmpty();
        })
        .getPrintableOrdersApi(params);
    }

    // ========================================
    // PDF 출력 기능
    // ========================================
    // ========================================
    // 선택항목 출력 기능 (PDF/Excel 통합)
    // ========================================
    function exportSelected() {
      console.log('📄 선택항목 출력 버튼 클릭');

      // 체크된 발주번호 수집
      var selected = [];
      document.querySelectorAll(".inv-row-check:checked").forEach(function(c) {
        selected.push(c.dataset.oc);
      });

      if (selected.length === 0) {
        alert("출력할 발주번호를 선택하세요.");
        return;
      }

      // 문서 유형 (직접 value 사용: ORDER_PURCHASE, INVOICE_VAT, INVOICE_NVAT)
      var docType = document.getElementById("inv-doc-type").value || "INVOICE_VAT";

      // 출력 형식 (PDF/EXCEL)
      var outputFormat = document.getElementById("inv-output-format").value || "PDF";

      // 기본 출력방식 (auto/full/short)
      var defaultMode = document.getElementById("inv-default-mode").value || "auto";

      // 발주일/출고일
      var docDate = document.getElementById("inv-doc-date").value || "";

      // 납품일 (삐아계열 전용)
      var deliveryDate = document.getElementById("inv-delivery-date").value || "";

      // 비고 수동입력
      var manualRemarkCheckbox = document.getElementById("inv-manual-remark");
      var manualRemarkChecked = manualRemarkCheckbox ? manualRemarkCheckbox.checked : false;
      var manualRemarkText = manualRemarkChecked ? (document.getElementById("inv-manual-remark-text").value || "") : "";

      // 개별 출력방식 수집 (테이블의 각 행에서)
      var modes = {};
      document.querySelectorAll(".inv-mode").forEach(function(sel) {
        modes[sel.dataset.oc] = sel.value || defaultMode;
      });

      // 매입처별 통합 출력 체크 여부
      var mergeBySupplier = document.getElementById("inv-merge-by-supplier").checked;

      var params = {
        orderCodes: selected,
        docType: docType,
        outputFormat: outputFormat,
        printMode: defaultMode,
        modesByOrder: modes,
        mergeBySupplier: mergeBySupplier,
        docDate: docDate,
        deliveryDate: deliveryDate,
        manualRemark: manualRemarkText
      };

      console.log('📄 출력 파라미터:', params);
      if (mergeBySupplier) {
        console.log('🔗 매입처별 통합 출력 모드 활성화');
      }

      var loadingMsg = outputFormat === 'EXCEL' ? 'Excel 파일 생성 중...' : 'PDF 생성 중...';
      OB.showLoading(loadingMsg + ' (' + selected.length + '건)');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert(res ? res.error : "파일 생성 중 오류가 발생했습니다.");
            return;
          }

          // 폴더 열기
          if (res.folderId) {
            var url = "https://drive.google.com/drive/folders/" + res.folderId;
            window.open(url, "_blank");
            alert('✅ ' + res.fileCount + '개 파일이 생성되었습니다.\n\n구글 드라이브 폴더가 열립니다.');
          } else if (res.fileId) {
            // 단일 파일 다운로드 (하위호환)
            var url = "https://drive.google.com/uc?export=download&id=" + res.fileId;
            window.open(url, "_blank");
            alert('✅ 파일 생성 완료!\n파일: ' + res.fileName);
          } else {
            alert('✅ ' + (res.message || '완료'));
          }
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          console.error('❌ 파일 생성 실패:', err);
          alert("파일 생성 실패: " + (err.message || err));
        })
        .generateInvoiceZipApi(params);
    }

    // 이전 함수명 호환성 유지
    function exportPDF() {
      exportSelected();
    }

    // ========================================
    // 이벤트 리스너 설정

    var searchBtn = document.getElementById('inv-search-btn');

    }

    var exportSelectedBtn = document.getElementById('inv-export-selected');
    if (exportSelectedBtn) {
      exportSelectedBtn.addEventListener('click', exportSelected);
    }

    // 기존 버튼 호환성 (있으면 연결)
    var excelBtn = document.getElementById('inv-export-xlsx');
    if (excelBtn) {
      excelBtn.addEventListener('click', exportSelected);
    }

    var checkAll = document.getElementById("inv-check-all");
    if (checkAll) {

        });

    var docTypeSelect = document.getElementById('inv-doc-type');
    if (docTypeSelect) {
      docTypeSelect.addEventListener('change', function() {
        var dateLabel = document.getElementById('inv-date-label');
        var outputFormatSelect = document.getElementById('inv-output-format');
        var deliveryLabel = document.getElementById('inv-delivery-label');
        var deliveryInput = document.getElementById('inv-delivery-date');
        var docType = this.value;

        // 날짜 라벨 변경
        if (dateLabel) {
          if (docType === 'ORDER_PURCHASE') {
            dateLabel.textContent = '발주일';
          } else if (docType.startsWith('CUSTOM_')) {
            dateLabel.textContent = '발주일';
          } else {
            dateLabel.textContent = '출고일';
          }
        }

        // 전용양식 선택 시 출력형식 자동 Excel로 변경
        if (docType.startsWith('CUSTOM_') && outputFormatSelect) {
          outputFormatSelect.value = 'EXCEL';
          outputFormatSelect.disabled = true;
        } else if (outputFormatSelect) {
          outputFormatSelect.disabled = false;
        }

        // 삐아계열 선택 시 납품일 필드 표시
        if (docType === 'CUSTOM_BBIA') {
          if (deliveryLabel) deliveryLabel.style.display = '';
          if (deliveryInput) deliveryInput.style.display = '';
        } else {
          if (deliveryLabel) deliveryLabel.style.display = 'none';
          if (deliveryInput) deliveryInput.style.display = 'none';
        }
      });

    // 비고 수동입력 체크박스 변경 시 텍스트 영역 표시/숨김
    var manualRemarkCheckbox = document.getElementById('inv-manual-remark');
    if (manualRemarkCheckbox) {
      manualRemarkCheckbox.addEventListener('change', function() {
        var remarkArea = document.getElementById('inv-remark-input-area');
        if (remarkArea) {
          remarkArea.style.display = this.checked ? 'block' : 'none';
        }
      });
    }

    // 기본 날짜 설정 (오늘)
    var docDateInput = document.getElementById('inv-doc-date');
    if (docDateInput && !docDateInput.value) {
      var today = new Date();
      var yyyy = today.getFullYear();
      var mm = String(today.getMonth() + 1).padStart(2, '0');
      var dd = String(today.getDate()).padStart(2, '0');
      docDateInput.value = yyyy + '-' + mm + '-' + dd;
    }

    // 정렬 헤더 클릭 이벤트
    var sortableHeaders = document.querySelectorAll('.ob-table-wrap th.sortable');
    sortableHeaders.forEach(function(header) {
      header.addEventListener('click', function() {
        var column = header.dataset.sort;

        if (state.currentSort.column === column) {
          state.currentSort.direction = state.currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
          state.currentSort.column = column;
          state.currentSort.direction = 'asc';
        }

        state.currentPage = 1;
        renderOrders();
      });
    });

    // 일괄 선택 버튼
    var selectAllBtn = document.getElementById('inv-select-all');
    if (selectAllBtn) {
      selectAllBtn.addEventListener('click', function() {
        var checkboxes = document.querySelectorAll('.inv-row-check');
        checkboxes.forEach(function(c) {
          c.checked = true;
        });
      });
    }

    var deselectAllBtn = document.getElementById('inv-deselect-all');
    if (deselectAllBtn) {
      deselectAllBtn.addEventListener('click', function() {
        var checkboxes = document.querySelectorAll('.inv-row-check');
        checkboxes.forEach(function(c) {
          c.checked = false;
        });
        document.getElementById('inv-check-all').checked = false;
      });
    }

    // ========================================
    // 탭 전환 로직
    // ========================================
    var tabNavItems = document.querySelectorAll('.tab-nav-item');
    var ledgerInitialized = false;

    tabNavItems.forEach(function(tabNavItem) {
      tabNavItem.addEventListener('click', function() {
        var targetTab = this.getAttribute('data-tab');

        // 모든 탭 비활성화
        document.querySelectorAll('.tab-nav-item').forEach(function(item) {
          item.classList.remove('active');
        });
        document.querySelectorAll('.tab-content').forEach(function(content) {
          content.classList.remove('active');
        });

        // 선택한 탭 활성화
        this.classList.add('active');
        document.getElementById('tab-' + targetTab).classList.add('active');

        // 거래원장 탭 클릭 시 초기화
        if (targetTab === 'transaction-ledger' && !ledgerInitialized) {
          if (typeof OB.initTransactionLedgerPage === 'function') {
            OB.initTransactionLedgerPage();
            ledgerInitialized = true;
          }
        }
      });
    });

    // ========================================
    // 일괄 청구서 탭 로직
    // ========================================

    var billingState = {
      currentData: null,
      company: '',
      startDate: '',
      endDate: ''
    };

    // DOM 요소
    var billingCompanyInput = document.getElementById('billing-company');
    var billingStartDateInput = document.getElementById('billing-start-date');
    var billingEndDateInput = document.getElementById('billing-end-date');
    var billingSearchBtn = document.getElementById('billing-search-btn');
    var billingResetBtn = document.getElementById('billing-reset-btn');
    var billingTbody = document.getElementById('billing-result-tbody');
    var billingSummary = document.getElementById('billing-summary');
    var billingActions = document.getElementById('billing-actions');

    // 기본 날짜 설정 (이번 달)
    function setBillingDefaultDates() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var firstDay = year + '-' + month + '-01';
      var lastDay = new Date(year, now.getMonth() + 1, 0);
      var lastDayStr = year + '-' + month + '-' + String(lastDay.getDate()).padStart(2, '0');

      billingStartDateInput.value = firstDay;
      billingEndDateInput.value = lastDayStr;
    }

    setBillingDefaultDates();

    // 조회 버튼
    if (billingSearchBtn) {
      billingSearchBtn.addEventListener('click', function() {
        var company = billingCompanyInput.value.trim();
        var startDate = billingStartDateInput.value;
        var endDate = billingEndDateInput.value;

        if (!company) {
          alert('거래처를 입력해주세요.');
          return;
        }

        if (!startDate || !endDate) {
          alert('기간을 선택해주세요.');
          return;
        }

        billingState.company = company;
        billingState.startDate = startDate;
        billingState.endDate = endDate;

        OB.showLoading('청구 데이터 집계 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('집계 실패: ' + (result ? result.error : '알 수 없는 오류'));
              renderBillingEmpty();
              return;
            }

            billingState.currentData = result;
            renderBillingSummary(result);
            renderBillingTable(result.items || []);
            showBillingActions();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            alert('집계 실패: ' + error.message);
            renderBillingEmpty();
          })
          .aggregateBillingDataApi({
            company: company,
            startDate: startDate,
            endDate: endDate
          });
      });
    }

    // 초기화 버튼
    if (billingResetBtn) {
      billingResetBtn.addEventListener('click', function() {
        billingCompanyInput.value = '';
        setBillingDefaultDates();
        billingState.currentData = null;
        renderBillingEmpty();
        hideBillingSummary();
        hideBillingActions();
      });
    }

    // 요약 렌더링
    function renderBillingSummary(data) {
      document.getElementById('billing-total-items').textContent = OB.formatNumber(data.totalItems || 0);
      document.getElementById('billing-total-order-qty').textContent = OB.formatNumber(data.totalOrderQty || 0);
      document.getElementById('billing-total-confirmed-qty').textContent = OB.formatNumber(data.totalConfirmedQty || 0);
      document.getElementById('billing-total-amount').textContent = '₩' + OB.formatNumber(data.totalAmount || 0);

      billingSummary.classList.add('active');
    }

    function hideBillingSummary() {
      billingSummary.classList.remove('active');
    }

    // 테이블 렌더링
    function renderBillingTable(items) {
      if (!items || items.length === 0) {
        renderBillingEmpty();
        return;
      }

      billingTbody.innerHTML = '';

      items.forEach(function(item) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (item.orderCode || '') + '</td>' +
          '<td>' + (item.orderDate || '') + '</td>' +
          '<td>' + (item.supplier || '') + '</td>' +
          '<td>' + (item.brand || '') + '</td>' +
          '<td>' + (item.productName || '') + '</td>' +
          '<td>' + (item.productCode || '') + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.confirmedQty || 0) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(item.supplyPrice || 0) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(item.supplyAmount || 0) + '</td>';

        billingTbody.appendChild(tr);
      });
    }

    function renderBillingEmpty() {
      billingTbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#777;padding:40px;">거래처와 기간을 선택하여 조회하세요</td></tr>';
    }

    function showBillingActions() {
      billingActions.style.display = 'flex';
    }

    function hideBillingActions() {
      billingActions.style.display = 'none';
    }

    // 엑셀 다운로드
    var billingExportXlsxBtn = document.getElementById('billing-export-xlsx');
    if (billingExportXlsxBtn) {
      billingExportXlsxBtn.addEventListener('click', function() {
        if (!billingState.currentData || !billingState.currentData.items) {
          alert('다운로드할 데이터가 없습니다.');
          return;
        }

        var csv = [];
        csv.push(['발주번호', '발주일', '매입처', '브랜드', '제품명', '품목코드', '발주수량', '확정수량', '공급가', '공급액'].join(','));

        billingState.currentData.items.forEach(function(item) {
          var row = [
            item.orderCode || '',
            item.orderDate || '',
            item.supplier || '',
            item.brand || '',
            item.productName || '',
            item.productCode || '',
            item.orderQty || 0,
            item.confirmedQty || 0,
            item.supplyPrice || 0,
            item.supplyAmount || 0
          ];
          csv.push(row.join(','));
        });

        var csvContent = '\uFEFF' + csv.join('\n');
        var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        var url = URL.createObjectURL(blob);

        var fileName = '청구서_' + billingState.company + '_' +
          billingState.startDate.replace(/-/g, '') + '-' +
          billingState.endDate.replace(/-/g, '') + '.csv';

        link.setAttribute('href', url);
        link.setAttribute('download', fileName);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        console.log('✅ 엑셀 다운로드 완료');
      });
    }

    // PDF 청구서 생성 (기존 명세서 템플릿 활용)
    var billingExportPdfBtn = document.getElementById('billing-export-pdf');
    if (billingExportPdfBtn) {
      billingExportPdfBtn.addEventListener('click', function() {
        if (!billingState.currentData || !billingState.currentData.items) {
          alert('생성할 데이터가 없습니다.');
          return;
        }

        // 발주번호 목록 추출 (중복 제거)
        var orderCodes = [];
        var orderCodeSet = {};
        billingState.currentData.items.forEach(function(item) {
          if (item.orderCode && !orderCodeSet[item.orderCode]) {
            orderCodes.push(item.orderCode);
            orderCodeSet[item.orderCode] = true;
          }
        });

        if (orderCodes.length === 0) {
          alert('발주번호를 찾을 수 없습니다.');
          return;
        }

        if (!confirm('총 ' + orderCodes.length + '개 발주번호에 대한 거래명세서를 생성하시겠습니까?')) {
          return;
        }

        OB.showLoading('PDF 생성 중...');

        var params = {
          orderCodes: orderCodes,
          docType: '거래명세서(영세)',
          printMode: 'auto',
          modesByOrder: {},
          mergeBySupplier: false
        };

        google.script.run
          .withSuccessHandler(function(res) {
            OB.hideLoading();

            if (!res || !res.success) {
              alert(res ? res.error : "PDF 생성 중 오류가 발생했습니다.");
              return;
            }

            // ZIP 다운로드 URL 오픈
            var url = "https://drive.google.com/uc?export=download&id=" + res.fileId;
            window.open(url, "_blank");

            alert('✅ PDF 생성 완료!\n파일: ' + res.fileName);
          })
          .withFailureHandler(function(err) {
            OB.hideLoading();
            console.error('❌ PDF 생성 실패:', err);
            alert("PDF 생성 실패: " + (err.message || err));
          })
          .generateInvoiceZipApi(params);
      });
    }

    // 청구서 DB 저장 + 발행
    var billingSaveDbBtn = document.getElementById('billing-save-db');
    if (billingSaveDbBtn) {
      billingSaveDbBtn.addEventListener('click', function() {
        if (!billingState.currentData || !billingState.currentData.items) {
          alert('저장할 데이터가 없습니다.');
          return;

        if (!confirm('청구서를 DB에 저장하고 발행하시겠습니까?')) {

          if (item.orderCode && !orderCodeSet[item.orderCode]) {
            orderCodes.push(item.orderCode);
            orderCodeSet[item.orderCode] = true;
          }
        });

        var params = {
          settlementId: '',
          type: 'SALES',
          company: billingState.company,
          billingDate: new Date(),
          amount: billingState.currentData.totalAmount,
          notes: billingState.startDate + ' ~ ' + billingState.endDate + ' 청구',
          orderNumbers: orderCodes  // 발주번호 목록 추가
        };

        OB.showLoading('청구서 저장 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('저장 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert('청구서가 저장되었습니다!\n청구ID: ' + result.billingId);
            console.log('✅ 청구서 저장 완료:', result.billingId);
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            alert('저장 실패: ' + error.message);
          })
          .createBillingApi(params);
      });
    }

    console.log('✅ InvoiceOutput 페이지 초기화 완료');
  };

  // ===========================================================
  // ✅ OrderList 페이지 초기화 함수
  // ===========================================================
  OB.initOrderListPage = function() {
    var wrap = document.querySelector('.orderlist-wrap');
    if (!wrap) {
      console.warn('OrderList wrapper not found');
      return;
    }

    if (wrap.dataset.bound === '1') {
      console.log('OrderList already initialized');
      return;
    }
    wrap.dataset.bound = '1';

    console.log('✅ OrderList Page 초기화 완료');

    // DOM 요소
    var btnSearch = document.getElementById('orderlist-btn-search');
    var btnReset = document.getElementById('orderlist-btn-reset');
    var btnExcel = document.getElementById('orderlist-btn-excel');
    var tbody = document.getElementById('orderlist-tbody');
    var resultCount = document.getElementById('orderlist-result-count');
    var pagination = document.getElementById('orderlist-pagination');
    var pageNumbers = document.getElementById('orderlist-page-numbers');
    var pageInfo = document.getElementById('orderlist-page-info');

    var modal = document.getElementById('orderlist-modal');
    var modalClose = document.getElementById('orderlist-modal-close');
    var modalTitle = document.getElementById('orderlist-modal-title');
    var modalBody = document.getElementById('orderlist-modal-body');
    var btnDelete = document.getElementById('orderlist-btn-delete');
    var btnSaveStatus = document.getElementById('orderlist-btn-save-status');

    // 상태 변수
    var currentOrders = [];
    var filteredOrders = [];
    var currentPage = 1;
    var itemsPerPage = 20;
    var currentSort = { column: null, direction: 'asc' };
    var currentOrderCode = null;

    // 기본 날짜 설정
    setDefaultDates();

    function setDefaultDates() {
      var today = new Date();
      var thirtyDaysAgo = new Date();
      thirtyDaysAgo.setDate(today.getDate() - 30);

      document.getElementById('orderlist-end-date').value = formatDateInput(today);
      document.getElementById('orderlist-start-date').value = formatDateInput(thirtyDaysAgo);
    }

    function formatDateInput(date) {
      var year = date.getFullYear();
      var month = String(date.getMonth() + 1).padStart(2, '0');
      var day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    // ============================================================
    // 조회 버튼
    // ============================================================
    if (btnSearch) {
      btnSearch.addEventListener('click', function() {
        var params = {
          startDate: document.getElementById('orderlist-start-date').value,
          endDate: document.getElementById('orderlist-end-date').value,
          orderCode: document.getElementById('orderlist-order-code').value,
          buyer: document.getElementById('orderlist-buyer').value,
          brand: document.getElementById('orderlist-brand').value,
          supplier: document.getElementById('orderlist-supplier').value
        };

        console.log('🔍 발주 조회 파라미터:', params);

        OB.showLoading('발주 내역 조회 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();
            console.log('✅ 발주 조회 결과:', result);

            if (!result || !result.success) {
              alert('조회 중 오류 발생: ' + (result ? result.error : '알 수 없는 오류'));
              renderEmpty();
              return;
            }

            currentOrders = result.orders || [];
            filteredOrders = currentOrders.slice();
            currentPage = 1;
            renderOrders();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 발주 조회 실패:', error);
            alert('조회 실패: ' + error.message);
            renderEmpty();
          })
          .getPrintableOrdersApi(params);
      });
    }

    // ============================================================
    // 초기화 버튼
    // ============================================================
    if (btnReset) {
      btnReset.addEventListener('click', function() {
        document.getElementById('orderlist-start-date').value = '';
        document.getElementById('orderlist-end-date').value = '';
        document.getElementById('orderlist-order-code').value = '';
        document.getElementById('orderlist-buyer').value = '';
        document.getElementById('orderlist-brand').value = '';
        document.getElementById('orderlist-supplier').value = '';

        setDefaultDates();
        renderEmpty();
      });
    }

    // ============================================================
    // 엑셀 다운로드
    // ============================================================
    if (btnExcel) {
      btnExcel.addEventListener('click', function() {
        if (!filteredOrders || filteredOrders.length === 0) {
          alert('다운로드할 데이터가 없습니다.');
          return;
        }

        downloadCSV();
      });
    }

    function downloadCSV() {
      var csv = [];

      // 헤더
      csv.push(['발주일', '발주번호', '발주처', '브랜드', '매입처', '품목수', '매입액', '공급액'].join(','));

      // 데이터
      filteredOrders.forEach(function(order) {
        var row = [
          formatDate(order.orderDate),
          order.orderCode || '',
          order.buyer || '',
          order.brand || '',
          order.supplier || '',
          order.itemCount || 0,
          order.totalPurchaseAmount || 0,
          order.totalAmount || 0
        ];
        csv.push(row.join(','));
      });

      // BOM 추가 (한글 깨짐 방지)
      var csvContent = '\uFEFF' + csv.join('\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', '발주내역_' + formatDateInput(new Date()) + '.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      console.log('✅ CSV 다운로드 완료:', filteredOrders.length + '건');
    }

    // ============================================================
    // 정렬 기능
    // ============================================================
    var sortableHeaders = document.querySelectorAll('.orderlist-table th.sortable');
    sortableHeaders.forEach(function(header) {
      header.addEventListener('click', function() {
        var column = header.dataset.sort;

        if (currentSort.column === column) {
          // 같은 컬럼 클릭: 방향 토글
          currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
          // 다른 컬럼 클릭: 오름차순으로 시작
          currentSort.column = column;
          currentSort.direction = 'asc';
        }

        sortOrders(column, currentSort.direction);
        updateSortIndicators();
        currentPage = 1;
        renderOrders();
      });
    });

    function sortOrders(column, direction) {
      filteredOrders.sort(function(a, b) {
        var aVal = a[column];
        var bVal = b[column];

        // 날짜 처리
        if (column === 'orderDate') {
          aVal = new Date(aVal).getTime();
          bVal = new Date(bVal).getTime();
        }

        // 숫자 처리
        if (column === 'itemCount' || column === 'totalPurchaseAmount' || column === 'totalAmount') {
          aVal = Number(aVal) || 0;
          bVal = Number(bVal) || 0;
        }

        // 문자열 처리
        if (typeof aVal === 'string') {
          aVal = aVal.toLowerCase();
          bVal = bVal.toLowerCase();
        }

        if (aVal < bVal) return direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return direction === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function updateSortIndicators() {
      sortableHeaders.forEach(function(header) {
        header.classList.remove('asc', 'desc');
        if (header.dataset.sort === currentSort.column) {
          header.classList.add(currentSort.direction);
        }
      });
    }

    // ============================================================
    // 발주 목록 렌더링 (페이지네이션 포함)
    // ============================================================
    function renderOrders() {
      tbody.innerHTML = '';

      if (!filteredOrders || filteredOrders.length === 0) {
        renderEmpty();
        pagination.style.display = 'none';
        return;
      }

      resultCount.textContent = '총 ' + filteredOrders.length + '건';

      // 페이지네이션 계산
      var totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
      var startIdx = (currentPage - 1) * itemsPerPage;
      var endIdx = Math.min(startIdx + itemsPerPage, filteredOrders.length);
      var pageOrders = filteredOrders.slice(startIdx, endIdx);

      // 테이블 렌더링
      pageOrders.forEach(function(order) {
        var tr = document.createElement('tr');
        tr.dataset.orderCode = order.orderCode;

        // 진행상태 이모지 생성 (매입발주, 매입결제, 매출결제, 출고 순)
        function getProgressStatus(order) {
          // 매입발주: ⏳미처리 / ✅발주완료
          var buyOrderEmoji = order.buyOrder === '발주완료' ? '✅' : '⏳';
          var buyOrderTitle = '매입발주: ' + (order.buyOrder || '미처리');

          // 매입결제: ❌미결제 / 🔸부분결제 / ✅결제완료
          var payBuyEmoji = order.payBuy === '결제완료' ? '✅' : (order.payBuy === '부분결제' ? '🔸' : '❌');
          var payBuyTitle = '매입결제: ' + (order.payBuy || '미결제');

          // 매출결제: ❌미결제 / 🔸부분결제 / ✅결제완료
          var paySellEmoji = order.paySell === '결제완료' ? '✅' : (order.paySell === '부분결제' ? '🔸' : '❌');
          var paySellTitle = '매출결제: ' + (order.paySell || '미결제');

          // 출고: ⬜미출고 / 📦부분출고 / ✅출고완료
          var shipEmoji = order.ship === '출고완료' ? '✅' : (order.ship === '부분출고' ? '📦' : '⬜');
          var shipTitle = '출고: ' + (order.ship || '미출고');

          return '<div class="orderlist-progress-status">' +
            '<span title="' + buyOrderTitle + '">' + buyOrderEmoji + '</span>' +
            '<span title="' + payBuyTitle + '">' + payBuyEmoji + '</span>' +
            '<span title="' + paySellTitle + '">' + paySellEmoji + '</span>' +
            '<span title="' + shipTitle + '">' + shipEmoji + '</span>' +
            '</div>';
        }

        tr.innerHTML =
          '<td>' + formatDate(order.orderDate) + '</td>' +
          '<td><span class="orderlist-ordercode">' + (order.orderCode || '') + '</span></td>' +
          '<td>' + (order.buyer || '') + '</td>' +
          '<td>' + (order.brand || '') + '</td>' +
          '<td>' + (order.supplier || '') + '</td>' +
          '<td class="text-center">' + (order.itemCount || 0) + '개</td>' +
          '<td class="text-right">₩' + formatNumber(order.totalPurchaseAmount) + '</td>' +
          '<td class="text-right">₩' + formatNumber(order.totalAmount) + '</td>' +
          '<td class="text-center">' + getProgressStatus(order) + '</td>';

        tr.addEventListener('click', function() {
          loadOrderDetail(order.orderCode);
        });

        tbody.appendChild(tr);
      });

      // 페이지네이션 렌더링
      if (totalPages > 1) {
        renderPagination(totalPages);
        pagination.style.display = 'flex';
      } else {
        pagination.style.display = 'none';
      }
    }

    // ============================================================
    // 페이지네이션 렌더링
    // ============================================================
    function renderPagination(totalPages) {
      var btnFirst = document.getElementById('orderlist-page-first');
      var btnPrev = document.getElementById('orderlist-page-prev');
      var btnNext = document.getElementById('orderlist-page-next');
      var btnLast = document.getElementById('orderlist-page-last');

      // 버튼 활성화/비활성화
      btnFirst.disabled = currentPage === 1;
      btnPrev.disabled = currentPage === 1;
      btnNext.disabled = currentPage === totalPages;
      btnLast.disabled = currentPage === totalPages;

      // 페이지 번호 버튼
      pageNumbers.innerHTML = '';

      var maxButtons = 5;
      var startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
      var endPage = Math.min(totalPages, startPage + maxButtons - 1);

      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      for (var i = startPage; i <= endPage; i++) {
        var btn = document.createElement('button');
        btn.className = 'orderlist-page-btn';
        btn.textContent = i;
        btn.dataset.page = i;

        if (i === currentPage) {
          btn.classList.add('active');
        }

        btn.addEventListener('click', function() {
          currentPage = parseInt(this.dataset.page);
          renderOrders();
        });

        pageNumbers.appendChild(btn);
      }

      // 페이지 정보
      var startIdx = (currentPage - 1) * itemsPerPage + 1;
      var endIdx = Math.min(currentPage * itemsPerPage, filteredOrders.length);
      pageInfo.textContent = startIdx + '-' + endIdx + ' / ' + filteredOrders.length;

      // 버튼 이벤트
      btnFirst.onclick = function() { currentPage = 1; renderOrders(); };
      btnPrev.onclick = function() { if (currentPage > 1) { currentPage--; renderOrders(); } };
      btnNext.onclick = function() { if (currentPage < totalPages) { currentPage++; renderOrders(); } };
      btnLast.onclick = function() { currentPage = totalPages; renderOrders(); };
    }

    // ============================================================
    // 빈 테이블 렌더링
    // ============================================================
    function renderEmpty() {
      tbody.innerHTML =
        '<tr><td colspan="9" class="orderlist-empty">' +
        '<div class="orderlist-empty-icon">📋</div>' +
        '<div class="orderlist-empty-text">조회 결과가 없습니다</div>' +
        '</td></tr>';

      resultCount.textContent = '조회 결과 없음';
      currentOrders = [];
      filteredOrders = [];
      pagination.style.display = 'none';
    }

    // ============================================================
    // 발주 상세 조회
    // ============================================================
    function loadOrderDetail(orderCode) {
      console.log('📦 발주 상세 조회:', orderCode);
      currentOrderCode = orderCode;

      OB.showLoading('상세 정보 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('✅ 발주 상세 결과:', result);

          if (!result || !result.success) {
            alert('상세 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          renderOrderDetail(orderCode, result.orderItems || []);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('❌ 발주 상세 조회 실패:', error);
          alert('상세 조회 실패: ' + error.message);
        })
        .getOrderDetailApi(orderCode);
    }

    // ============================================================
    // 발주 상세 모달 렌더링
    // ============================================================
    function renderOrderDetail(orderCode, items) {
      if (!items || items.length === 0) {
        alert('해당 발주의 상세 정보가 없습니다.');
        return;
      }

      html += '<div class="orderlist-detail-item"><div class="orderlist-detail-label">발주일</div><div class="orderlist-detail-value">' + formatDate(firstItem['발주일']) + '</div></div>';
      html += '<div class="orderlist-detail-item"><div class="orderlist-detail-label">발주처</div><div class="orderlist-detail-value">' + (firstItem['발주처'] || '') + '</div></div>';

      html += '<div class="orderlist-detail-item"><div class="orderlist-detail-label">매입처</div><div class="orderlist-detail-value">' + (firstItem['매입처'] || '') + '</div></div>';
      html += '<div class="orderlist-detail-item"><div class="orderlist-detail-label">출고상태</div><div class="orderlist-detail-value">' + (firstItem['출고'] || '미출고') + '</div></div>';
      html += '</div>';
      html += '</div>';

      // 상태 수정 폼 (순서: 매입발주 → 매입결제 → 매출결제 → 출고상태)

      html += '<option value="발주완료"' + (firstItem['매입발주'] === '발주완료' ? ' selected' : '') + '>✅ 발주완료</option>';
      html += '</select>';
      html += '</div>';
      html += '<div class="orderlist-status-item">';
      html += '<label class="orderlist-detail-label">매입 결제</label>';
      html += '<select id="orderlist-status-pay-buy" class="orderlist-status-select">';
      html += '<option value="미결제"' + (firstItem['매입결제'] === '미결제' || !firstItem['매입결제'] ? ' selected' : '') + '>❌ 미결제</option>';
      html += '<option value="부분결제"' + (firstItem['매입결제'] === '부분결제' ? ' selected' : '') + '>🔸 부분결제</option>';
      html += '<option value="결제완료"' + (firstItem['매입결제'] === '결제완료' ? ' selected' : '') + '>✅ 결제완료</option>';
      html += '</select>';
      html += '</div>';
      html += '<div class="orderlist-status-item">';
      html += '<label class="orderlist-detail-label">매출 결제</label>';
      html += '<select id="orderlist-status-pay-sell" class="orderlist-status-select">';
      html += '<option value="미결제"' + (firstItem['매출결제'] === '미결제' || !firstItem['매출결제'] ? ' selected' : '') + '>❌ 미결제</option>';
      html += '<option value="부분결제"' + (firstItem['매출결제'] === '부분결제' ? ' selected' : '') + '>🔸 부분결제</option>';
      html += '<option value="결제완료"' + (firstItem['매출결제'] === '결제완료' ? ' selected' : '') + '>✅ 결제완료</option>';
      html += '</select>';
      html += '</div>';
      html += '<div class="orderlist-status-item">';
      html += '<label class="orderlist-detail-label">출고 상태</label>';

      html += '<option value="부분출고"' + (firstItem['출고'] === '부분출고' ? ' selected' : '') + '>📦 부분출고</option>';
      html += '<option value="출고완료"' + (firstItem['출고'] === '출고완료' ? ' selected' : '') + '>✅ 출고완료</option>';
      html += '</select>';
      html += '</div>';
      html += '</div>';
      html += '</div>';

      // 품목 목록
      html += '<div class="orderlist-detail-section">';

      html += '<button type="button" id="btn-save-confirmed-qty" class="orderlist-btn-save-qty" style="margin-left: 10px; padding: 4px 10px; font-size: 12px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer;">확정수량 저장</button>';

      html += '<table class="orderlist-detail-table">';

      html += '<th>제품명</th>';
      html += '<th>품목코드</th>';
      html += '<th class="text-right">발주수량</th>';
      html += '<th class="text-right">확정수량</th>';
      html += '<th class="text-right">매입가</th>';
      html += '<th class="text-right">공급가</th>';
      html += '<th class="text-right">매입액</th>';
      html += '<th class="text-right">공급액</th>';
      html += '<th class="text-right">마진액</th>';
      html += '<th class="text-right">마진율</th>';
      html += '</tr></thead>';
      html += '<tbody>';

      var totalPurchaseAmount = 0;
      var totalSupplyAmount = 0;
      var totalMarginAmount = 0;

      items.forEach(function(item, idx) {
        var purchaseAmount = Number(item['매입액'] || 0);
        var supplyAmount = Number(item['공급액'] || 0);
        var marginAmount = Number(item['마진액'] || (supplyAmount - purchaseAmount));
        var marginRate = purchaseAmount > 0 ? ((marginAmount / purchaseAmount) * 100).toFixed(1) : 0;
        var confirmedQty = Number(item['확정수량'] || item['발주수량'] || 0);
        var rowIndex = item['_rowIndex'] || '';

        totalPurchaseAmount += purchaseAmount;
        totalSupplyAmount += supplyAmount;
        totalMarginAmount += marginAmount;

        html += '<tr data-row-index="' + rowIndex + '">';
        html += '<td>' + (item['제품명'] || '') + '</td>';
        html += '<td>' + (item['품목코드'] || '') + '</td>';
        html += '<td class="text-right">' + formatNumber(item['발주수량']) + '</td>';
        html += '<td class="text-right"><input type="number" class="confirmed-qty-input" value="' + confirmedQty + '" data-row="' + rowIndex + '" data-buy-price="' + (item['매입가'] || 0) + '" data-supply-price="' + (item['공급가'] || 0) + '" style="width: 60px; text-align: right; padding: 2px 4px; border: 1px solid #d1d5db; border-radius: 3px;" /></td>';
        html += '<td class="text-right">₩' + formatNumber(item['매입가']) + '</td>';
        html += '<td class="text-right">₩' + formatNumber(item['공급가']) + '</td>';
        html += '<td class="text-right purchase-amount">₩' + formatNumber(purchaseAmount) + '</td>';
        html += '<td class="text-right supply-amount">₩' + formatNumber(supplyAmount) + '</td>';
        html += '<td class="text-right margin-amount" style="color: ' + (marginAmount >= 0 ? '#059669' : '#dc2626') + ';">₩' + formatNumber(marginAmount) + '</td>';
        html += '<td class="text-right margin-rate" style="color: ' + (marginAmount >= 0 ? '#059669' : '#dc2626') + ';">' + marginRate + '%</td>';
        html += '</tr>';
      });

      var totalMarginRate = totalPurchaseAmount > 0 ? ((totalMarginAmount / totalPurchaseAmount) * 100).toFixed(1) : 0;

      html += '</tbody>';
      html += '<tfoot>';
      html += '<tr style="font-weight: 700; background: #f9fafb;">';
      html += '<td colspan="6" class="text-right">합계</td>';
      html += '<td class="text-right">₩' + formatNumber(totalPurchaseAmount) + '</td>';
      html += '<td class="text-right">₩' + formatNumber(totalSupplyAmount) + '</td>';
      html += '<td class="text-right" style="color: ' + (totalMarginAmount >= 0 ? '#059669' : '#dc2626') + ';">₩' + formatNumber(totalMarginAmount) + '</td>';
      html += '<td class="text-right" style="color: ' + (totalMarginAmount >= 0 ? '#059669' : '#dc2626') + ';">' + totalMarginRate + '%</td>';
      html += '</tr>';
      html += '</tfoot>';
      html += '</table>';
      html += '</div>';

      modalBody.innerHTML = html;
      modal.classList.add('show');

      // 확정수량 입력 시 금액 실시간 계산
      var qtyInputs = modalBody.querySelectorAll('.confirmed-qty-input');
      qtyInputs.forEach(function(input) {
        input.addEventListener('input', function() {
          var tr = this.closest('tr');
          var qty = Number(this.value) || 0;
          var buyPrice = Number(this.dataset.buyPrice) || 0;
          var supplyPrice = Number(this.dataset.supplyPrice) || 0;

          var purchaseAmt = qty * buyPrice;
          var supplyAmt = qty * supplyPrice;
          var marginAmt = supplyAmt - purchaseAmt;
          var marginRt = purchaseAmt > 0 ? ((marginAmt / purchaseAmt) * 100).toFixed(1) : 0;

          tr.querySelector('.purchase-amount').textContent = '₩' + formatNumber(purchaseAmt);
          tr.querySelector('.supply-amount').textContent = '₩' + formatNumber(supplyAmt);
          tr.querySelector('.margin-amount').textContent = '₩' + formatNumber(marginAmt);
          tr.querySelector('.margin-amount').style.color = marginAmt >= 0 ? '#059669' : '#dc2626';
          tr.querySelector('.margin-rate').textContent = marginRt + '%';
          tr.querySelector('.margin-rate').style.color = marginAmt >= 0 ? '#059669' : '#dc2626';
        });
      });

      // 확정수량 저장 버튼
      var btnSaveQty = document.getElementById('btn-save-confirmed-qty');
      if (btnSaveQty) {
        btnSaveQty.addEventListener('click', function() {
          var updates = [];
          qtyInputs.forEach(function(input) {
            var rowIndex = Number(input.dataset.row);
            var qty = Number(input.value) || 0;
            if (rowIndex > 0) {
              updates.push({ rowIndex: rowIndex, confirmedQty: qty });
            }
          });

          if (updates.length === 0) {
            alert('저장할 확정수량 데이터가 없습니다.');
            return;
          }

          if (!confirm(updates.length + '개 품목의 확정수량을 저장하시겠습니까?')) {
            return;
          }

          OB.showLoading('확정수량 저장 중...');

          google.script.run
            .withSuccessHandler(function(result) {
              OB.hideLoading();
              if (!result || !result.success) {
                alert('저장 실패: ' + (result ? result.error : '알 수 없는 오류'));
                return;
              }
              alert('✅ 확정수량이 저장되었습니다! (' + result.updatedCount + '건)');
              // 모달 새로고침
              loadOrderDetail(currentOrderCode);
            })
            .withFailureHandler(function(error) {
              OB.hideLoading();
              alert('저장 실패: ' + error.message);
            })
            .updateConfirmedQuantitiesApi({ updates: updates });
        });
      }
    }

    // ============================================================
    // 상태 저장 (4개 상태 모두 저장)
    // ============================================================
    if (btnSaveStatus) {
      btnSaveStatus.addEventListener('click', function() {
        if (!currentOrderCode) {
          alert('발주번호를 찾을 수 없습니다.');
          return;
        }

        // 4개 상태 값 수집
        var statuses = {
          buyOrder: document.getElementById('orderlist-status-buy-order').value,
          payBuy: document.getElementById('orderlist-status-pay-buy').value,
          paySell: document.getElementById('orderlist-status-pay-sell').value,
          ship: document.getElementById('orderlist-status-ship').value
        };

        var statusSummary = '매입발주: ' + statuses.buyOrder + '\n' +
                           '매입결제: ' + statuses.payBuy + '\n' +
                           '매출결제: ' + statuses.paySell + '\n' +
                           '출고상태: ' + statuses.ship;

        if (!confirm('다음과 같이 상태를 변경하시겠습니까?\n\n' + statusSummary)) {
          return;
        }

        OB.showLoading('상태 업데이트 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('상태 업데이트 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert('✅ 상태가 업데이트되었습니다! (' + result.updated + '개 행)');

            // 모달 닫기 및 목록 새로고침
            modal.classList.remove('show');
            btnSearch.click();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 상태 업데이트 실패:', error);
            alert('상태 업데이트 실패: ' + error.message);
          })
          .updateOrderStatus(currentOrderCode, statuses);
      });
    }

    // ============================================================
    // 발주 삭제
    // ============================================================
    if (btnDelete) {
      btnDelete.addEventListener('click', function() {
        if (!currentOrderCode) {
          alert('발주번호를 찾을 수 없습니다.');
          return;
        }

        if (!confirm('⚠️ 정말로 발주번호 "' + currentOrderCode + '"를 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다!')) {
          return;
        }

        if (!confirm('⚠️⚠️ 최종 확인: 발주와 관련된 모든 품목 데이터가 삭제됩니다. 계속하시겠습니까?')) {
          return;
        }

        OB.showLoading('발주 삭제 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('발주 삭제 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert('✅ 발주가 삭제되었습니다! (' + result.deleted + '개 행)');

            modal.classList.remove('show');
            btnSearch.click();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 발주 삭제 실패:', error);
            alert('발주 삭제 실패: ' + error.message);
          })
          .deleteOrder(currentOrderCode);
