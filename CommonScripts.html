  /**
   * 청구서 이력 조회
   */
  function viewInvoiceHistory(invoiceId) {
    if (!invoiceId) {
      alert('청구서 ID가 필요합니다.');
      return;
    }

    // 모달 열기
    document.getElementById('invoice-history-modal').classList.add('active');
    document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력을 조회 중입니다...</p>';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력 조회 실패: ' + (result ? result.error : '알 수 없는 오류') + '</p>';
          return;
        }

        var history = result.history || [];

        if (history.length === 0) {
          document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력이 없습니다.</p>';
          return;
        }

        // 이력 렌더링
        var html = history.map(function(invoice, index) {
          var isCancelled = invoice.status === 'CANCELLED';
          var itemClass = isCancelled ? 'invoice-history-item cancelled' : 'invoice-history-item';
          var statusLabel = isCancelled ? '❌ 취소됨' : '✅ 활성';

          return '<div class="' + itemClass + '">' +
            '<div><strong>' + (index + 1) + '. ' + invoice.invoiceId + '</strong> ' + statusLabel + '</div>' +
            '<div class="invoice-history-meta">' +
            '거래처: ' + (invoice.company || '-') + ' | ' +
            '청구일: ' + (invoice.invoiceDate || '-') + ' | ' +
            '금액: ₩' + OB.formatNumber(invoice.amount || 0) + ' | ' +
            '상태: ' + (invoice.status || '-') +
            '</div>' +
            (invoice.notes ? '<div class="invoice-history-meta">비고: ' + invoice.notes + '</div>' : '') +
            (invoice.replacementInvoice ? '<div class="invoice-history-meta">→ 대체청구서: ' + invoice.replacementInvoice + '</div>' : '') +
            (invoice.originalInvoice ? '<div class="invoice-history-meta">← 원본청구서: ' + invoice.originalInvoice + '</div>' : '') +
          '</div>';
        }).join('');

        document.getElementById('invoice-history-list').innerHTML = html;
      })
      .withFailureHandler(function(error) {
        console.error('[ERROR] Load invoice history failed:', error);
        document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력 조회 실패: ' + error.message + '</p>';
      })
      .getInvoiceHistoryApi({ invoiceId: invoiceId });
  }

  // ===========================================================
  // ✅ PaymentManagement 페이지 초기화 함수
  // ===========================================================
  OB.initPaymentManagementPage = function() {
    console.log('[PaymentManagement] 페이지 초기화 시작');

    var wrap = document.querySelector('.payment-wrap');
    if (!wrap) {
      console.warn('PaymentManagement wrapper not found');
      return;
    }

    if (wrap.dataset.bound === '1') {
      console.log('PaymentManagement already initialized');
      return;
    }
    wrap.dataset.bound = '1';

    // 탭 전환 이벤트
    document.querySelectorAll('.payment-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var targetTab = this.getAttribute('data-tab');
        switchPaymentTab(targetTab);
      });
    });

    // 입출금 관리 이벤트
    var paymentAddBtn = document.getElementById('payment-add-btn');
    var paymentResetBtn = document.getElementById('payment-reset-btn');
    var paymentSearchBtn = document.getElementById('payment-search-btn');
    var paymentFilterResetBtn = document.getElementById('payment-filter-reset-btn');
    var paymentDocnum = document.getElementById('payment-docnum');

    if (paymentAddBtn) paymentAddBtn.addEventListener('click', handleAddPayment);
    if (paymentResetBtn) paymentResetBtn.addEventListener('click', resetPaymentForm);
    if (paymentSearchBtn) paymentSearchBtn.addEventListener('click', loadPaymentList);
    if (paymentFilterResetBtn) paymentFilterResetBtn.addEventListener('click', resetPaymentFilters);
    if (paymentDocnum) paymentDocnum.addEventListener('input', handleDocNumAutocomplete);

    // 회사비용 관리 이벤트
    var expenseAddBtn = document.getElementById('expense-add-btn');
    var expenseResetBtn = document.getElementById('expense-reset-btn');
    var expenseSearchBtn = document.getElementById('expense-search-btn');
    var expenseFilterResetBtn = document.getElementById('expense-filter-reset-btn');

    if (expenseAddBtn) expenseAddBtn.addEventListener('click', handleAddExpense);
    if (expenseResetBtn) expenseResetBtn.addEventListener('click', resetExpenseForm);
    if (expenseSearchBtn) expenseSearchBtn.addEventListener('click', loadExpenseList);
    if (expenseFilterResetBtn) expenseFilterResetBtn.addEventListener('click', resetExpenseFilters);

    // 오늘 날짜 기본값 설정
    var today = new Date().toISOString().split('T')[0];
    var paymentDate = document.getElementById('payment-date');
    var expenseDate = document.getElementById('expense-date');
    if (paymentDate) paymentDate.value = today;
    if (expenseDate) expenseDate.value = today;

    // 초기 데이터 로드
    loadPaymentList();
    loadPaymentSummary();
    loadExpenseSummary();

    console.log('✅ PaymentManagement Page 초기화 완료');
  };

  /**
   * 탭 전환 함수
   */
  function switchPaymentTab(tabName) {
    // 탭 버튼 활성화
    document.querySelectorAll('.payment-tab').forEach(function(tab) {
      if (tab.getAttribute('data-tab') === tabName) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });

    // 탭 컨텐츠 표시
    document.querySelectorAll('.payment-tab-content').forEach(function(content) {
      if (content.id === 'tab-' + tabName) {
        content.classList.add('active');
      } else {
        content.classList.remove('active');
      }
    });

    // 탭 전환시 데이터 리로드
    if (tabName === 'payments') {
      loadPaymentList();
      loadPaymentSummary();
    } else if (tabName === 'expenses') {
      loadExpenseList();
      loadExpenseSummary();
    }
  }

</script>
