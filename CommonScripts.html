  OB.monthlyClosingState = {
    currentMonth: '',
    currentStatus: null,
    closingsList: []
  };

  OB.initMonthlyClosingPage = function() {
    console.log('🔧 MonthlyClosing 페이지 초기화 시작');

    var state = OB.monthlyClosingState;

    // DOM 요소
    var monthInput = document.getElementById('monthly-closing-month');
    var checkBtn = document.getElementById('monthly-closing-check-btn');
    var executeBtn = document.getElementById('monthly-closing-execute-btn');
    var unlockBtn = document.getElementById('monthly-closing-unlock-btn');
    var statusDiv = document.getElementById('monthly-closing-status');
    var tbody = document.getElementById('monthly-closing-tbody');

    // 기본 월 설정 (이번 달)
    setDefaultMonth();

    function setDefaultMonth() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      monthInput.value = year + '-' + month;
    }

    // 전체 마감 내역 로드
    loadAllClosings();

    function loadAllClosings() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || !result.success) {
            console.error('마감 내역 조회 실패:', result);
            return;
          }

          state.closingsList = result.closings || [];
          renderClosingsTable(state.closingsList);
        })
        .withFailureHandler(function(error) {
          console.error('마감 내역 조회 실패:', error);
        })
        .getMonthlyClosingsApi();
    }

    // 조회 버튼
    if (checkBtn) {
      checkBtn.addEventListener('click', function() {
        var month = monthInput.value;
        if (!month) {
          alert('마감 월을 선택해주세요.');
          return;
        }

        state.currentMonth = month.replace('-', '');
        checkMonthStatus(state.currentMonth);
      });
    }

    // 마감 실행 버튼
    if (executeBtn) {
      executeBtn.addEventListener('click', function() {
        if (!confirm('월 마감을 실행하시겠습니까?\n마감 후에는 해당 월의 CONFIRMED 상태인 모든 마감이 LOCKED 됩니다.')) {
          return;
        }

        OB.showLoading('월 마감 실행 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('마감 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert(result.message || '월 마감 완료');
            console.log('✅ 월 마감 완료:', result);

            // 상태 다시 조회
            checkMonthStatus(state.currentMonth);
            loadAllClosings();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 마감 실패:', error);
            alert('마감 실패: ' + error.message);
          })
          .executeMonthlyClosingApi({
            yearMonth: state.currentMonth
          });
      });
    }

    // 마감 해제 버튼
    if (unlockBtn) {
      unlockBtn.addEventListener('click', function() {
        if (!confirm('월 마감을 해제하시겠습니까?\n해당 월의 모든 LOCKED 마감이 CONFIRMED로 변경됩니다.')) {
          return;
        }

        OB.showLoading('월 마감 해제 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('해제 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert(result.message || '월 마감 해제 완료');
            console.log('✅ 월 마감 해제 완료:', result);

            // 상태 다시 조회
            checkMonthStatus(state.currentMonth);
            loadAllClosings();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 해제 실패:', error);
            alert('해제 실패: ' + error.message);
          })
          .unlockMonthlyClosingApi({
            yearMonth: state.currentMonth
          });
      });
    }

    // 월 상태 확인
    function checkMonthStatus(yearMonth) {
      // 마감 내역에서 해당 월 찾기
      var closing = null;
      for (var i = 0; i < state.closingsList.length; i++) {
        if (state.closingsList[i].yearMonth === yearMonth) {
          closing = state.closingsList[i];
          break;
        }
      }

      state.currentStatus = closing;
      renderStatus(closing, yearMonth);
      updateButtons(closing);
    }

    // 상태 렌더링
    function renderStatus(closing, yearMonth) {
      var year = yearMonth.substring(0, 4);
      var month = yearMonth.substring(4, 6);

      document.getElementById('monthly-status-title').textContent =
        year + '년 ' + parseInt(month) + '월 마감 상태';

      if (closing) {
        // 마감 완료
        document.getElementById('monthly-status-value').textContent = closing.status;
        document.getElementById('monthly-status-value').className =
          'monthly-status-value status ' + closing.status.toLowerCase();

        document.getElementById('monthly-purchase-count').textContent =
          OB.formatNumber(closing.purchaseCount || 0);
        document.getElementById('monthly-purchase-amount').textContent =
          '₩' + OB.formatNumber(closing.purchaseAmount || 0);
        document.getElementById('monthly-sales-count').textContent =
          OB.formatNumber(closing.salesCount || 0);
        document.getElementById('monthly-sales-amount').textContent =
          '₩' + OB.formatNumber(closing.salesAmount || 0);

        statusDiv.className = 'monthly-status ' + closing.status.toLowerCase();

        // 마감 정보 표시
        var infoDiv = document.getElementById('monthly-status-info');
        var infoText = '';
        if (closing.status === 'CLOSED') {
          infoText = '📌 마감일시: ' + closing.closedAt + ' (마감자: ' + closing.closedBy + ')';
        } else if (closing.status === 'OPEN') {
          infoText = '🔓 마감 해제일시: ' + closing.unlockedAt + ' (해제자: ' + closing.unlockedBy + ')';
        }
        document.getElementById('monthly-closed-info').textContent = infoText;
        infoDiv.style.display = infoText ? 'block' : 'none';

      } else {
        // 마감 전
        document.getElementById('monthly-status-value').textContent = 'OPEN';
        document.getElementById('monthly-status-value').className =
          'monthly-status-value status open';

        document.getElementById('monthly-purchase-count').textContent = '-';
        document.getElementById('monthly-purchase-amount').textContent = '-';
        document.getElementById('monthly-sales-count').textContent = '-';
        document.getElementById('monthly-sales-amount').textContent = '-';

        statusDiv.className = 'monthly-status open';

        document.getElementById('monthly-status-info').style.display = 'none';
      }

      statusDiv.style.display = 'block';
    }

    // 버튼 업데이트
    function updateButtons(closing) {
      if (closing && closing.status === 'CLOSED') {
        executeBtn.style.display = 'none';
        unlockBtn.style.display = 'inline-block';
      } else {
        executeBtn.style.display = 'inline-block';
        unlockBtn.style.display = 'none';
      }
    }

    // 마감 내역 테이블 렌더링
    function renderClosingsTable(closings) {
      if (!closings || closings.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="9" class="monthly-empty">' +
          '<div class="monthly-empty-icon">📋</div>' +
          '<div class="monthly-empty-text">마감 내역이 없습니다</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      // 년월 내림차순 정렬
      closings.sort(function(a, b) {
        return b.yearMonth.localeCompare(a.yearMonth);
      });

      closings.forEach(function(closing) {
        var tr = document.createElement('tr');

        var year = closing.yearMonth.substring(0, 4);
        var month = closing.yearMonth.substring(4, 6);
        var displayMonth = year + '년 ' + month + '월';

        var statusBadge = '<span class="status-badge ' +
          closing.status.toLowerCase() + '">' +
          closing.status + '</span>';

        tr.innerHTML =
          '<td>' + displayMonth + '</td>' +
          '<td class="status">' + statusBadge + '</td>' +
          '<td class="num">' + OB.formatNumber(closing.purchaseCount || 0) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(closing.purchaseAmount || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(closing.salesCount || 0) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(closing.salesAmount || 0) + '</td>' +
          '<td>' + (closing.closedAt || '-') + '</td>' +
          '<td>' + (closing.closedBy || '-') + '</td>' +
          '<td>' + (closing.unlockedAt || '-') + '</td>';

        tbody.appendChild(tr);
      });
    }

    console.log('✅ MonthlyClosing 페이지 초기화 완료');
  };

  // ========================================
  // 청구서 관리 페이지 (BillingManagement)
  // ========================================
  window.initBillingManagementPage = function() {
    console.log('🔄 BillingManagement 페이지 초기화 시작...');

    // DOM 요소
    var companyInput = document.getElementById('billing-mgmt-company');
    var statusSelect = document.getElementById('billing-mgmt-status');
    var startDateInput = document.getElementById('billing-mgmt-start-date');
    var endDateInput = document.getElementById('billing-mgmt-end-date');
    var searchBtn = document.getElementById('billing-mgmt-search-btn');
    var resetBtn = document.getElementById('billing-mgmt-reset-btn');

    var summaryDiv = document.getElementById('billing-mgmt-summary');
    var totalCountSpan = document.getElementById('billing-mgmt-total-count');
    var totalAmountSpan = document.getElementById('billing-mgmt-total-amount');
    var issuedAmountSpan = document.getElementById('billing-mgmt-issued-amount');
    var unpaidAmountSpan = document.getElementById('billing-mgmt-unpaid-amount');

    var tbody = document.getElementById('billing-mgmt-tbody');

    var detailModal = document.getElementById('billing-detail-modal');
    var modalCloseBtn = document.getElementById('billing-modal-close-btn');
    var detailReprintBtn = document.getElementById('billing-detail-reprint-btn');
    var detailChangeStatusBtn = document.getElementById('billing-detail-change-status-btn');

    // 현재 선택된 청구서
    var currentBilling = null;

    // 날짜 기본값 설정 (당월 1일 ~ 말일)
    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    var lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

    startDateInput.value = formatDateInput(firstDay);
    endDateInput.value = formatDateInput(lastDay);

    function formatDateInput(date) {
      var year = date.getFullYear();
      var month = String(date.getMonth() + 1).padStart(2, '0');
      var day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    // 검색 버튼 클릭
    searchBtn.addEventListener('click', function() {
      var company = companyInput.value.trim();
      var status = statusSelect.value;
      var startDate = startDateInput.value;
      var endDate = endDateInput.value;

      console.log('📋 청구서 조회:', { company: company, status: status, startDate: startDate, endDate: endDate });

      OB.showLoading('청구서 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('✅ 청구서 조회 완료:', result);

          if (!result || !result.success) {
            alert('조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          renderSummary(result.billings || []);
          renderTable(result.billings || []);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('❌ 청구서 조회 실패:', error);
          alert('청구서 조회 실패: ' + error.message);
        })
        .getBillingsApi({
          type: '',
          company: company,
          status: status,
          startDate: startDate,
          endDate: endDate
        });
    });

    // 초기화 버튼 클릭
    resetBtn.addEventListener('click', function() {
      companyInput.value = '';
      statusSelect.value = '';
      startDateInput.value = formatDateInput(firstDay);
      endDateInput.value = formatDateInput(lastDay);

      summaryDiv.style.display = 'none';
      tbody.innerHTML =
        '<tr><td colspan="8" class="billing-empty">' +
        '<div class="billing-empty-icon">📋</div>' +
        '<div class="billing-empty-text">조회 버튼을 눌러 청구서 목록을 확인하세요</div>' +
        '</td></tr>';
    });

    // 요약 카드 렌더링
    function renderSummary(billings) {
      if (!billings || billings.length === 0) {
        summaryDiv.style.display = 'none';
        return;
      }

      summaryDiv.style.display = 'grid';

      var totalCount = billings.length;
      var totalAmount = 0;
      var issuedAmount = 0;
      var paidAmount = 0;

      billings.forEach(function(billing) {
        var amount = Number(billing.amount) || 0;
        totalAmount += amount;

        if (billing.status === 'ISSUED' || billing.status === 'PAID') {
          issuedAmount += amount;
        }

        if (billing.status === 'PAID') {
          paidAmount += amount;
        }
      });

      var unpaidAmount = issuedAmount - paidAmount;

      totalCountSpan.textContent = OB.formatNumber(totalCount);
      totalAmountSpan.textContent = '₩' + OB.formatNumber(totalAmount);
      issuedAmountSpan.textContent = '₩' + OB.formatNumber(issuedAmount);
      unpaidAmountSpan.textContent = '₩' + OB.formatNumber(unpaidAmount);
    }

    // 테이블 렌더링
    function renderTable(billings) {
      if (!billings || billings.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="8" class="billing-empty">' +
          '<div class="billing-empty-icon">📋</div>' +
          '<div class="billing-empty-text">조회 결과가 없습니다</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      billings.forEach(function(billing) {
        var tr = document.createElement('tr');

        var statusBadge = '<span class="billing-status-badge ' +
          billing.status + '">' +
          getStatusText(billing.status) + '</span>';

        var typeText = billing.type === 'PURCHASE' ? '매입' : '매출';

        tr.innerHTML =
          '<td>' + billing.billingId + '</td>' +
          '<td>' + typeText + '</td>' +
          '<td>' + billing.company + '</td>' +
          '<td>' + billing.billingDate + '</td>' +
          '<td class="num">₩' + OB.formatNumber(billing.amount) + '</td>' +
          '<td class="center">' + statusBadge + '</td>' +
          '<td>' + (billing.notes || '-') + '</td>' +
          '<td class="center">' +
          '<button class="billing-btn primary small" data-billing-id="' + billing.billingId + '">상세</button>' +
          '</td>';

        tbody.appendChild(tr);
      });

      // 상세보기 버튼 이벤트
      tbody.querySelectorAll('button[data-billing-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var billingId = this.getAttribute('data-billing-id');
          var billing = billings.find(function(b) { return b.billingId === billingId; });
          if (billing) {
            showDetailModal(billing);
          }
        });
      });
    }

    function getStatusText(status) {
      switch (status) {
        case 'DRAFT': return '임시저장';
        case 'ISSUED': return '발행완료';
        case 'PAID': return '입금완료';
        default: return status;
      }
    }

    // 상세보기 모달 열기
    function showDetailModal(billing) {
      currentBilling = billing;

      document.getElementById('detail-billing-id').textContent = billing.billingId || '-';
      document.getElementById('detail-type').textContent = billing.type === 'PURCHASE' ? '매입' : '매출';
      document.getElementById('detail-company').textContent = billing.company || '-';
      document.getElementById('detail-settlement-id').textContent = billing.settlementId || '-';
      document.getElementById('detail-billing-date').textContent = billing.billingDate || '-';
      document.getElementById('detail-amount').textContent = '₩' + OB.formatNumber(billing.amount);
      document.getElementById('detail-status').textContent = getStatusText(billing.status);
      document.getElementById('detail-notes').textContent = billing.notes || '-';

      document.getElementById('detail-created-at').textContent = billing.createdAt || '-';
      document.getElementById('detail-created-by').textContent = billing.createdBy || '-';
      document.getElementById('detail-issued-at').textContent = billing.issuedAt || '-';
      document.getElementById('detail-issued-by').textContent = billing.issuedBy || '-';
      document.getElementById('detail-paid-at').textContent = billing.paidAt || '-';

      detailModal.classList.add('active');
    }

    // 모달 닫기
    modalCloseBtn.addEventListener('click', function() {
      detailModal.classList.remove('active');
      currentBilling = null;
    });

    // 모달 배경 클릭 시 닫기
    detailModal.addEventListener('click', function(e) {
      if (e.target === detailModal) {
        detailModal.classList.remove('active');
        currentBilling = null;
      }
    });

    // 재출력 버튼
    detailReprintBtn.addEventListener('click', function() {
      if (!currentBilling) return;

      var invoiceId = currentBilling.invoiceId || currentBilling.billingId;
      if (!invoiceId) {
        alert('청구ID를 찾을 수 없습니다.');
        return;
      }

      OB.showLoading('청구서 재출력 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('재출력 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          var url = 'https://drive.google.com/uc?export=download&id=' + result.fileId;
          window.open(url, '_blank');
          alert('PDF 재출력이 완료되었습니다!\n파일: ' + result.fileName);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          alert('재출력 실패: ' + error.message);
        })
        .reprintInvoiceApi({
          invoiceId: invoiceId,
          billingId: invoiceId,
          settlementId: currentBilling.settlementId,
          type: currentBilling.type
        });
    });

    // 상태 변경 버튼
    detailChangeStatusBtn.addEventListener('click', function() {
      if (!currentBilling) return;

      var nextStatus = '';
      var nextStatusText = '';

      if (currentBilling.status === 'DRAFT') {
        nextStatus = 'ISSUED';
        nextStatusText = '발행완료';
      } else if (currentBilling.status === 'ISSUED') {
        nextStatus = 'PAID';
        nextStatusText = '입금완료';
      } else {
        alert('더 이상 변경할 수 없는 상태입니다.');
        return;
      }

      var confirmMsg = '청구서 상태를 "' + nextStatusText + '"로 변경하시겠습니까?';
      if (!confirm(confirmMsg)) return;

      OB.showLoading('상태 변경 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('상태 변경 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          alert('상태가 변경되었습니다!');
          detailModal.classList.remove('active');
          currentBilling = null;

          // 목록 새로고침
          searchBtn.click();
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          alert('상태 변경 실패: ' + error.message);
        })
        .updateBillingStatusApi({
          billingId: currentBilling.billingId,
          status: nextStatus
        });
    });

    console.log('✅ BillingManagement 페이지 초기화 완료');
  };

  // ===========================================================
  // ✅ OrderFile 페이지 초기화 함수
  // ===========================================================
  OB.initOrderFilePage = function() {
    var wrap = document.getElementById('ob-orderfile-wrap');
    if (!wrap) {
      console.warn('OrderFile wrapper not found');
      return;
    }

    if (wrap.dataset.bound === '1') {
      console.log('OrderFile already initialized');
      return;
    }
    wrap.dataset.bound = '1';

    console.log('✅ OrderFile Page 초기화 완료');

    var parsedItems = [];
    var currentFilter = 'all'; // 'all' or 'unmatched'

    var customerSelect = document.getElementById('ob-customer-select');
    var fileInput = document.getElementById('ob-orderfile-input');
    var btnParse = document.getElementById('ob-btn-parse');
    var btnSave = document.getElementById('ob-btn-save');
    var tableBody = document.querySelector('#ob-orderfile-table tbody');

    var summaryCards = document.getElementById('ob-summary-cards');
    var summaryTotal = document.getElementById('summary-total');
    var summaryMatched = document.getElementById('summary-matched');
    var summaryUnmatched = document.getElementById('summary-unmatched');
    var summaryAmount = document.getElementById('summary-amount');
    var summaryMatchCard = document.getElementById('summary-match-card');

    var filterControls = document.getElementById('ob-filter-controls');
    var btnFilterUnmatched = document.getElementById('ob-btn-filter-unmatched');
    var btnFilterAll = document.getElementById('ob-btn-filter-all');

    var duplicateModal = document.getElementById('ob-duplicate-modal');
    var duplicateOrderList = document.getElementById('duplicate-order-list');
    var btnDuplicateCancel = document.getElementById('ob-btn-duplicate-cancel');
    var btnDuplicateContinue = document.getElementById('ob-btn-duplicate-continue');

    loadCustomers();

    function loadCustomers() {
      console.log('📄 발주처 목록 로드 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          console.log('✅ 발주처 응답:', result);

          var customerList = [];
          if (result && result.success) {
            if (Array.isArray(result.data)) {
              customerList = result.data;
            } else if (Array.isArray(result.customers)) {
              customerList = result.customers;
            }
          }

          if (!customerList.length) {
            console.warn('⚠️ 발주처 데이터가 비어있습니다.');
            return;
          }

          customerList.forEach(function(customerName) {
            var option = document.createElement('option');
            option.value = customerName;
            option.textContent = customerName;
            customerSelect.appendChild(option);
          });

          console.log('✅ 발주처 드롭다운 채우기 완료');
        })
        .withFailureHandler(function(error) {
          console.error('❌ 발주처 목록 로드 실패:', error);
          alert('발주처 목록을 불러올 수 없습니다: ' + error.message);
        })
        .getCustomers();
    }

    if (btnParse) {
      btnParse.addEventListener('click', function() {
        var file = fileInput.files[0];
        var selectedCustomer = customerSelect.value;

        if (!selectedCustomer) {
          alert('발주처를 먼저 선택해주세요.');
          return;
        }

        if (!file) {
          alert('파일을 먼저 선택해주세요.');
          return;
        }

        console.log('파싱 시작:', file.name, '발주처:', selectedCustomer);
        OB.showLoading('파일을 읽는 중...');

        var reader = new FileReader();

        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });

            var firstSheetName = workbook.SheetNames[0];
            var worksheet = workbook.Sheets[firstSheetName];

            var rows = XLSX.utils.sheet_to_json(worksheet, {
              header: 1,
              defval: '',
              blankrows: false
            });

            console.log('엑셀 읽기 완료. 행 수:', rows.length);

            if (rows.length === 0) {
              OB.hideLoading();
              alert('파일이 비어있습니다.');
              return;
            }

            OB.showLoading('서버에서 매칭 중...');

            google.script.run
              .withSuccessHandler(function(result) {
                OB.hideLoading();
                console.log('파싱 결과:', result);

                if (result && result.items) {
                  parsedItems = result.items.map(function(item) {
                    item.customer = selectedCustomer;
                    return item;
                  });
                  displayParseResult(result);
                  btnSave.disabled = false;
                } else {
                  alert('파싱 결과가 올바르지 않습니다.');
                }
              })
              .withFailureHandler(function(error) {
                OB.hideLoading();
                console.error('파싱 실패:', error);
                alert('파싱 중 오류 발생: ' + error.message);
              })
              .processParsedOrderRows(rows);

          } catch (err) {
            OB.hideLoading();
            console.error('파일 읽기 오류:', err);
            alert('파일을 읽는 중 오류가 발생했습니다.');
          }
        };

        reader.onerror = function(err) {
          OB.hideLoading();
          console.error('파일 로드 실패:', err);
          alert('파일을 불러오는 중 오류가 발생했습니다.');
        };

        reader.readAsArrayBuffer(file);
      });
    }

    if (btnSave) {
      btnSave.addEventListener('click', function() {
        if (!parsedItems || parsedItems.length === 0) {
          alert('저장할 데이터가 없습니다. 먼저 파일을 파싱해주세요.');
          return;
        }

        var unmatched = parsedItems.filter(function(item) { return item.matchStatus !== 'MATCHED'; });

        if (unmatched.length > 0) {
          var confirmMessage = '매칭되지 않은 품목이 ' + unmatched.length + '건 있습니다.\n' +
                               '이대로 저장하시겠습니까?';
          if (!confirm(confirmMessage)) {
            return;
          }
        }

        checkDuplicateOrders(parsedItems, function(canProceed, duplicates) {
          if (!canProceed) {
            duplicateModal.style.display = 'flex';
            renderDuplicates(duplicates);
            return;
          }

          saveOrders(parsedItems);
        });
      });
    }

    function renderDuplicates(duplicates) {
      duplicateOrderList.innerHTML = '';

      // checkTodayDuplicateOrder 반환 형식:
      // { orderCode, brands, itemCount, totalAmount }
      duplicates.forEach(function(dup) {
        var li = document.createElement('div');
        li.className = 'ob-modal-list-item';
        li.innerHTML = '<div><div class="title">' + (dup.orderCode || '발주번호 없음') + '</div>' +
                       '<div class="sub">브랜드: ' + (dup.brands || '-') + ', 품목수: ' + (dup.itemCount || 0) + '건</div></div>' +
                       '<div class="status">₩' + OB.formatNumber(dup.totalAmount || 0) + '</div>';
        duplicateOrderList.appendChild(li);
      });
    }

    if (btnDuplicateCancel) {
      btnDuplicateCancel.addEventListener('click', function() {
        duplicateModal.style.display = 'none';
      });
    }

    if (btnDuplicateContinue) {
      btnDuplicateContinue.addEventListener('click', function() {
        duplicateModal.style.display = 'none';
        saveOrders(parsedItems);
      });
    }

    function checkDuplicateOrders(items, callback) {
      var today = new Date();
      var yyyy = today.getFullYear();
      var mm = ('0' + (today.getMonth() + 1)).slice(-2);
      var dd = ('0' + today.getDate()).slice(-2);
      var todayStr = yyyy + '-' + mm + '-' + dd;

      var customer = items[0] ? items[0].customer : '';
      if (!customer) {
        callback(true, []);
        return;
      }

      OB.showLoading('오늘 발주 내역 확인 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('중복 체크 결과:', result);

          if (!result || !result.success || !result.hasDuplicate) {
            callback(true, []);
            return;
          }

          // 중복 발주가 있으면 orders 배열 전달
          if (result.orders && result.orders.length > 0) {
            callback(false, result.orders);
          } else {
            callback(true, []);
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('중복 확인 실패:', error);
          alert('중복 확인 중 오류가 발생했습니다: ' + error.message);
          callback(true, []);
        })
        .checkTodayDuplicateOrder(customer, todayStr);
    }

    function saveOrders(items) {
      OB.showLoading('발주 저장 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('발주 저장 결과:', result);

          if (result && result.success) {
            alert('발주 저장이 완료되었습니다. (' + result.savedRows + '건)');
            btnSave.disabled = true;
            // 테이블 초기화
            parsedItems = [];
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #9ca3af;">파일을 선택하고 파싱 버튼을 클릭하세요</td></tr>';
            summaryCards.style.display = 'none';
            filterControls.style.display = 'none';
          } else {
            var errorMsg = '발주 저장 실패:\n';
            if (result && result.errors && result.errors.length > 0) {
              errorMsg += result.errors.slice(0, 5).join('\n');
              if (result.errors.length > 5) {
                errorMsg += '\n... 외 ' + (result.errors.length - 5) + '건';
              }
            } else {
              errorMsg += (result ? result.error : '알 수 없는 오류');
            }
            alert(errorMsg);
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('발주 저장 실패:', error);
          alert('발주 저장 중 오류 발생: ' + error.message);
        })
        .saveParsedOrdersToDB(items);
    }

    function displayParseResult(result) {
      if (!result || !result.items) {
        alert('파싱 결과가 올바르지 않습니다.');
        return;
      }

      // ✅ 디버그 정보 확인 및 경고 표시
      if (result.debug) {
        console.log('=== 파싱 디버그 정보 ===');
        console.log('원본 헤더:', result.debug.originalHeader);
        console.log('컬럼 매핑:', result.debug.columnMap);

        var warnings = [];
        if (!result.debug.barcodeDetected) {
          warnings.push('바코드 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.brandDetected) {
          warnings.push('브랜드 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.productNameDetected) {
          warnings.push('제품명 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.supplyPriceDetected) {
          warnings.push('공급가 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.orderQtyDetected) {
          warnings.push('수량 컬럼을 찾을 수 없습니다');
        }

        if (warnings.length > 0) {
          console.warn('⚠️ 컬럼 감지 경고:', warnings);

          // 경고 메시지 표시
          var warningHtml = '<div style="background: #fef3c7; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 16px;">' +
            '<strong style="color: #92400e;">⚠️ 컬럼 감지 경고</strong><br>' +
            '<span style="color: #78350f;">' + warnings.join(', ') + '</span><br>' +
            '<small style="color: #92400e;">엑셀 헤더: ' + (result.debug.originalHeader ? result.debug.originalHeader.slice(0, 10).join(', ') : 'N/A') + '</small>' +
            '</div>';

          // 테이블 위에 경고 삽입
          var tableWrap = document.querySelector('.ob-orderfile-table-wrap');
          if (tableWrap) {
            var existingWarning = tableWrap.querySelector('.column-warning');
            if (existingWarning) existingWarning.remove();

            var warningDiv = document.createElement('div');
            warningDiv.className = 'column-warning';
            warningDiv.innerHTML = warningHtml;
            tableWrap.insertBefore(warningDiv, tableWrap.firstChild);
          }
        }
      }

      // 요약 카드 표시
      summaryCards.style.display = 'grid';

      summaryTotal.textContent = result.items.length + '개';
      summaryMatched.textContent = (result.matchedCount || 0) + '개';
      summaryUnmatched.textContent = '미매칭 ' + (result.unmatchedCount || 0) + '개';
      summaryAmount.textContent = '₩' + OB.formatNumber(result.totalAmount || 0);

      if (result.items.length > 0) {
        var matchRate = ((result.matchedCount || 0) / result.items.length) * 100;
        if (matchRate >= 80) {
          summaryMatchCard.classList.add('success');
          summaryMatchCard.classList.remove('highlight');
        } else {
          summaryMatchCard.classList.add('highlight');
          summaryMatchCard.classList.remove('success');
        }
      }

      var hasUnmatched = (result.unmatchedCount || 0) > 0;
      filterControls.style.display = hasUnmatched ? 'flex' : 'none';
      btnFilterAll.style.display = 'none';
      btnFilterUnmatched.style.display = hasUnmatched ? 'inline-block' : 'none';

      renderTable(result.items);
    }

    function renderTable(items) {
      tableBody.innerHTML = '';

      // HTML 테이블 헤더: #, 브랜드, 제품명, 바코드, 수량, 공급단가, 금액, 상태
      items.forEach(function(item, index) {
        var tr = document.createElement('tr');
        var isMatched = item.matchStatus === 'MATCHED';

        if (isMatched) {
          tr.classList.add('matched');
        } else {
          tr.classList.add('unmatched');
        }

        tr.innerHTML =
          '<td>' + (item.seq || index + 1) + '</td>' +
          '<td>' + (item.brand || '') + '</td>' +
          '<td>' + (item.productName || '') + '</td>' +
          '<td>' + (item.barcode || '-') + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.supplyPrice || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderAmount || 0) + '</td>' +
          '<td class="status-cell">' +
            (isMatched ? '<span class="status-text status-matched">매칭</span>' : '<span class="status-text status-unmatched">미매칭</span>') +
          '</td>';

        tableBody.appendChild(tr);
      });
    }

    if (btnFilterUnmatched) {
      btnFilterUnmatched.addEventListener('click', function() {
        currentFilter = 'unmatched';
        applyFilter();
        btnFilterUnmatched.style.display = 'none';
        btnFilterAll.style.display = 'inline-block';
      });
    }

    if (btnFilterAll) {
      btnFilterAll.addEventListener('click', function() {
        currentFilter = 'all';
        applyFilter();
        btnFilterAll.style.display = 'none';
        btnFilterUnmatched.style.display = 'inline-block';
      });
    }

    function applyFilter() {
      var rows = tableBody.querySelectorAll('tr');
      rows.forEach(function(row) {
        if (currentFilter === 'unmatched') {
          if (row.classList.contains('matched')) {
            row.classList.add('hidden');
          } else {
            row.classList.remove('hidden');
          }
        } else {
          row.classList.remove('hidden');
        }
      });
    }
  };

  // ===========================================================
  // ✅ TransactionLedger 페이지 초기화 함수
  // ===========================================================
  OB.transactionLedgerState = {
    raw: [],
    filtered: []
  };

  OB.initTransactionLedgerPage = function() {
    console.log('🔄 TransactionLedger 페이지 초기화 시작...');

    var state = OB.transactionLedgerState;

    var startDateInput = document.getElementById('ledger-start-date');
    var endDateInput = document.getElementById('ledger-end-date');
    var companyInput = document.getElementById('ledger-company');
    var statusSelect = document.getElementById('ledger-status');
    var orderCodeInput = document.getElementById('ledger-order-code');
    var searchBtn = document.getElementById('ledger-search-btn');
    var resetBtn = document.getElementById('ledger-reset-btn');
    var tbody = document.getElementById('ledger-tbody');

    var summaryCount = document.getElementById('ledger-summary-count');
    var summaryOrderQty = document.getElementById('ledger-summary-order-qty');
    var summaryConfirmedQty = document.getElementById('ledger-summary-confirmed-qty');
    var summaryAmount = document.getElementById('ledger-summary-amount');

    // 체크박스 및 일괄 액션 버튼
    var selectAllCheckbox = document.getElementById('ledger-select-all');
    var bulkInvoiceBtn = document.getElementById('ledger-bulk-invoice-btn');
    var bulkStatusBtn = document.getElementById('ledger-bulk-status-btn');
    var selectedCountSpan = document.getElementById('ledger-selected-count');

    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    startDateInput.value = formatDateInput(firstDay);
    endDateInput.value = formatDateInput(today);

    function formatDateInput(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function parseDate(value) {
      if (!value) return null;
      var d = value instanceof Date ? value : new Date(value);
      return isNaN(d.getTime()) ? null : d;
    }

    function applyFilters() {
      var start = parseDate(startDateInput.value);
      var end = parseDate(endDateInput.value);
      var company = (companyInput.value || '').trim();
      var status = statusSelect.value;
      var orderCode = (orderCodeInput.value || '').trim();

      state.filtered = state.raw.filter(function(tx) {
        var keep = true;

        if (orderCode) {
          keep = keep && String(tx['발주번호'] || '').indexOf(orderCode) !== -1;
        }

        if (company) {
          keep = keep && String(tx['발주처'] || '').indexOf(company) !== -1;
        }

        if (status) {
          // 4개 상태 컬럼 중 하나라도 매칭되면 포함
          var matchFound = false;
          var statusUpper = status.toUpperCase();
          if (String(tx['매입발주'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['매입결제'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['매출결제'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['출고'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          keep = keep && matchFound;
        }

        if (start || end) {
          var orderDate = parseDate(tx['발주일']);
          if (start && (!orderDate || orderDate < start)) keep = false;
          if (end && (!orderDate || orderDate > end)) keep = false;
        }

        return keep;
      });

      renderSummary();
      renderTable();
    }

    function renderSummary() {
      var totalOrderQty = 0;
      var totalConfirmedQty = 0;
      var totalAmount = 0;

      state.filtered.forEach(function(tx) {
        totalOrderQty += Number(tx['발주수량']) || 0;
        totalConfirmedQty += Number(tx['확정수량']) || 0;
        totalAmount += Number(tx['공급액']) || 0;
      });

      summaryCount.textContent = (state.filtered.length || 0) + '건';
      summaryOrderQty.textContent = OB.formatNumber(totalOrderQty);
      summaryConfirmedQty.textContent = OB.formatNumber(totalConfirmedQty);
      summaryAmount.textContent = '₩' + OB.formatNumber(totalAmount);
    }

    function buildStatusSelect(current) {
      var select = document.createElement('select');
      select.className = 'ledger-status-select';
      var options = ['DRAFT', 'CONFIRMED', 'ISSUED', 'PAID', 'CANCELLED'];

      if (current && options.indexOf(current) === -1) {
        options.unshift(current);
      }

      options.forEach(function(opt) {
        var optionEl = document.createElement('option');
        optionEl.value = opt;
        optionEl.textContent = opt;
        if (current === opt) {
          optionEl.selected = true;
        }
        select.appendChild(optionEl);
      });

      return select;
    }

    function renderTable() {
      if (!tbody) return;

      if (!state.filtered.length) {
        tbody.innerHTML = '<tr><td colspan="13" class="ledger-empty">조회 결과가 없습니다.</td></tr>';
        return;
      }

      // 거래번호 단위로 집계
      var aggregated = {};
      state.filtered.forEach(function(tx) {
        var orderNum = tx['발주번호'];
        if (!orderNum) return;

        if (!aggregated[orderNum]) {
          aggregated[orderNum] = {
            orderDate: tx['발주일'],
            orderNumber: orderNum,
            company: tx['발주처'],
            brand: tx['브랜드'] || '-',
            items: [],
            totalOrderQty: 0,
            totalConfirmedQty: 0,
            totalPurchaseAmt: 0,
            totalSupplyAmt: 0,
            totalMarginAmt: 0,
            buyOrder: tx['매입발주'] || '',
            payBuy: tx['매입결제'] || '',
            paySell: tx['매출결제'] || '',
            ship: tx['출고'] || ''
          };
        }

        aggregated[orderNum].items.push(tx);
        var confirmedQty = Number(tx['확정수량']) || 0;
        var buyPrice = Number(tx['매입가']) || 0;
        var supplyPrice = Number(tx['공급가']) || 0;

        aggregated[orderNum].totalOrderQty += Number(tx['발주수량']) || 0;
        aggregated[orderNum].totalConfirmedQty += confirmedQty;
        aggregated[orderNum].totalPurchaseAmt += confirmedQty * buyPrice;
        aggregated[orderNum].totalSupplyAmt += confirmedQty * supplyPrice;
      });

      // 마진액 계산
      Object.keys(aggregated).forEach(function(key) {
        var agg = aggregated[key];
        agg.totalMarginAmt = agg.totalSupplyAmt - agg.totalPurchaseAmt;
        agg.marginRate = agg.totalSupplyAmt > 0 ? ((agg.totalMarginAmt / agg.totalSupplyAmt) * 100).toFixed(1) : 0;
      });

      tbody.innerHTML = '';

      Object.keys(aggregated).forEach(function(orderNum) {
        var agg = aggregated[orderNum];
        var tr = document.createElement('tr');
        tr.dataset.orderNumber = agg.orderNumber;

        // 체크박스
        var checkTd = document.createElement('td');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'ledger-row-checkbox';
        checkbox.dataset.orderNumber = agg.orderNumber;
        checkbox.dataset.company = agg.company;
        checkTd.appendChild(checkbox);
        tr.appendChild(checkTd);

        // 발주일
        var td = document.createElement('td');
        td.textContent = OB.formatDate(agg.orderDate);
        tr.appendChild(td);

        // 발주번호 (클릭 가능)
        td = document.createElement('td');
        var link = document.createElement('a');
        link.textContent = agg.orderNumber;
        link.href = '#';
        link.style.color = '#2563eb';
        link.style.textDecoration = 'underline';
        link.addEventListener('click', function(e) {
          e.preventDefault();
          showOrderDetailModal(agg);
        });
        td.appendChild(link);
        tr.appendChild(td);

        // 발주처
        td = document.createElement('td');
        td.textContent = agg.company || '-';
        tr.appendChild(td);

        // 브랜드
        td = document.createElement('td');
        td.textContent = agg.brand;
        tr.appendChild(td);

        // 수량 (발주수량)
        td = document.createElement('td');
        td.className = 'num';
        td.textContent = OB.formatNumber(agg.totalOrderQty);
        tr.appendChild(td);

        // 확정수량
        td = document.createElement('td');
        td.className = 'num';
        td.textContent = OB.formatNumber(agg.totalConfirmedQty);
        tr.appendChild(td);

        // 매입액
        td = document.createElement('td');
        td.className = 'num';
        td.textContent = OB.formatCurrency(agg.totalPurchaseAmt);
        tr.appendChild(td);

        // 공급액
        td = document.createElement('td');
        td.className = 'num';
        td.textContent = OB.formatCurrency(agg.totalSupplyAmt);
        tr.appendChild(td);

        // 마진액 (색상)
        td = document.createElement('td');
        td.className = 'num';
        td.style.color = agg.totalMarginAmt >= 0 ? '#059669' : '#dc2626';
        td.style.fontWeight = '600';
        td.textContent = OB.formatCurrency(agg.totalMarginAmt);
        tr.appendChild(td);

        // 마진율 (색상)
        td = document.createElement('td');
        td.className = 'num';
        td.style.color = agg.totalMarginAmt >= 0 ? '#059669' : '#dc2626';
        td.textContent = agg.marginRate + '%';
        tr.appendChild(td);

        // 상태 (✓✗ 형태, 색상 입히기)
        td = document.createElement('td');
        td.style.textAlign = 'center';
        td.style.fontFamily = 'monospace';
        td.style.fontSize = '14px';
        td.style.fontWeight = 'bold';

        function getStatusSymbol(status) {
          if (!status) return { symbol: '✗', color: '#dc2626' }; // 빨간색
          var completed = ['완료', '결제완료', '발주완료', '출고완료', 'COMPLETED', 'PAID', 'CONFIRMED'];
          var isCompleted = completed.indexOf(status) !== -1;
          return {
            symbol: isCompleted ? '✓' : '✗',
            color: isCompleted ? '#059669' : '#dc2626' // 초록색 : 빨간색
          };
        }

        // 각 상태를 span으로 감싸서 색상 적용
        var statuses = [agg.buyOrder, agg.payBuy, agg.paySell, agg.ship];
        statuses.forEach(function(status) {
          var result = getStatusSymbol(status);
          var span = document.createElement('span');
          span.textContent = result.symbol;
          span.style.color = result.color;
          td.appendChild(span);
        });

        tr.appendChild(td);

        tbody.appendChild(tr);
      });

      // 체크박스 변경 이벤트 연결
      updateBulkButtons();
    }

    function updateBulkButtons() {
      setTimeout(function() {
        var checkboxes = document.querySelectorAll('.ledger-row-checkbox');
        var checkedBoxes = Array.prototype.filter.call(checkboxes, function(cb) { return cb.checked; });
        var count = checkedBoxes.length;

        // 버튼 항상 표시, disabled 속성으로 제어
        if (bulkInvoiceBtn) {
          bulkInvoiceBtn.disabled = count === 0;
        }
        if (bulkStatusBtn) {
          bulkStatusBtn.disabled = count === 0;
        }
        if (selectedCountSpan) {
          selectedCountSpan.textContent = count;
        }

        // 전체 선택 체크박스 상태 업데이트
        if (selectAllCheckbox && checkboxes.length > 0) {
          selectAllCheckbox.checked = count === checkboxes.length;
          selectAllCheckbox.indeterminate = count > 0 && count < checkboxes.length;
        }
      }, 50);
    }

    function showOrderDetailModal(agg) {
      var html = '<div style="max-height:600px; overflow:auto;">';
      html += '<h3 style="margin:0 0 16px;">발주번호: ' + agg.orderNumber + '</h3>';

      // 상태 변경 섹션 추가
      html += '<div style="background:#f8fafc; padding:16px; border-radius:8px; margin-bottom:20px; border:1px solid #e2e8f0;">';
      html += '<h4 style="margin:0 0 12px; font-size:14px; color:#475569;">상태 변경</h4>';
      html += '<div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;">';

      var statusConfigs = [
        { label: '매입발주', key: 'buyOrder', current: agg.buyOrder || '', options: ['', '발주대기', '발주완료', '발주취소'] },
        { label: '매입결제', key: 'payBuy', current: agg.payBuy || '', options: ['', '미결제', '부분결제', '결제완료'] },
        { label: '매출결제', key: 'paySell', current: agg.paySell || '', options: ['', '미결제', '부분결제', '결제완료'] },
        { label: '출고', key: 'ship', current: agg.ship || '', options: ['', '미출고', '출고준비', '출고완료', '배송중', '배송완료'] }
      ];

      statusConfigs.forEach(function(config) {
        html += '<div>';
        html += '<label style="display:block; margin-bottom:4px; font-weight:600; font-size:12px; color:#64748b;">' + config.label + '</label>';
        html += '<select id="detail-status-' + config.key + '" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:4px; font-size:12px;">';
        config.options.forEach(function(opt) {
          var selected = opt === config.current ? ' selected' : '';
          var displayText = opt === '' ? '- 선택 -' : opt;
          html += '<option value="' + opt + '"' + selected + '>' + displayText + '</option>';
        });
        html += '</select>';
        html += '</div>';
      });

      html += '</div>';
      html += '<div style="margin-top:12px; text-align:right;">';
      html += '<button id="save-status-btn" class="ledger-btn primary" style="font-size:12px; padding:6px 16px;">상태 저장</button>';
      html += '</div>';
      html += '</div>';

      // 품목 상세 테이블
      html += '<h4 style="margin:0 0 12px; font-size:14px; color:#475569;">품목 상세</h4>';
      html += '<table id="order-detail-table" style="width:100%; border-collapse:collapse; font-size:12px;">';
      html += '<thead><tr style="background:#f8fafc;">';
      html += '<th style="padding:6px; border:1px solid #e5e7eb;">브랜드</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb;">품목코드</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb;">제품명</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">발주수량</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">확정수량</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">매입가</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">구매액</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">공급가</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">공급액</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">마진액</th>';
      html += '<th style="padding:6px; border:1px solid #e5e7eb; text-align:right;">마진율</th>';
      html += '</tr></thead><tbody>';

      var totalOrderQty = 0, totalConfirmedQty = 0, totalPurchaseAmt = 0, totalSupplyAmt = 0, totalMarginAmt = 0;

      agg.items.forEach(function(item, idx) {
        var orderQty = Number(item['발주수량']) || 0;
        var confirmedQty = Number(item['확정수량']) || 0;
        var buyPrice = Number(item['매입가']) || 0;
        var supplyPrice = Number(item['공급가']) || 0;
        var purchaseAmt = confirmedQty * buyPrice;
        var supplyAmt = confirmedQty * supplyPrice;
        var marginAmt = supplyAmt - purchaseAmt;
        var marginRate = supplyAmt > 0 ? ((marginAmt / supplyAmt) * 100).toFixed(1) : 0;

        totalOrderQty += orderQty;
        totalConfirmedQty += confirmedQty;
        totalPurchaseAmt += purchaseAmt;
        totalSupplyAmt += supplyAmt;
        totalMarginAmt += marginAmt;

        var marginColor = marginAmt >= 0 ? '#059669' : '#dc2626';

        html += '<tr data-row-idx="' + idx + '">';
        html += '<td style="padding:6px; border:1px solid #e5e7eb;">' + (item['브랜드'] || '-') + '</td>';
        html += '<td style="padding:6px; border:1px solid #e5e7eb;">' + (item['품목코드'] || '-') + '</td>';
        html += '<td style="padding:6px; border:1px solid #e5e7eb;">' + (item['제품명'] || '-') + '</td>';
        html += '<td style="padding:6px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(orderQty) + '</td>';
        html += '<td style="padding:6px; border:1px solid #e5e7eb; text-align:right;">';
        html += '<input type="number" class="confirmed-qty-input" data-idx="' + idx + '" value="' + confirmedQty + '" ';
        html += 'style="width:70px; padding:4px; text-align:right; border:1px solid #cbd5e1; border-radius:4px;" ';
        html += 'data-buy-price="' + buyPrice + '" data-supply-price="' + supplyPrice + '" />';
        html += '</td>';
        html += '<td class="buy-price" style="padding:6px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(buyPrice) + '</td>';
        html += '<td class="purchase-amt" style="padding:6px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(purchaseAmt) + '</td>';
        html += '<td class="supply-price" style="padding:6px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(supplyPrice) + '</td>';
        html += '<td class="supply-amt" style="padding:6px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(supplyAmt) + '</td>';
        html += '<td class="margin-amt" style="padding:6px; border:1px solid #e5e7eb; text-align:right; color:' + marginColor + '; font-weight:600;">' + OB.formatNumber(marginAmt) + '</td>';
        html += '<td class="margin-rate" style="padding:6px; border:1px solid #e5e7eb; text-align:right; color:' + marginColor + ';">' + marginRate + '%</td>';
        html += '</tr>';
      });

      var totalMarginRate = totalSupplyAmt > 0 ? ((totalMarginAmt / totalSupplyAmt) * 100).toFixed(1) : 0;
      var totalMarginColor = totalMarginAmt >= 0 ? '#059669' : '#dc2626';
      html += '<tr style="background:#f1f5f9; font-weight:600;">';
      html += '<td colspan="3" style="padding:8px; border:1px solid #e5e7eb; text-align:center;">합계</td>';
      html += '<td id="total-order-qty" style="padding:8px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(totalOrderQty) + '</td>';
      html += '<td id="total-confirmed-qty" style="padding:8px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(totalConfirmedQty) + '</td>';
      html += '<td style="padding:8px; border:1px solid #e5e7eb;"></td>';
      html += '<td id="total-purchase-amt" style="padding:8px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(totalPurchaseAmt) + '</td>';
      html += '<td style="padding:8px; border:1px solid #e5e7eb;"></td>';
      html += '<td id="total-supply-amt" style="padding:8px; border:1px solid #e5e7eb; text-align:right;">' + OB.formatNumber(totalSupplyAmt) + '</td>';
      html += '<td id="total-margin-amt" style="padding:8px; border:1px solid #e5e7eb; text-align:right; color:' + totalMarginColor + ';">' + OB.formatNumber(totalMarginAmt) + '</td>';
      html += '<td id="total-margin-rate" style="padding:8px; border:1px solid #e5e7eb; text-align:right; color:' + totalMarginColor + ';">' + totalMarginRate + '%</td>';
      html += '</tr>';

      html += '</tbody></table></div>';

      var modal = document.createElement('div');
      modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:10000; display:flex; align-items:center; justify-content:center;';

      var content = document.createElement('div');
      content.style.cssText = 'background:white; padding:24px; border-radius:12px; max-width:1200px; width:95%;';
      content.innerHTML = html;

      // 실시간 재계산 이벤트 리스너
      setTimeout(function() {
        var inputs = content.querySelectorAll('.confirmed-qty-input');
        inputs.forEach(function(input) {
          input.addEventListener('input', function() {
            var idx = parseInt(input.getAttribute('data-idx'));
            var newQty = Number(input.value) || 0;
            var buyPrice = Number(input.getAttribute('data-buy-price')) || 0;
            var supplyPrice = Number(input.getAttribute('data-supply-price')) || 0;

            var row = content.querySelector('[data-row-idx="' + idx + '"]');
            var purchaseAmt = newQty * buyPrice;
            var supplyAmt = newQty * supplyPrice;
            var marginAmt = supplyAmt - purchaseAmt;
            var marginRate = supplyAmt > 0 ? ((marginAmt / supplyAmt) * 100).toFixed(1) : 0;
            var marginColor = marginAmt >= 0 ? '#059669' : '#dc2626';

            row.querySelector('.purchase-amt').textContent = OB.formatNumber(purchaseAmt);
            row.querySelector('.supply-amt').textContent = OB.formatNumber(supplyAmt);
            row.querySelector('.margin-amt').textContent = OB.formatNumber(marginAmt);
            row.querySelector('.margin-amt').style.color = marginColor;
            row.querySelector('.margin-rate').textContent = marginRate + '%';
            row.querySelector('.margin-rate').style.color = marginColor;

            // 합계 재계산
            recalculateTotals();
          });
        });

        function recalculateTotals() {
          var totalConfirmed = 0, totalPurchase = 0, totalSupply = 0, totalMargin = 0;
          inputs.forEach(function(inp) {
            var qty = Number(inp.value) || 0;
            var buyPrice = Number(inp.getAttribute('data-buy-price')) || 0;
            var supplyPrice = Number(inp.getAttribute('data-supply-price')) || 0;
            totalConfirmed += qty;
            totalPurchase += qty * buyPrice;
            totalSupply += qty * supplyPrice;
          });
          totalMargin = totalSupply - totalPurchase;
          var totalRate = totalSupply > 0 ? ((totalMargin / totalSupply) * 100).toFixed(1) : 0;
          var totalColor = totalMargin >= 0 ? '#059669' : '#dc2626';

          content.querySelector('#total-purchase-amt').textContent = OB.formatNumber(totalPurchase);

          var newQty = Number(input.value) || 0;

            confirmedQty: newQty
          });
        });

        google.script.run

    console.log('🔄 InvoiceManagement 페이지 초기화 시작...');

    var filterStart = document.getElementById('invoice-filter-start');
    var filterEnd = document.getElementById('invoice-filter-end');
    var searchBtn = document.getElementById('invoice-search-btn');
    var resetBtn = document.getElementById('invoice-reset-btn');
    var listTbody = document.getElementById('invoice-list-tbody');
    var listCount = document.getElementById('invoice-list-count');
    var listAmount = document.getElementById('invoice-list-amount');

    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    aggStart.value = formatDateInput(firstDay);
    aggEnd.value = formatDateInput(today);
    filterStart.value = formatDateInput(firstDay);
    filterEnd.value = formatDateInput(today);
    createDate.value = formatDateInput(today);

    function formatDateInput(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function renderAggTable(items) {
      if (!items || !items.length) {
        aggTbody.innerHTML = '<tr><td colspan="8" class="invoice-empty">집계 결과가 없습니다.</td></tr>';
        return;
      }

      aggTbody.innerHTML = '';

      items.forEach(function(item) {
        var tr = document.createElement('tr');
        function td(text, cls) {
          var cell = document.createElement('td');
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }

        td(item.orderDate || '-');
        td(item.orderCode || '-');
        td(item.supplier || '-');
        td(item.brand || '-');
        td(item.productName || '-');
        td(OB.formatNumber(item.confirmedQty || 0), 'num');
        td(OB.formatNumber(item.supplyPrice || 0), 'num');
        td(OB.formatNumber(item.supplyAmount || 0), 'num');

        aggTbody.appendChild(tr);
      });
    }

    function renderAggSummary(result) {
      aggItemsEl.textContent = OB.formatNumber(result.totalItems || 0);
      aggOrderQtyEl.textContent = OB.formatNumber(result.totalOrderQty || 0);
      aggConfirmedQtyEl.textContent = OB.formatNumber(result.totalConfirmedQty || 0);
      aggAmountEl.textContent = '₩' + OB.formatNumber(result.totalAmount || 0);
    }

    function aggregate() {
      var company = (aggCompany.value || '').trim();
      var startDate = aggStart.value;
      var endDate = aggEnd.value;

      OB.showLoading('청구 데이터 집계 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('집계 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          state.aggItems = res.items || [];
          state.aggAmount = res.totalAmount || 0;

          renderAggSummary(res);
          renderAggTable(state.aggItems);
          aggSummary.style.display = 'grid';
          aggTableWrap.style.display = 'block';

          if (company) {
            createCompany.value = company;
          }
          if (state.aggAmount) {
            createAmount.value = state.aggAmount;
          }
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('집계 실패: ' + err.message);
        })
        .aggregateInvoiceDataApi({ company: company, startDate: startDate, endDate: endDate });
    }

    aggBtn.addEventListener('click', aggregate);

    function createInvoice() {
      var settlementId = (createSettlement.value || '').trim();
      var type = createType.value;
      var company = (createCompany.value || '').trim();
      var invoiceDate = createDate.value;
      var amount = Number(createAmount.value) || 0;
      var notes = (createNotes.value || '').trim();

      if (!settlementId || !type || !company) {
        alert('마감 ID, 유형, 거래처를 입력해주세요.');
        return;
      }

      if (!amount && state.aggAmount) {
        amount = state.aggAmount;
      }

      OB.showLoading('청구서 생성 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('청구서 생성 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          alert('청구서가 생성되었습니다! ID: ' + res.invoiceId);
          loadInvoices();
        })
        .withFailureHandler(function(err) {

        })
        .createInvoiceFromSettlementApi({
          settlementId: settlementId,
          type: type,
          company: company,
          invoiceDate: invoiceDate,
          amount: amount,
          notes: notes
        });
    }

    createBtn.addEventListener('click', createInvoice);

    function renderInvoiceTable(list) {
      if (!list || !list.length) {
        listTbody.innerHTML = '<tr><td colspan="9" class="invoice-empty">조회된 인보이스가 없습니다.</td></tr>';
        return;
      }

      listTbody.innerHTML = '';

      list.forEach(function(inv) {
        var tr = document.createElement('tr');

        function td(text, cls) {
          var cell = document.createElement('td');
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }

        td(inv.invoiceId || '-');
        td(inv.type || '-');
        td(inv.company || '-');
        td(inv.settlementId || '-');
        td(inv.invoiceDate || '-');
        td(OB.formatNumber(inv.amount || 0), 'num');

        var statusTd = document.createElement('td');
        var badge = document.createElement('span');
        badge.className = 'invoice-badge';
        badge.textContent = inv.status || 'N/A';
        statusTd.appendChild(badge);
        tr.appendChild(statusTd);

        td(inv.notes || '-');

        var actionTd = document.createElement('td');
        var btn = document.createElement('button');
        btn.className = 'invoice-btn primary';
        btn.textContent = '상태 변경';

        btn.addEventListener('click', function() {
          var nextStatus = '';
          var status = inv.status || 'DRAFT';

          if (status === 'DRAFT') {
            nextStatus = 'ISSUED';
          } else if (status === 'ISSUED') {
            nextStatus = 'PAID';
          } else {
            alert('변경 가능한 상태가 없습니다.');
            return;
          }

          if (!confirm('상태를 ' + nextStatus + ' 로 변경하시겠습니까?')) return;

          OB.showLoading('인보이스 상태 변경 중...');

          google.script.run
            .withSuccessHandler(function(res) {
              OB.hideLoading();

              if (!res || !res.success) {
                alert('상태 변경 실패: ' + (res ? res.error : '알 수 없는 오류'));
                return;
              }

              alert('상태가 변경되었습니다.');
              loadInvoices();
            })
            .withFailureHandler(function(err) {
              OB.hideLoading();
              alert('상태 변경 실패: ' + err.message);
            })
            .updateInvoiceStatusApi({ invoiceId: inv.invoiceId, status: nextStatus });
        });

        actionTd.appendChild(btn);
        tr.appendChild(actionTd);

        listTbody.appendChild(tr);
      });
    }

    function renderInvoiceSummary(list) {
      var totalAmount = 0;
      list.forEach(function(inv) {
        totalAmount += Number(inv.amount) || 0;
      });

      listCount.textContent = (list.length || 0) + '건';
      listAmount.textContent = '₩' + OB.formatNumber(totalAmount);
    }

    function loadInvoices() {
      var params = {
        type: filterType.value,
        company: (filterCompany.value || '').trim(),
        status: filterStatus.value,
        startDate: filterStart.value,
        endDate: filterEnd.value
      };

      OB.showLoading('인보이스 목록 조회 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('조회 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          state.invoices = res.invoices || [];
          renderInvoiceTable(state.invoices);
          renderInvoiceSummary(state.invoices);
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('조회 실패: ' + err.message);
        })
        .getInvoicesApi(params);
    }

    searchBtn.addEventListener('click', loadInvoices);

    resetBtn.addEventListener('click', function() {
      filterType.value = '';
      filterCompany.value = '';
      filterStatus.value = '';
      filterStart.value = formatDateInput(firstDay);
      filterEnd.value = formatDateInput(today);
      loadInvoices();
    });

    // 초기 데이터
    aggregate();
    loadInvoices();

    console.log('✅ InvoiceManagement 페이지 초기화 완료');
  };

  // ========================================
  // 마감 상세 공용 모달
  // ========================================
  (function() {
    var modal = document.getElementById('settlement-detail-modal');
    var closeBtn = document.getElementById('settlement-detail-close');
    var tbody = document.getElementById('settlement-detail-tbody');
    var isBound = false;

    function bindModalEvents() {
      if (isBound || !modal) return;
      if (closeBtn) {
        closeBtn.addEventListener('click', hideModal);
      }
      modal.addEventListener('click', function(e) {
        if (e.target === modal) hideModal();
      });
      isBound = true;
    }

    function hideModal() {
      if (modal) {
        modal.classList.remove('active');
      }
    }

    function renderDetail(data) {
      var settlement = data.settlement || {};
      var items = data.items || [];
      var isSales = settlement.type === 'SALES';

      document.getElementById('settlement-detail-id').textContent = settlement.settlementId || '-';
      document.getElementById('settlement-detail-type').textContent = isSales ? '매출 마감' : '매입 마감';
      document.getElementById('settlement-detail-partner').textContent = settlement.partner || settlement.company || '-';
      document.getElementById('settlement-detail-period').textContent = (settlement.startDate || '-') + ' ~ ' + (settlement.endDate || '-');
      document.getElementById('settlement-detail-status').textContent = settlement.status || 'DRAFT';
      document.getElementById('settlement-detail-items').textContent = OB.formatNumber(settlement.totalItems || 0);
      document.getElementById('settlement-detail-order-qty').textContent = OB.formatNumber(settlement.totalOrderQty || 0);
      document.getElementById('settlement-detail-confirmed-qty').textContent = OB.formatNumber(settlement.totalConfirmedQty || 0);
      document.getElementById('settlement-detail-amount').textContent = '₩' + OB.formatNumber(settlement.totalAmount || 0);

      document.getElementById('settlement-detail-title').textContent = (isSales ? '매출' : '매입') + ' 마감 상세';
      document.getElementById('settlement-detail-price-label').textContent = isSales ? '매출가' : '매입가';
      document.getElementById('settlement-detail-amount-label').textContent = isSales ? '매출액' : '매입액';

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="settlement-detail-empty">마감 상세 데이터가 없습니다.</td></tr>';
      } else {
        var rows = items.map(function(item) {
          var diffQty = (item.orderQty || 0) - (item.confirmedQty || 0);
          var unitPrice = isSales ? (item.supplyPrice || 0) : (item.buyPrice || 0);
          var amount = isSales ? (item.supplyAmount || 0) : (item.purchaseAmount || 0);
          var counterParty = isSales ? (item.supplier || '') : (item.buyer || '');

          return '<tr>' +
            '<td>' + (item.orderCode || '') + '</td>' +
            '<td>' + (item.orderDate || '') + '</td>' +
            '<td>' + counterParty + '</td>' +
            '<td>' + (item.brand || '') + '</td>' +
            '<td>' + (item.productName || '') + '</td>' +
            '<td>' + (item.productCode || '') + '</td>' +
            '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
            '<td class="num">' + OB.formatNumber(item.confirmedQty || 0) + '</td>' +
            '<td class="num">' + OB.formatNumber(diffQty) + '</td>' +
            '<td class="num">₩' + OB.formatNumber(unitPrice) + '</td>' +
            '<td class="num">₩' + OB.formatNumber(amount) + '</td>' +
          '</tr>';
        }).join('');

        tbody.innerHTML = rows;
      }

      if (modal) {
        modal.classList.add('active');
      }
    }

    OB.viewSettlementDetail = function(settlementId, type) {
      if (!modal) {
        alert('상세 모달을 찾을 수 없습니다.');
        return;
      }

      if (!settlementId) {
        alert('마감ID가 필요합니다.');
        return;
      }

      bindModalEvents();
      OB.showLoading('마감 상세 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          console.log('[DEBUG] Settlement detail result:', result);

          if (!result || !result.success) {
            alert('마감 상세 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          renderDetail(result);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('[ERROR] Settlement detail failed:', error);
          alert('마감 상세 조회 실패: ' + error.message);
        })
        .getSettlementDetailApi({ settlementId: settlementId, type: type });
    };
  })();

  /**
   * 입출금 내역 추가
   */
  function handleAddPayment() {
    var date = document.getElementById('payment-date').value;
    var type = document.getElementById('payment-type').value;
    var company = document.getElementById('payment-company').value.trim();
    var amount = parseFloat(document.getElementById('payment-amount').value);
    var method = document.getElementById('payment-method').value;
    var docNumber = document.getElementById('payment-docnum').value.trim();
    var orderNumber = document.getElementById('payment-ordernum').value.trim();
    var notes = document.getElementById('payment-notes').value.trim();

    // 유효성 검사
    if (!date) {
      alert('결제일을 입력하세요.');
      return;
    }
    if (!type) {
      alert('결제유형을 선택하세요.');
      return;
    }
    if (!company) {
      alert('거래처명을 입력하세요.');
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      alert('금액을 올바르게 입력하세요.');
      return;
    }
    if (!method) {
      alert('결제수단을 선택하세요.');
      return;
    }

    var params = {
      date: date,
      type: type,
      company: company,
      amount: amount,
      method: method,
      docNumber: docNumber || '',
      orderNumber: orderNumber || '',
      notes: notes || ''
    };

    OB.showLoading('입출금 내역 추가 중...');

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('입출금 내역 추가 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('입출금 내역이 추가되었습니다.\n결제ID: ' + result.paymentId);
        resetPaymentForm();
        loadPaymentList();
        loadPaymentSummary();
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Add payment failed:', error);
        alert('입출금 내역 추가 실패: ' + error.message);
      })
      .addPaymentRecordApi(params);
  }

        '<td>' + (payment.createdAt || '') + '</td>' +

  /**
   * 문서번호 자동완성
   */
  function handleDocNumAutocomplete() {
    var input = document.getElementById('payment-docnum');
    var dropdown = document.getElementById('payment-docnum-dropdown');
    var query = input.value.trim();

    if (query.length < 3) {
      dropdown.style.display = 'none';
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          dropdown.style.display = 'none';
          return;
        }

        var suggestions = result.suggestions || [];

        if (suggestions.length === 0) {
          dropdown.style.display = 'none';
          return;
        }

        var html = suggestions.map(function(item) {
          return '<div class="autocomplete-item" onclick="selectDocNum(\'' + item.invoiceId + '\')">' +

  /**

   */
  function handleAddExpense() {
    var date = document.getElementById('expense-date').value;
    var category = document.getElementById('expense-category').value;
    var amount = parseFloat(document.getElementById('expense-amount').value);
    var method = document.getElementById('expense-method').value;
    var notes = document.getElementById('expense-notes').value.trim();

    // 유효성 검사
    if (!date) {
      alert('비용일을 입력하세요.');
      return;
    }
    if (!category) {
      alert('비용항목을 선택하세요.');
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      alert('금액을 올바르게 입력하세요.');
      return;
    }
    if (!method) {
      alert('결제수단을 선택하세요.');
      return;
    }

    var params = {
      date: date,
      category: category,
      amount: amount,
      method: method,
      notes: notes || ''
    };

    OB.showLoading('회사비용 추가 중...');

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('회사비용 추가 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('회사비용이 추가되었습니다.\n비용ID: ' + result.expenseId);
        resetExpenseForm();
        loadExpenseList();
        loadExpenseSummary();

      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Add expense failed:', error);
        alert('회사비용 추가 실패: ' + error.message);
      })
      .addExpenseRecordApi(params);

  /**

    var tbody = document.getElementById('expense-list-tbody');

    if (!expenses || expenses.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="payment-empty">조회된 회사비용 내역이 없습니다.</td></tr>';
      return;
    }

    var rows = expenses.map(function(expense) {
      var isDeleted = expense.deleted === true || expense.deleted === 'TRUE';

      var actionButtons = '';
      if (!isDeleted) {
        actionButtons =
          '<button class="payment-btn payment-btn-small warning" onclick="editExpense(\'' + expense.expenseId + '\')">수정</button>' +
          '<button class="payment-btn payment-btn-small danger" onclick="deleteExpense(\'' + expense.expenseId + '\')">삭제</button>';
      } else {
        actionButtons = '<span style="color:#9ca3af; font-size:11px;">삭제됨</span>';
      }

      var categoryStyle = isDeleted ? 'deleted' : '';

      return '<tr>' +
        '<td>' + (expense.expenseId || '') + '</td>' +
        '<td>' + (expense.date || '') + '</td>' +
        '<td><span class="payment-badge ' + categoryStyle + '">' + (expense.category || '') + '</span></td>' +
        '<td class="num">₩' + OB.formatNumber(expense.amount || 0) + '</td>' +
        '<td>' + (expense.method || '') + '</td>' +
        '<td>' + (expense.notes || '-') + '</td>' +
        '<td>' + (expense.createdAt || '') + '</td>' +
        '<td class="actions">' + actionButtons + '</td>' +
      '</tr>';
    }).join('');

    tbody.innerHTML = rows;
  }

  /**
   * 거래 상세 정보 보기 (문서 정보 포함)
   */
  function viewTransactionDetail(orderCode) {
    if (!orderCode) {
      alert('발주번호가 필요합니다.');
      return;
    }

    OB.showLoading('거래 상세 조회 중...');

    // 거래 정보 조회
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          OB.hideLoading();
          alert('거래 정보 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        // 거래 정보 표시
        var transactions = result.transactions || [];
        if (transactions.length === 0) {
          OB.hideLoading();
          alert('거래 정보를 찾을 수 없습니다.');
          return;
        }

        // 첫 번째 거래 정보로 표시 (같은 발주번호는 동일한 기본 정보를 가짐)
        var tx = transactions[0];

        document.getElementById('detail-order-date').textContent = tx.orderDate || '-';
        document.getElementById('detail-order-code').textContent = tx.orderCode || '-';
        document.getElementById('detail-buyer').textContent = tx.buyer || '-';
        document.getElementById('detail-brand').textContent = tx.brand || '-';

        // 수량과 금액 합계 계산
        var totalOrderQty = 0;
        var totalConfirmedQty = 0;
        var totalPurchaseAmount = 0;
        var totalSupplyAmount = 0;

        transactions.forEach(function(t) {
          totalOrderQty += parseFloat(t.orderQty || 0);
          totalConfirmedQty += parseFloat(t.confirmedQty || 0);
          totalPurchaseAmount += parseFloat(t.purchaseAmount || 0);
          totalSupplyAmount += parseFloat(t.supplyAmount || 0);
        });

        document.getElementById('detail-order-qty').textContent = OB.formatNumber(totalOrderQty);
        document.getElementById('detail-confirmed-qty').textContent = OB.formatNumber(totalConfirmedQty);
        document.getElementById('detail-purchase-amount').textContent = '₩' + OB.formatNumber(totalPurchaseAmount);
        document.getElementById('detail-supply-amount').textContent = '₩' + OB.formatNumber(totalSupplyAmount);

        // 모달 표시
        document.getElementById('ledger-detail-modal').classList.add('active');

        // 관련 결제 내역 로드
        loadDocumentPayments(orderCode);
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Load transaction detail failed:', error);
        alert('거래 정보 조회 실패: ' + error.message);
      })
      .getTransactionsApi({ orderCode: orderCode });
  }

  /**

    var invoiceId = document.getElementById('cancel-invoice-id').value;
    var notes = document.getElementById('cancel-notes').value.trim();

    if (!invoiceId) {
      alert('청구서 ID가 필요합니다.');
      return;
    }

    if (!confirm('정말로 이 청구서를 취소하고 재발급하시겠습니까?\n\n원본: ' + invoiceId + '\n\n이 작업은 되돌릴 수 없습니다.')) {

    }

    OB.showLoading('청구서 취소 및 재발급 중...');

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('청구서 취소/재발급 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('청구서가 취소되고 재발급되었습니다.\n\n원본 청구서: ' + result.oldInvoiceId + '\n새 청구서: ' + result.newInvoiceId);

        // 모달 닫기
        document.getElementById('invoice-cancel-modal').classList.remove('active');

        if (typeof loadInvoiceList === 'function') {

      })
      .cancelAndReissueInvoiceApi({
        invoiceId: invoiceId,
        notes: notes
      });
