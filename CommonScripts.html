  /**
   * 청구서 검색 UI
   */
  function searchInvoicesUI() {
    var query = document.getElementById('invoice-search-input').value.trim();

    if (query.length < 3) {
      alert('검색어를 3자 이상 입력해주세요.');
      return;
    }

    var resultsDiv = document.getElementById('invoice-search-results');
    resultsDiv.innerHTML = '<p class="payment-loading-msg">검색 중...</p>';

    var params = {
      query: query,
      paymentType: PAYMENT_MODAL_STATE.paymentType
    };

    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          renderInvoiceSearchResults(result.invoices);
        } else {
          resultsDiv.innerHTML = '<p class="payment-error-msg">❌ ' + result.error + '</p>';
        }
      })
      .withFailureHandler(function(error) {
        resultsDiv.innerHTML = '<p class="payment-error-msg">❌ 검색 중 오류 발생: ' + error.message + '</p>';
      })
      .searchInvoicesApi(params);
  }

  /**
   * 청구서 검색 결과 렌더링
   */
  function renderInvoiceSearchResults(invoices) {
    var resultsDiv = document.getElementById('invoice-search-results');

    if (!invoices || invoices.length === 0) {
      resultsDiv.innerHTML = '<p class="payment-empty-msg">검색 결과가 없습니다.</p>';
      return;
    }

    var companyLabel = PAYMENT_MODAL_STATE.paymentType === '입금' ? '고객사' : '공급사';

    // 선택 요약 영역
    var html = '<div class="invoice-selection-summary" id="invoice-selection-summary" style="display:none;">' +
      '<div style="font-weight:600;color:#1e40af;">선택된 청구서: <span id="selected-invoice-count">0</span>건</div>' +
      '<div style="font-weight:600;color:#059669;">총 청구금액: ₩<span id="selected-invoice-total">0</span></div>' +
    '</div>';

    html += '<div class="invoice-list">';

    invoices.forEach(function(invoice) {
      var statusClass = invoice.status === 'ISSUED' ? 'status-issued' :
                        invoice.status === 'DRAFT' ? 'status-draft' :
                        invoice.status === 'PAID_PARTIAL' ? 'status-partial' :
                        invoice.status === 'PAID' ? 'status-paid' : '';

      var isSelected = PAYMENT_MODAL_STATE.selectedInvoices.indexOf(invoice.invoiceId) !== -1;

      // 부분결제 정보 표시
      var amountDisplay = '';
      if (invoice.status === 'PAID_PARTIAL') {
        amountDisplay =
          '<div style="color:#dc2626;font-weight:600;">🔸 부분결제</div>' +
          '<div>청구금액: ₩' + Number(invoice.amount).toLocaleString() + '</div>' +
          '<div>기결제액: ₩' + Number(invoice.paidAmount || 0).toLocaleString() + '</div>' +
          '<div style="color:#2563eb;font-weight:700;">미수금: ₩' + Number(invoice.remainingBalance || invoice.amount).toLocaleString() + '</div>';
      } else {
        amountDisplay = '<div>금액: <strong>₩' + Number(invoice.amount).toLocaleString() + '</strong></div>';
      }

      // 전체 청구서 데이터를 JSON으로 인코딩하여 data 속성에 저장
      var invoiceDataJson = JSON.stringify(invoice).replace(/"/g, '&quot;');

      html +=
        '<div class="invoice-item ' + (isSelected ? 'selected' : '') + '" data-invoice-id="' + invoice.invoiceId + '" data-invoice="' + invoiceDataJson + '">' +
          '<div style="display:flex;align-items:center;gap:12px;">' +
            '<input type="checkbox" class="invoice-checkbox" ' + (isSelected ? 'checked' : '') + ' onchange="toggleInvoiceSelectionFull(this)" />' +
            '<div style="flex:1;">' +
              '<div class="invoice-item-header">' +
                '<span class="invoice-id">' + invoice.invoiceId + '</span>' +
                '<span class="invoice-status ' + statusClass + '">' + invoice.status + '</span>' +
              '</div>' +
              '<div class="invoice-item-body">' +
                '<div>' + companyLabel + ': <strong>' + invoice.company + '</strong></div>' +
                '<div>브랜드: ' + (invoice.brands || '없음') + '</div>' +
                '<div>청구일: ' + invoice.date + ' | 발주: ' + invoice.orderCount + '건</div>' +
                amountDisplay +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    });

    html += '</div>';

    resultsDiv.innerHTML = html;

    // 선택 요약 업데이트
    updateInvoiceSelectionSummary();

    // "다음 단계" 버튼 활성화/비활성화
    updateNextStepButton();
  }

  /**
   * 청구서 선택/해제 토글 (전체 데이터 저장)
   */
  function toggleInvoiceSelectionFull(checkbox) {
    var item = checkbox.closest('.invoice-item');
    var invoiceId = item.getAttribute('data-invoice-id');
    var invoiceDataJson = item.getAttribute('data-invoice');
    var invoiceData = JSON.parse(invoiceDataJson.replace(/&quot;/g, '"'));

    var idx = PAYMENT_MODAL_STATE.selectedInvoices.indexOf(invoiceId);

    if (checkbox.checked && idx === -1) {
      // 선택
      PAYMENT_MODAL_STATE.selectedInvoices.push(invoiceId);
      PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId] = invoiceData;
      item.classList.add('selected');
    } else if (!checkbox.checked && idx !== -1) {
      // 해제
      PAYMENT_MODAL_STATE.selectedInvoices.splice(idx, 1);
      delete PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId];
      item.classList.remove('selected');
    }

    updateInvoiceSelectionSummary();
    updateNextStepButton();
  }

  /**
   * 청구서 선택/해제 토글 (레거시 - 하위 호환)
   */
  function toggleInvoiceSelection(invoiceId, amount) {
    var idx = PAYMENT_MODAL_STATE.selectedInvoices.indexOf(invoiceId);

    if (idx === -1) {
      // 선택
      PAYMENT_MODAL_STATE.selectedInvoices.push(invoiceId);
      PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId] = { amount: amount };
    } else {
      // 해제
      PAYMENT_MODAL_STATE.selectedInvoices.splice(idx, 1);
      delete PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId];
    }

    // 선택 상태 UI 업데이트
    var items = document.querySelectorAll('.invoice-item');
    items.forEach(function(item) {
      var id = item.getAttribute('data-invoice-id');
      var checkbox = item.querySelector('.invoice-checkbox');

      if (id === invoiceId) {
        if (checkbox.checked) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      }
    });

    updateInvoiceSelectionSummary();
    updateNextStepButton();
  }

  /**
   * 선택 요약 업데이트 (미수금 기준)
   */
  function updateInvoiceSelectionSummary() {
    var summaryDiv = document.getElementById('invoice-selection-summary');
    var countSpan = document.getElementById('selected-invoice-count');
    var totalSpan = document.getElementById('selected-invoice-total');

    if (!summaryDiv || !countSpan || !totalSpan) return;

    var count = PAYMENT_MODAL_STATE.selectedInvoices.length;
    var totalRemaining = 0;

    PAYMENT_MODAL_STATE.selectedInvoices.forEach(function(invoiceId) {
      var data = PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId];
      if (data) {
        // 미수금 우선, 없으면 원래 금액
        totalRemaining += data.remainingBalance || data.amount || 0;
      }
    });

    countSpan.textContent = count;
    totalSpan.textContent = totalRemaining.toLocaleString();

    if (count > 0) {
      summaryDiv.style.display = 'block';
    } else {
      summaryDiv.style.display = 'none';
    }
  }

  /**
   * "다음 단계" 버튼 활성화/비활성화
   */
  function updateNextStepButton() {
    var nextBtn = document.getElementById('invoice-next-step-btn');
    if (!nextBtn) return;

    if (PAYMENT_MODAL_STATE.selectedInvoices.length > 0) {
      nextBtn.disabled = false;
    } else {
      nextBtn.disabled = true;
    }
  }

  /**
   * 다중 청구서 선택 후 다음 단계로
   */
  function proceedWithSelectedInvoices() {
    if (PAYMENT_MODAL_STATE.selectedInvoices.length === 0) {
      alert('청구서를 1개 이상 선택해주세요.');
      return;
    }

    // SPEC_01: Step 2에서 저장한 완전한 청구서 데이터 사용 (API 재호출 불필요)
    var invoiceDetails = [];
    PAYMENT_MODAL_STATE.selectedInvoices.forEach(function(invoiceId) {
      var invoiceData = PAYMENT_MODAL_STATE.selectedInvoicesData[invoiceId];
      if (invoiceData) {
        invoiceDetails.push(invoiceData);
      }
    });

    if (invoiceDetails.length === 0) {
      alert('❌ 청구서 데이터를 불러올 수 없습니다.');
      return;
    }

    PAYMENT_MODAL_STATE.invoiceDetailsMultiple = invoiceDetails;

  /**
   * 다중 청구서 금액 검증 (부분결제 지원)
   */
  function validatePaymentAmountMultiple() {
    var invoices = PAYMENT_MODAL_STATE.invoiceDetailsMultiple;
    var inputAmount = Number(document.getElementById('final-payment-amount-multi').value) || 0;

    // 총 미수금 계산 (부분결제 지원)
    var totalRemainingAmount = 0;
    invoices.forEach(function(invoice) {
      var remainingBalance = Number(invoice.remainingBalance);
      if (isNaN(remainingBalance) || remainingBalance === 0) {
        // remainingBalance가 없거나 0이면 원래 금액 사용 (하위 호환성)
        remainingBalance = Number(invoice.amount) || 0;
      }
      totalRemainingAmount += remainingBalance;
    });

    var resultDiv = document.getElementById('amount-validation-result-multi');
    var saveBtn = document.getElementById('final-save-btn-multi');

    // 금액이 0 이하인 경우
    if (inputAmount <= 0) {
      resultDiv.innerHTML =
        '<div class="amount-validation error">' +
          '<div class="validation-icon">❌</div>' +
          '<div class="validation-details">' +
            '<div class="validation-title">결제금액을 입력해주세요.</div>' +
          '</div>' +
        '</div>';
      saveBtn.disabled = true;
      saveBtn.classList.add('disabled');
      return;
    }

    // 금액이 총 미수금을 초과하는 경우
    if (inputAmount > totalRemainingAmount) {
      var diff = inputAmount - totalRemainingAmount;
      resultDiv.innerHTML =
        '<div class="amount-validation error">' +
          '<div class="validation-icon">❌</div>' +
          '<div class="validation-details">' +
            '<div class="validation-title">결제금액이 총 미수금을 초과합니다.</div>' +
            '<div class="validation-row">총 미수금: ₩' + totalRemainingAmount.toLocaleString() + ' (' + invoices.length + '건)</div>' +
            '<div class="validation-row">결제금액: ₩' + inputAmount.toLocaleString() + '</div>' +
            '<div class="validation-row">초과 금액: ₩' + diff.toLocaleString() + '</div>' +
            '<div class="validation-message">💡 결제금액은 총 미수금을 초과할 수 없습니다.</div>' +
          '</div>' +
        '</div>';
      saveBtn.disabled = true;
      saveBtn.classList.add('disabled');
      return;
    }

    // 금액이 정확히 일치하는 경우 (완납)
    if (inputAmount === totalRemainingAmount) {
      resultDiv.innerHTML =
        '<div class="amount-validation success">' +
          '<div class="validation-icon">✅</div>' +
          '<div class="validation-details">' +
            '<div class="validation-title">완납 처리됩니다.</div>' +
            '<div class="validation-row">총 미수금: ₩' + totalRemainingAmount.toLocaleString() + ' (' + invoices.length + '건)</div>' +

  /**
   * 다중 청구서 결제 저장
   */
  function saveMultiplePaymentFromModal() {
    var invoices = PAYMENT_MODAL_STATE.invoiceDetailsMultiple;
    var type = PAYMENT_MODAL_STATE.paymentType;

    var date = document.getElementById('final-payment-date-multi').value;
    var amount = Number(document.getElementById('final-payment-amount-multi').value);
    var method = document.getElementById('final-payment-method-multi').value;
    var notes = document.getElementById('final-payment-notes-multi').value.trim();

    // 유효성 검사
    if (!date) {
      alert('결제일을 입력해주세요.');
      return;
    }

    if (!amount || amount <= 0) {
      alert('올바른 금액을 입력해주세요.');
      return;
    }

    // 총 미수금 계산 (부분결제 지원)
    var totalRemainingAmount = 0;
    invoices.forEach(function(invoice) {
      var remainingBalance = Number(invoice.remainingBalance);
      if (isNaN(remainingBalance) || remainingBalance === 0) {
        // remainingBalance가 없거나 0이면 원래 금액 사용 (하위 호환성)
        remainingBalance = Number(invoice.amount) || 0;
      }
      totalRemainingAmount += remainingBalance;
    });

    // 금액 검증 (부분결제 허용)
    if (amount > totalRemainingAmount) {
      alert('❌ 결제금액이 총 미수금을 초과합니다.\n' +
            '총 미수금: ₩' + totalRemainingAmount.toLocaleString() + '\n' +
            '입력 금액: ₩' + amount.toLocaleString());
      return;
    }

    // 청구서 ID 배열 생성
    var invoiceIds = [];
    var companies = {};
    invoices.forEach(function(invoice) {
      invoiceIds.push(invoice.invoiceId);
      companies[invoice.company] = true;
    });

    var companyDisplay = Object.keys(companies).join(', ');
    if (Object.keys(companies).length > 3) {
      companyDisplay = Object.keys(companies).slice(0, 3).join(', ') + ' 외 ' + (Object.keys(companies).length - 3) + '곳';
    }

    var params = {
      date: date,
      type: type,
      company: companyDisplay,  // 여러 업체명 표시용
      amount: amount,
      method: method,
      docNumbers: invoiceIds,  // 청구서 ID 배열
      notes: notes
    };

    // 로딩 표시
    var saveBtn = document.getElementById('final-save-btn-multi');
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중...';

    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          alert('✅ 결제가 정상적으로 저장되었습니다!\n\n' + invoices.length + '건의 청구서가 처리되었습니다.');
          closePaymentModal();
          // 결제내역 목록 새로고침
          if (typeof loadPaymentRecords === 'function') {
            loadPaymentRecords();
          }
        } else {
          alert('❌ 결제 저장 실패:\n' + result.error);
          saveBtn.disabled = false;
          saveBtn.textContent = '💾 저장';
        }
      })
      .withFailureHandler(function(error) {
        alert('❌ 서버 오류:\n' + error.message);
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 저장';
      })
      .saveMultiplePaymentApi(params);
  }

  }

  /**
   * 대시보드 위젯 업데이트
   */
  function updateDashboardWidgets(data) {
    // ============================================================
    // 1. KPI 카드
    // ============================================================
    var kpi = data.kpi || {};

    setText('kpi-today-amount', '₩' + formatNumber(kpi.todayAmount || 0));
    setText('kpi-month-amount', '₩' + formatNumber(kpi.monthAmount || 0));
    setText('kpi-receivables', '₩' + formatNumber(kpi.receivables || 0));
    setText('kpi-receivable-count', (kpi.receivableCount || 0) + '건 미결제');
    setText('kpi-payables', '₩' + formatNumber(kpi.payables || 0));
    setText('kpi-payable-count', (kpi.payableCount || 0) + '건 미결제');

    // ============================================================
    // 2. 발주 진행 현황
    // ============================================================
    var progress = data.orderProgress || {};

    setText('total-orders-badge', (progress.totalOrders || 0) + '건');

    // 매입발주
    var buyOrder = progress.buyOrder || {};
    setText('buyorder-done', buyOrder.done || 0);
    setText('buyorder-pending', buyOrder.pending || 0);
    setText('buyorder-rate', buyOrder.rate || 0);
    setStyle('buyorder-progress-bar', 'width', (buyOrder.rate || 0) + '%');
    setProgressBarColor('buyorder-progress-bar', buyOrder.rate || 0);

    // 출고
    var ship = progress.ship || {};
    setText('ship-done', ship.done || 0);
    setText('ship-pending', ship.pending || 0);
    setText('ship-rate', ship.rate || 0);
    setStyle('ship-progress-bar', 'width', (ship.rate || 0) + '%');
    setProgressBarColor('ship-progress-bar', ship.rate || 0);

    // 미처리 목록
    renderPendingList('pending-buyorders', progress.pendingBuyOrders || [], 'buyorder');
    renderPendingList('pending-shipments', progress.pendingShipments || [], 'ship');

    // ============================================================
    // 3. 청구서 현황
    // ============================================================
    var billingStats = data.billingStats || {};
    renderBillingStatus('billing-sales-status', billingStats.SALES || {});
    renderBillingStatus('billing-purchase-status', billingStats.PURCHASE || {});

    // ============================================================
    // 4. 브랜드 Top 5
    // ============================================================
    renderBrandTop5(data.brandTop5 || []);

    // ============================================================
    // 5. 월마감 현황
    // ============================================================
    renderMonthlyClosings(data.monthlyClosings || []);

    // ============================================================
    // 6. 거래처별 미결제
    // ============================================================
    renderCompanyList('receivables-by-company', data.receivablesTop5 || [], 'receivable');
    renderCompanyList('payables-by-company', data.payablesTop5 || [], 'payable');

    setText('receivables-total', '₩' + formatNumber(kpi.receivables || 0) + ' (' + (kpi.receivableCount || 0) + '건)');
    setText('payables-total', '₩' + formatNumber(kpi.payables || 0) + ' (' + (kpi.payableCount || 0) + '건)');

    console.log('✅ 대시보드 위젯 업데이트 완료');
  }

  // 헬퍼 함수들
  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function setStyle(id, prop, value) {
    var el = document.getElementById(id);
    if (el) el.style[prop] = value;
  }

  function setProgressBarColor(id, rate) {
    var el = document.getElementById(id);
    if (el) {
      el.classList.remove('warning', 'danger');
      if (rate < 50) {
        el.classList.add('danger');
      } else if (rate < 80) {
        el.classList.add('warning');
      }
    }
  }

  function renderPendingList(containerId, items, type) {
    var container = document.getElementById(containerId);
    if (!container) return;

    if (!items || items.length === 0) {
      container.innerHTML = '<div class="dashboard-empty">미처리 항목이 없습니다</div>';
      return;
    }

    var html = '';
    items.forEach(function(item) {
      html += '<div class="pending-item">' +
        '<span class="code">' + (item.orderCode || '-') + '</span>' +
        '<span class="info">' + (item.buyer || '-') + '</span>' +
        (type === 'buyorder' ? '<span class="amount">₩' + formatNumber(item.amount || 0) + '</span>' : '<span class="info">' + (item.orderDate || '-') + '</span>') +
        '</div>';
    });
    container.innerHTML = html;
  }

  function renderBillingStatus(containerId, stats) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var statusConfig = [
      { key: 'PENDING', icon: '⏳', label: '발행대기' },
      { key: 'ISSUED', icon: '📄', label: '발행완료' },
      { key: 'REQUESTED', icon: '📄', label: '지급요청' },
      { key: 'PAID_PARTIAL', icon: '⚠️', label: '부분결제' },
      { key: 'PAID', icon: '✅', label: '결제완료' },
      { key: 'LOCKED', icon: '🔒', label: '마감완료' }
    ];

    var hasData = false;
    var html = '';

    statusConfig.forEach(function(cfg) {
      var stat = stats[cfg.key];
      if (stat && stat.count > 0) {
        hasData = true;
        html += '<div class="billing-status-item">' +
          '<span class="billing-status-icon">' + cfg.icon + '</span>' +
          '<span class="billing-status-label">' + cfg.label + '</span>' +
          '<span class="billing-status-value">' + stat.count + '건</span>' +
          '</div>';
      }
    });

    if (!hasData) {
      html = '<div class="dashboard-empty">데이터가 없습니다</div>';
    }

    container.innerHTML = html;
  }

  function renderBrandTop5(brands) {
    var tbody = document.getElementById('brand-top5-tbody');
    if (!tbody) return;

    if (!brands || brands.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="dashboard-empty">데이터가 없습니다</td></tr>';
      return;
    }

    var html = '';
    brands.forEach(function(item) {
      html += '<tr>' +
        '<td class="rank">' + item.rank + '</td>' +
        '<td>' + item.brand + '</td>' +
        '<td class="num">₩' + formatNumber(item.amount) + '</td>' +
        '<td class="num">' + item.percent + '%</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderMonthlyClosings(closings) {
    var container = document.getElementById('monthly-closings');
    if (!container) return;

    if (!closings || closings.length === 0) {
      container.innerHTML = '<div class="dashboard-empty">월마감 데이터가 없습니다</div>';
      return;
    }

    var html = '';
    closings.forEach(function(item) {
      var statusClass = item.status === 'LOCKED' ? 'locked' : 'open';
      var statusText = item.status === 'LOCKED' ? '마감완료' : '진행중';

      html += '<div class="closing-item">' +
        '<span class="closing-month">' + (item.yearMonth || item.월) + '</span>' +
        '<span class="closing-status ' + statusClass + '">' + statusText + '</span>' +
        '<span class="closing-amount">₩' + formatNumber(item.totalAmount || item.금액 || 0) + '</span>' +
        '</div>';
    });
    container.innerHTML = html;
  }

  function renderCompanyList(containerId, companies, type) {
    var container = document.getElementById(containerId);
    if (!container) return;

    if (!companies || companies.length === 0) {
      container.innerHTML = '<div class="dashboard-empty">미결제 내역이 없습니다</div>';
      return;
    }

    var html = '';
    companies.forEach(function(item) {
      html += '<div class="company-item">' +
        '<span class="name">' + item.company + '</span>' +
        '<span class="amount ' + type + '">₩' + formatNumber(item.amount) + '</span>' +
        '<span class="count">' + item.count + '건</span>' +
        '</div>';
    });
    container.innerHTML = html;
  }

  /**
   * 대시보드 오류 표시
   */
  function showDashboardError() {
    console.warn('⚠️ 대시보드 데이터 로드 실패 - 기본값 표시');

    // KPI
    setText('kpi-today-amount', '₩0');
    setText('kpi-month-amount', '₩0');
    setText('kpi-receivables', '₩0');
    setText('kpi-receivable-count', '0건 미결제');
    setText('kpi-payables', '₩0');
    setText('kpi-payable-count', '0건 미결제');

    // 진행 현황
    setText('total-orders-badge', '0건');
    setText('buyorder-done', '0');
    setText('buyorder-pending', '0');
    setText('buyorder-rate', '0');
    setText('ship-done', '0');
    setText('ship-pending', '0');
    setText('ship-rate', '0');

    // 빈 목록
    var emptyHtml = '<div class="dashboard-empty">데이터를 불러올 수 없습니다</div>';
    var emptyContainers = [
      'pending-buyorders', 'pending-shipments',
      'billing-sales-status', 'billing-purchase-status',
      'monthly-closings', 'receivables-by-company', 'payables-by-company'
    ];
    emptyContainers.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = emptyHtml;
    });

    var brandTbody = document.getElementById('brand-top5-tbody');
    if (brandTbody) {
      brandTbody.innerHTML = '<tr><td colspan="4" class="dashboard-empty">데이터를 불러올 수 없습니다</td></tr>';
    }
  }

  /**
   * ============================================================
   * SPEC_05: 미수금 관리 페이지 초기화
   * ============================================================
   */
  OB.initReceivablePage = function() {
    console.log('🚀 미수금 관리 페이지 초기화 시작');

    var currentType = 'SALES'; // 현재 탭 (SALES=매출, PURCHASE=매입)

    // 탭 전환 이벤트
    var receivableTab = document.getElementById('receivable-tab-receivable');
    var payableTab = document.getElementById('receivable-tab-payable');

    if (receivableTab) {
      receivableTab.addEventListener('click', function() {
        currentType = 'SALES';
        document.querySelectorAll('.receivable-tab').forEach(function(tab) {
          tab.classList.remove('active');
        });
        this.classList.add('active');
        loadReceivableData();
      });
    }

    if (payableTab) {
      payableTab.addEventListener('click', function() {
        currentType = 'PURCHASE';
        document.querySelectorAll('.receivable-tab').forEach(function(tab) {
          tab.classList.remove('active');
        });
        this.classList.add('active');
        loadReceivableData();
      });
    }

    // 조회 버튼
    var searchBtn = document.getElementById('receivable-search-btn');
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        loadReceivableData();
      });
    }

    // 초기화 버튼
    var resetBtn = document.getElementById('receivable-reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        document.getElementById('receivable-company-filter').value = '';
        document.getElementById('receivable-start-date').value = '';
        document.getElementById('receivable-end-date').value = '';
      });
    }

    // 엑셀 다운로드 버튼
    var excelBtn = document.getElementById('receivable-excel-btn');
    if (excelBtn) {
      excelBtn.addEventListener('click', function() {
        // TODO: 엑셀 다운로드 로직 구현
        showToast('📥 엑셀 다운로드 기능은 추후 구현됩니다.');
      });
    }

    /**
     * 미수금 데이터 로드
     */
    function loadReceivableData() {
      var companyName = document.getElementById('receivable-company-filter').value;
      var startDate = document.getElementById('receivable-start-date').value;
      var endDate = document.getElementById('receivable-end-date').value;

      // 요약 데이터 로드
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            var data = result.data;
            document.getElementById('summary-total').textContent = '₩' + data.총미수금.toLocaleString();
            document.getElementById('summary-normal').textContent = data.정상건수 + '건';
            document.getElementById('summary-overdue').textContent = data.연체건수 + '건';
          }
        })
        .withFailureHandler(function(error) {
          console.error('❌ 요약 데이터 로드 실패:', error);
        })
        .api_getReceivableSummary({ type: currentType });

      // 에이징 리포트 로드
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            var aging = result.data;
            document.getElementById('summary-aging').textContent = '₩' + aging['90일 초과'].금액.toLocaleString();
          }
        })
        .withFailureHandler(function(error) {
          console.error('❌ 에이징 리포트 로드 실패:', error);
        })
        .api_getAgingReport({ type: currentType });

      // 거래처별 데이터 로드
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            renderReceivableTable(result.data);
          } else {
            showToast('❌ ' + (result.error || '조회 실패'));
          }
        })
        .withFailureHandler(function(error) {
          showToast('❌ 오류: ' + error.message);
        })
        .api_getReceivableByCompany({
          type: currentType,
          companyName: companyName,
          startDate: startDate,
          endDate: endDate
        });
    }

    /**
     * 거래처별 테이블 렌더링
     */
    function renderReceivableTable(companies) {
      var tbody = document.getElementById('receivable-tbody');
      tbody.innerHTML = '';

      if (companies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:60px 20px;color:#64748b;">조회된 데이터가 없습니다.</td></tr>';
        return;
      }

      for (var i = 0; i < companies.length; i++) {
        var company = companies[i];

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + company.거래처명 + '</td>' +
          '<td class="num">₩' + company.총청구액.toLocaleString() + '</td>' +
          '<td class="num">₩' + company.결제완료금액.toLocaleString() + '</td>' +
          '<td class="num">₩' + company.미수금.toLocaleString() + '</td>' +
          '<td class="center">' + company.청구서수 + '건</td>' +
          '<td class="center">' + company.정상건수 + '건</td>' +
          '<td class="center">' +
            (company.연체건수 > 0 ? '<span class="overdue-badge">' + company.연체건수 + '건</span>' : '0건') +
          '</td>' +
          '<td>' + company.최종결제일 + '</td>' +
          '<td class="center">' +
            '<button class="receivable-btn small" onclick="toggleReceivableDetail(' + i + ')">펼치기</button>' +
          '</td>';

        tbody.appendChild(tr);

        // 상세 행 추가 (숨김 상태)
        var detailTr = document.createElement('tr');
        detailTr.id = 'receivable-detail-' + i;
        detailTr.className = 'receivable-detail-row';
        detailTr.style.display = 'none';

        var detailHtml = '<td colspan="9"><table class="receivable-detail-table">';
        detailHtml += '<thead><tr><th>청구ID</th><th>청구일</th><th class="num">청구금액</th><th class="num">결제완료</th><th class="num">미수금</th><th>결제예정일</th><th class="center">상태</th></tr></thead>';
        detailHtml += '<tbody>';

        for (var j = 0; j < company.청구서목록.length; j++) {
          var inv = company.청구서목록[j];
          detailHtml += '<tr>';
          detailHtml += '<td>' + inv.청구ID + '</td>';
          detailHtml += '<td>' + inv.청구일 + '</td>';
          detailHtml += '<td class="num">₩' + inv.청구금액.toLocaleString() + '</td>';
          detailHtml += '<td class="num">₩' + inv.결제완료금액.toLocaleString() + '</td>';
          detailHtml += '<td class="num">₩' + inv.미수금.toLocaleString() + '</td>';
          detailHtml += '<td>' + (inv.결제예정일 || '-') + '</td>';
          detailHtml += '<td class="center">';
          if (inv.연체여부) {
            detailHtml += '<span class="overdue-badge">연체</span>';
          } else {
            detailHtml += inv.청구상태;
          }
          detailHtml += '</td>';
          detailHtml += '</tr>';
        }

        detailHtml += '</tbody></table></td>';
        detailTr.innerHTML = detailHtml;

        tbody.appendChild(detailTr);
      }
    }

    // 페이지 로드 시 초기 데이터 로드
    loadReceivableData();

    console.log('✅ 미수금 관리 페이지 초기화 완료');
  };

  /**
   * 거래처 상세 펼치기/접기
   */
  window.toggleReceivableDetail = function(index) {
    var detailRow = document.getElementById('receivable-detail-' + index);
    if (detailRow) {
      if (detailRow.style.display === 'none') {
        detailRow.style.display = 'table-row';
      } else {
        detailRow.style.display = 'none';
      }
    }
  };

</script>
