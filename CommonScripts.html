    // ============================================================
    // 모달 닫기
    // ============================================================
    if (modalClose) {
      modalClose.addEventListener('click', function() {
        modal.classList.remove('show');
      });
    }

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });

    // ============================================================
    // 유틸리티 함수
    // ============================================================
    function formatNumber(num) {
      if (num === null || num === undefined || num === '') return '0';
      return Number(num).toLocaleString('ko-KR');
    }

    function formatDate(date) {
      if (!date) return '';
      if (typeof date === 'string') {
        if (date.match(/^\d{4}-\d{2}-\d{2}$/)) return date;
      }

      var d = new Date(date);
      if (isNaN(d.getTime())) return '';

      var year = d.getFullYear();
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');

      return year + '-' + month + '-' + day;
    }

    console.log('✅ OrderList 이벤트 바인딩 완료');
  };

  // ===========================================================
  // ✅ PurchaseSettlement 페이지 초기화 함수
  // ===========================================================
  OB.purchaseSettlementState = {
    currentData: null,
    supplier: '',
    startDate: '',
    endDate: ''
  };

  OB.initPurchaseSettlementPage = function() {
    console.log('🔧 PurchaseSettlement 페이지 초기화 시작');

    var state = OB.purchaseSettlementState;

    // DOM 요소
    var supplierInput = document.getElementById('purchase-settlement-supplier');
    var startDateInput = document.getElementById('purchase-settlement-start-date');
    var endDateInput = document.getElementById('purchase-settlement-end-date');
    var searchBtn = document.getElementById('purchase-settlement-search-btn');
    var resetBtn = document.getElementById('purchase-settlement-reset-btn');
    var tbody = document.getElementById('purchase-settlement-tbody');
    var summaryDiv = document.getElementById('purchase-settlement-summary');
    var actionsDiv = document.getElementById('purchase-settlement-actions');

    var saveDraftBtn = document.getElementById('purchase-settlement-save-draft-btn');
    var confirmBtn = document.getElementById('purchase-settlement-confirm-btn');
    var exportBtn = document.getElementById('purchase-settlement-export-btn');

    // 기본 날짜 설정 (이번 달)
    setDefaultDates();

    function setDefaultDates() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, '0');

      var firstDay = year + '-' + month + '-01';
      var lastDay = new Date(year, now.getMonth() + 1, 0);
      var lastDayStr = year + '-' + month + '-' + String(lastDay.getDate()).padStart(2, '0');

      startDateInput.value = firstDay;
      endDateInput.value = lastDayStr;
    }

    // 조회 버튼
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        var supplier = supplierInput.value.trim();
        var startDate = startDateInput.value;
        var endDate = endDateInput.value;

        if (!startDate || !endDate) {
          alert('마감 기간을 선택해주세요.');
          return;
        }

        state.supplier = supplier;
        state.startDate = startDate;
        state.endDate = endDate;

        console.log('📋 매입 마감 조회:', {supplier: supplier || '전체', startDate, endDate});

        OB.showLoading('매입 데이터 집계 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();
            console.log('✅ 집계 완료:', result);

            if (!result || !result.success) {
              alert('집계 실패: ' + (result ? result.error : '알 수 없는 오류'));
              renderEmpty();
              return;
            }

            state.currentData = result;
            renderSummary(result);
            renderTable(result.items || []);
            showActions();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 집계 실패:', error);
            alert('집계 실패: ' + error.message);
            renderEmpty();
          })
          .aggregatePurchaseOrdersApi({
            supplier: supplier,
            startDate: startDate,
            endDate: endDate
          });
      });
    }

    // 초기화 버튼
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        supplierInput.value = '';
        setDefaultDates();
        state.currentData = null;
        renderEmpty();
        hideActions();
        hideSummary();
      });
    }

    // 임시저장 버튼
    if (saveDraftBtn) {
      saveDraftBtn.addEventListener('click', function() {
        saveSettlement('DRAFT');
      });
    }

    // 확정 버튼
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        if (!confirm('마감을 확정하시겠습니까?\n확정 후에는 수정할 수 없습니다.')) {
          return;
        }
        saveSettlement('CONFIRMED');
      });
    }

    // 엑셀 다운로드 버튼
    if (exportBtn) {
      exportBtn.addEventListener('click', function() {
        downloadExcel();
      });
    }

    // 요약 렌더링
    function renderSummary(data) {
      document.getElementById('purchase-settlement-total-items').textContent =
        OB.formatNumber(data.totalItems || 0);
      document.getElementById('purchase-settlement-total-order-qty').textContent =
        OB.formatNumber(data.totalOrderQty || 0);
      document.getElementById('purchase-settlement-total-confirmed-qty').textContent =
        OB.formatNumber(data.totalConfirmedQty || 0);
      document.getElementById('purchase-settlement-diff-qty').textContent =
        OB.formatNumber(data.diffQty || 0);
      document.getElementById('purchase-settlement-total-amount').textContent =
        '₩' + OB.formatNumber(data.totalPurchaseAmount || 0);

      summaryDiv.style.display = 'grid';
    }

    function hideSummary() {
      summaryDiv.style.display = 'none';
    }

    // 테이블 렌더링
    function renderTable(items) {
      if (!items || items.length === 0) {
        renderEmpty();
        return;
      }

      tbody.innerHTML = '';

      items.forEach(function(item) {
        var tr = document.createElement('tr');

        var diffQty = item.diffQty || 0;
        var diffClass = diffQty !== 0 ? 'diff' : '';

        tr.innerHTML =
          '<td>' + (item.orderCode || '') + '</td>' +
          '<td>' + (item.orderDate || '') + '</td>' +
          '<td>' + (item.buyer || '') + '</td>' +
          '<td>' + (item.brand || '') + '</td>' +
          '<td>' + (item.productName || '') + '</td>' +
          '<td>' + (item.productCode || '') + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.confirmedQty || 0) + '</td>' +
          '<td class="num ' + diffClass + '">' + OB.formatNumber(diffQty) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(item.buyPrice || 0) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(item.purchaseAmount || 0) + '</td>';

        tbody.appendChild(tr);
      });
    }

    function renderEmpty() {
      tbody.innerHTML =
        '<tr><td colspan="11" class="settlement-empty">' +
        '<div class="settlement-empty-icon">📋</div>' +
        '<div class="settlement-empty-text">매입처와 기간을 선택하여 조회하세요</div>' +
        '</td></tr>';
    }

    function showActions() {
      actionsDiv.style.display = 'flex';
    }

    function hideActions() {
      actionsDiv.style.display = 'none';
    }

    // 마감 저장
    function saveSettlement(status) {
      if (!state.currentData || !state.currentData.items) {
        alert('집계된 데이터가 없습니다.');
        return;
      }

      var params = {
        supplier: state.supplier,
        startDate: state.startDate,
        endDate: state.endDate,
        status: status,
        items: state.currentData.items,
        notes: ''
      };

      OB.showLoading('마감 저장 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('저장 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          alert(result.message || '저장 완료');
          console.log('✅ 마감 저장 완료:', result.settlementId);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('❌ 저장 실패:', error);
          alert('저장 실패: ' + error.message);
        })
        .savePurchaseSettlementApi(params);
    }

    // 엑셀 다운로드
    function downloadExcel() {
      if (!state.currentData || !state.currentData.items) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }

      var csv = [];

      // 헤더
      csv.push([
        '발주번호', '발주일', '발주처', '브랜드', '제품명', '품목코드',
        '발주수량', '확정수량', '차이', '매입가', '매입액'
      ].join(','));

      // 데이터
      state.currentData.items.forEach(function(item) {
        var row = [
          item.orderCode || '',
          item.orderDate || '',
          item.buyer || '',
          item.brand || '',
          item.productName || '',
          item.productCode || '',
          item.orderQty || 0,
          item.confirmedQty || 0,
          item.diffQty || 0,
          item.buyPrice || 0,
          item.purchaseAmount || 0
        ];
        csv.push(row.join(','));
      });

      // BOM 추가
      var csvContent = '\uFEFF' + csv.join('\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);

      var fileName = '매입마감_' + state.supplier + '_' +
        state.startDate.replace(/-/g, '') + '-' +
        state.endDate.replace(/-/g, '') + '.csv';

      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      console.log('✅ 엑셀 다운로드 완료');
    }

    // ============================================================
    // 탭 전환 기능
    // ============================================================
    var tabs = document.querySelectorAll('.settlement-wrap .settlement-tab');
    var tabContents = {
      'new': document.getElementById('purchase-settlement-tab-new'),
      'history': document.getElementById('purchase-settlement-tab-history')
    };

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var targetTab = this.dataset.tab;

        // 탭 버튼 활성화 상태 변경
        tabs.forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');

        // 탭 내용 전환
        Object.keys(tabContents).forEach(function(key) {
          if (tabContents[key]) {
            tabContents[key].style.display = key === targetTab ? 'block' : 'none';
            tabContents[key].classList.toggle('active', key === targetTab);
          }
        });
      });
    });

  OB.initSalesSettlementPage = function() {

      var lastDay = new Date(year, now.getMonth() + 1, 0);

      if (!items || items.length === 0) {

      items.forEach(function(item) {

    // 마감 저장

      if (!state.currentData || !state.currentData.items) {

          alert('저장 실패: ' + error.message);
        })
        .saveSalesSettlementApi(params);
    }

    // 엑셀 다운로드
    function downloadExcel() {
      if (!state.currentData || !state.currentData.items) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }

      var csv = [];

      // 헤더
      csv.push([
        '발주번호', '발주일', '매입처', '브랜드', '제품명', '품목코드',
        '발주수량', '확정수량', '차이', '매출가', '매출액'
      ].join(','));

      // 데이터
      state.currentData.items.forEach(function(item) {
        var row = [
          item.orderCode || '',
          item.orderDate || '',
          item.supplier || '',
          item.brand || '',
          item.productName || '',
          item.productCode || '',
          item.orderQty || 0,
          item.confirmedQty || 0,
          item.diffQty || 0,
          item.supplyPrice || 0,
          item.supplyAmount || 0
        ];
        csv.push(row.join(','));
      });

      // BOM 추가
      var csvContent = '\uFEFF' + csv.join('\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);

      var fileName = '매출마감_' + state.buyer + '_' +
        state.startDate.replace(/-/g, '') + '-' +
        state.endDate.replace(/-/g, '') + '.csv';

      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      console.log('✅ 엑셀 다운로드 완료');
    }

  // 월별 마감 페이지 (V3 - 기간/거래처 조회)

  OB.monthlyClosingState = {
    startMonth: '',
    endMonth: '',
    company: '',
    currentStatus: null,
    billingsList: [],
    filteredList: []
  };

  OB.initMonthlyClosingPage = function() {
    console.log('🔧 MonthlyClosing 페이지 초기화 시작 (V3 - 기간/거래처 조회)');

    var state = OB.monthlyClosingState;

    // DOM 요소
    var startMonthInput = document.getElementById('monthly-closing-start-month');
    var endMonthInput = document.getElementById('monthly-closing-end-month');
    var companyInput = document.getElementById('monthly-closing-company');
    var checkBtn = document.getElementById('monthly-closing-check-btn');
    var executeBtn = document.getElementById('monthly-closing-execute-btn');
    var unlockBtn = document.getElementById('monthly-closing-unlock-btn');
    var statusDiv = document.getElementById('monthly-closing-status');
    var tbody = document.getElementById('monthly-closing-tbody');
    var tableTypeSelect = document.getElementById('monthly-table-type');
    var tableCountSpan = document.getElementById('monthly-table-count');
    var exportSummaryBtn = document.getElementById('monthly-export-summary-btn');
    var exportDetailBtn = document.getElementById('monthly-export-detail-btn');
    var exportByCompanyCheck = document.getElementById('monthly-export-by-company');
    var viewSalesBtn = document.getElementById('monthly-view-sales-btn');
    var viewPurchaseBtn = document.getElementById('monthly-view-purchase-btn');

    // 모달 요소
    var billingModal = document.getElementById('monthly-billing-modal');
    var modalTitle = document.getElementById('monthly-modal-title');
    var modalTbody = document.getElementById('monthly-modal-tbody');
    var modalCloseBtn = document.getElementById('monthly-modal-close');
    var modalCloseBtn2 = document.getElementById('monthly-modal-close-btn');

    // 기본 월 설정 (이번 달)
    setDefaultMonth();

    function setDefaultMonth() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var defaultMonth = year + '-' + month;
      startMonthInput.value = defaultMonth;
      endMonthInput.value = defaultMonth;
    }

    // 조회 버튼
    if (checkBtn) {
      checkBtn.addEventListener('click', function() {
        var startMonth = startMonthInput.value;
        var endMonth = endMonthInput.value;

        if (!startMonth || !endMonth) {
          alert('조회 기간을 선택해주세요.');
          return;
        }

        if (startMonth > endMonth) {
          alert('시작월이 종료월보다 클 수 없습니다.');
          return;
        }

        state.startMonth = startMonth.replace('-', '');
        state.endMonth = endMonth.replace('-', '');
        state.company = (companyInput.value || '').trim();

        loadBillings();
      });
    }

    // 청구서/지급요청서 목록 로드
    function loadBillings() {
      OB.showLoading('데이터 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          state.billingsList = result.billings || [];
          state.currentStatus = result;

          // 거래처 필터 적용
          applyFilters();

          // 요약 카드 렌더링
          renderSummaryCards();

          // 상태 div 표시
          statusDiv.style.display = 'block';
          updateTitleAndButtons();
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('조회 실패:', error);
          alert('조회 실패: ' + error.message);
        })
        .getBillingsForPeriodApi({
          startMonth: state.startMonth,
          endMonth: state.endMonth,
          company: state.company
        });
    }

    // 필터 적용
    function applyFilters() {
      var typeFilter = tableTypeSelect ? tableTypeSelect.value : 'all';

      state.filteredList = state.billingsList.filter(function(b) {
        if (typeFilter === 'all') return true;
        return b.type === typeFilter;
      });

      renderBillingsTable();
    }

    // 테이블 타입 필터 변경
    if (tableTypeSelect) {
      tableTypeSelect.addEventListener('change', applyFilters);
    }

    // 요약 카드 렌더링
    function renderSummaryCards() {
      var sales = { count: 0, totalAmount: 0, paidAmount: 0, unpaidAmount: 0 };
      var purchase = { count: 0, totalAmount: 0, paidAmount: 0, unpaidAmount: 0 };

      state.billingsList.forEach(function(b) {
        var amount = Number(b.amount) || 0;
        var paidAmount = Number(b.paidAmount) || 0;
        var remaining = amount - paidAmount;

        if (b.type === 'SALES') {
          sales.count++;
          sales.totalAmount += amount;
          sales.paidAmount += paidAmount;
          sales.unpaidAmount += remaining;
        } else if (b.type === 'PURCHASE') {
          purchase.count++;
          purchase.totalAmount += amount;
          purchase.paidAmount += paidAmount;
          purchase.unpaidAmount += remaining;
        }
      });

      // 매출 (청구서)
      document.getElementById('monthly-sales-count').textContent = sales.count + '건';
      document.getElementById('monthly-sales-amount').textContent = '₩' + OB.formatNumber(sales.totalAmount);
      document.getElementById('monthly-sales-paid').textContent = '₩' + OB.formatNumber(sales.paidAmount);
      document.getElementById('monthly-sales-unpaid').textContent = '₩' + OB.formatNumber(sales.unpaidAmount);

      // 매입 (지급요청서)
      document.getElementById('monthly-purchase-count').textContent = purchase.count + '건';
      document.getElementById('monthly-purchase-amount').textContent = '₩' + OB.formatNumber(purchase.totalAmount);
      document.getElementById('monthly-purchase-paid').textContent = '₩' + OB.formatNumber(purchase.paidAmount);
      document.getElementById('monthly-purchase-unpaid').textContent = '₩' + OB.formatNumber(purchase.unpaidAmount);

      // 손익 요약
      var profit = sales.totalAmount - purchase.totalAmount;
      document.getElementById('monthly-profit-value').textContent = '₩' + OB.formatNumber(profit);
    }

    // 타이틀 및 버튼 업데이트
    function updateTitleAndButtons() {
      var startYear = state.startMonth.substring(0, 4);
      var startMonth = state.startMonth.substring(4, 6);
      var endYear = state.endMonth.substring(0, 4);
      var endMonth = state.endMonth.substring(4, 6);

      var titleText;
      if (state.startMonth === state.endMonth) {
        titleText = startYear + '년 ' + parseInt(startMonth) + '월 마감 현황';
      } else {
        titleText = startYear + '.' + startMonth + ' ~ ' + endYear + '.' + endMonth + ' 마감 현황';
      }

      if (state.company) {
        titleText += ' [' + state.company + ']';
      }

      document.getElementById('monthly-status-title-text').textContent = titleText;

      // 상태 뱃지 (단일 월만 마감 가능)
      var badge = document.getElementById('monthly-status-badge');
      var isSingleMonth = state.startMonth === state.endMonth;

      if (isSingleMonth && state.currentStatus && state.currentStatus.status) {
        badge.textContent = state.currentStatus.status;
        badge.className = 'monthly-status-badge ' + state.currentStatus.status.toLowerCase();
        badge.style.display = 'inline-block';

        // 마감 버튼 표시
        if (state.currentStatus.status === 'CLOSED') {
          executeBtn.style.display = 'none';
          unlockBtn.style.display = 'inline-block';
        } else {
          executeBtn.style.display = 'inline-block';
          unlockBtn.style.display = 'none';
        }
      } else {
        badge.style.display = 'none';
        executeBtn.style.display = 'none';
        unlockBtn.style.display = 'none';
      }

      statusDiv.className = 'monthly-status open';
    }

    // 청구서 목록 테이블 렌더링
    function renderBillingsTable() {
      if (tableCountSpan) {
        tableCountSpan.textContent = state.filteredList.length + '건';
      }

      if (!state.filteredList || state.filteredList.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="8" class="monthly-empty">' +
          '<div class="monthly-empty-icon">📋</div>' +
          '<div class="monthly-empty-text">조회 결과가 없습니다</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      state.filteredList.forEach(function(billing) {
        var tr = document.createElement('tr');

        var typeText = billing.type === 'PURCHASE' ? '매입' : '매출';
        var typeClass = billing.type === 'PURCHASE' ? 'color:#f59e0b;' : 'color:#2563eb;';

        var amount = Number(billing.amount) || 0;
        var paidAmount = Number(billing.paidAmount) || 0;
        var remaining = amount - paidAmount;

        var statusText = getStatusText(billing.status);
        var statusClass = getStatusClass(billing.status);

        tr.innerHTML =
          '<td>' + (billing.billingId || '-') + '</td>' +
          '<td style="' + typeClass + 'font-weight:600;">' + typeText + '</td>' +
          '<td>' + (billing.company || '-') + '</td>' +
          '<td>' + (billing.billingDate || '-') + '</td>' +
          '<td class="num">₩' + OB.formatNumber(amount) + '</td>' +
          '<td class="num">₩' + OB.formatNumber(paidAmount) + '</td>' +
          '<td class="num" style="color:#f59e0b;">₩' + OB.formatNumber(remaining) + '</td>' +
          '<td class="status"><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>';

        tbody.appendChild(tr);
      });
    }

    function getStatusText(status) {
      switch (status) {
        case 'DRAFT': return '임시저장';
        case 'ISSUED': return '발행완료';
        case 'REQUESTED': return '지급요청';
        case 'PAID_PARTIAL': return '부분결제';
        case 'PAID': return '결제완료';
        case 'LOCKED': return '마감완료';
        default: return status || '-';
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'DRAFT': return 'draft';
        case 'ISSUED': return 'issued';
        case 'REQUESTED': return 'requested';
        case 'PAID_PARTIAL': return 'partial';
        case 'PAID': return 'paid';
        case 'LOCKED': return 'closed';
        default: return '';
      }
    }

    // 매출 목록 보기 버튼
    if (viewSalesBtn) {
      viewSalesBtn.addEventListener('click', function() {
        showBillingModal('SALES', '청구서 (매출) 목록');
      });
    }

    // 매입 목록 보기 버튼
    if (viewPurchaseBtn) {
      viewPurchaseBtn.addEventListener('click', function() {
        showBillingModal('PURCHASE', '지급요청서 (매입) 목록');
      });
    }

    // 청구서 목록 모달 표시
    function showBillingModal(type, title) {
      if (!state.billingsList || state.billingsList.length === 0) {
        alert('먼저 조회를 실행해주세요.');
        return;
      }

      var filtered = state.billingsList.filter(function(b) {
        return b.type === type;
      });

      modalTitle.textContent = title + ' (' + filtered.length + '건)';
      modalTbody.innerHTML = '';

      if (filtered.length === 0) {
        modalTbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#64748b;">데이터가 없습니다</td></tr>';
      } else {
        filtered.forEach(function(billing) {
          var tr = document.createElement('tr');

          var amount = Number(billing.amount) || 0;
          var paidAmount = Number(billing.paidAmount) || 0;
          var remaining = amount - paidAmount;

          var statusText = getStatusText(billing.status);
          var statusClass = getStatusClass(billing.status);

          tr.innerHTML =
            '<td>' + (billing.billingId || '-') + '</td>' +
            '<td>' + (billing.company || '-') + '</td>' +
            '<td>' + (billing.billingDate || '-') + '</td>' +
            '<td class="num">₩' + OB.formatNumber(amount) + '</td>' +
            '<td class="num">₩' + OB.formatNumber(paidAmount) + '</td>' +
            '<td class="num" style="color:#f59e0b;">₩' + OB.formatNumber(remaining) + '</td>' +
            '<td class="status"><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>';

          modalTbody.appendChild(tr);
        });
      }

      billingModal.style.display = 'flex';
    }

    // 모달 닫기
    function closeModal() {
      billingModal.style.display = 'none';
    }

    if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);
    if (modalCloseBtn2) modalCloseBtn2.addEventListener('click', closeModal);
    if (billingModal) {
      billingModal.addEventListener('click', function(e) {
        if (e.target === billingModal) closeModal();
      });
    }

    // 마감 실행 버튼
    if (executeBtn) {
      executeBtn.addEventListener('click', function() {
        if (state.startMonth !== state.endMonth) {
          alert('마감은 단일 월만 가능합니다.');
          return;
        }

        if (!confirm('월 마감을 실행하시겠습니까?\n\n발생주의 기준:\n- 청구서(SALES): ISSUED, PAID, PAID_PARTIAL → LOCKED\n- 지급요청서(PURCHASE): REQUESTED, PAID, PAID_PARTIAL → LOCKED\n- DRAFT 상태는 제외됩니다.')) {
          return;
        }

        OB.showLoading('월 마감 실행 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('마감 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert(result.message || '월 마감 완료');
            loadBillings();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            alert('마감 실패: ' + error.message);
          })
          .executeMonthlyClosingV2Api({
            yearMonth: state.startMonth
          });
      });
    }

    // 마감 해제 버튼
    if (unlockBtn) {
      unlockBtn.addEventListener('click', function() {
        if (state.startMonth !== state.endMonth) {
          alert('마감 해제는 단일 월만 가능합니다.');
          return;
        }

        if (!confirm('월 마감을 해제하시겠습니까?')) {
          return;
        }

        OB.showLoading('월 마감 해제 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();

            if (!result || !result.success) {
              alert('해제 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            alert(result.message || '월 마감 해제 완료');
            loadBillings();
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            alert('해제 실패: ' + error.message);
          })
          .unlockMonthlyClosingV2Api({
            yearMonth: state.startMonth
          });
      });
    }

    // 엑셀 출력 - 요약
    if (exportSummaryBtn) {
      exportSummaryBtn.addEventListener('click', function() {
        if (!state.billingsList || state.billingsList.length === 0) {
          alert('먼저 조회를 실행해주세요.');
          return;
        }
        exportToExcel('summary');
      });
    }

    // 엑셀 출력 - 상세
    if (exportDetailBtn) {
      exportDetailBtn.addEventListener('click', function() {
        if (!state.billingsList || state.billingsList.length === 0) {
          alert('먼저 조회를 실행해주세요.');
          return;
        }
        exportToExcel('detail');
      });
    }

    // 엑셀 출력 함수 (V3 - 기간/거래처별)
    function exportToExcel(type) {
      var byCompany = exportByCompanyCheck ? exportByCompanyCheck.checked : false;

      if (type === 'summary') {
        exportSummaryExcel(byCompany);
      } else {
        exportDetailExcel(byCompany);
      }
    }

    // 요약 엑셀 출력
    function exportSummaryExcel(byCompany) {
      var data = state.billingsList;

      if (byCompany) {
        // 거래처별 파일 분리
        var companyGroups = {};
        data.forEach(function(b) {
          var company = b.company || '미지정';
          if (!companyGroups[company]) {
            companyGroups[company] = [];
          }
          companyGroups[company].push(b);
        });

        var companies = Object.keys(companyGroups).sort();
        if (companies.length === 0) {
          alert('출력할 데이터가 없습니다.');
          return;
        }

        companies.forEach(function(company, index) {
          var billings = companyGroups[company];
          var csvContent = '\uFEFF';
          csvContent += '구분,건수,청구금액,결제금액,잔액\n';

          var sales = { count: 0, amount: 0, paid: 0 };
          var purchase = { count: 0, amount: 0, paid: 0 };

          billings.forEach(function(b) {
            var target = b.type === 'PURCHASE' ? purchase : sales;
            target.count++;
            target.amount += Number(b.amount) || 0;
            target.paid += Number(b.paidAmount) || 0;
          });

          csvContent += ['매출(청구서)', sales.count, sales.amount, sales.paid, sales.amount - sales.paid].join(',') + '\n';
          csvContent += ['매입(지급요청서)', purchase.count, purchase.amount, purchase.paid, purchase.amount - purchase.paid].join(',') + '\n';

          var safeCompany = company.replace(/[\/\\:*?"<>|]/g, '_');
          var fileName = '월마감_요약_' + state.startMonth + '_' + safeCompany + '.csv';

          setTimeout(function() {
            downloadCsv(csvContent, fileName);
          }, index * 300);
        });

        alert(companies.length + '개 거래처별 파일이 다운로드됩니다.');
      } else {
        // 전체 요약 (단일 파일)
        var csvContent = '\uFEFF';
        csvContent += '구분,건수,청구금액,결제금액,잔액\n';

        var sales = { count: 0, amount: 0, paid: 0 };
        var purchase = { count: 0, amount: 0, paid: 0 };

        data.forEach(function(b) {
          var target = b.type === 'PURCHASE' ? purchase : sales;
          target.count++;
          target.amount += Number(b.amount) || 0;
          target.paid += Number(b.paidAmount) || 0;
        });

        csvContent += ['매출(청구서)', sales.count, sales.amount, sales.paid, sales.amount - sales.paid].join(',') + '\n';
        csvContent += ['매입(지급요청서)', purchase.count, purchase.amount, purchase.paid, purchase.amount - purchase.paid].join(',') + '\n';
        csvContent += ['합계', sales.count + purchase.count, sales.amount + purchase.amount, sales.paid + purchase.paid, (sales.amount - sales.paid) + (purchase.amount - purchase.paid)].join(',') + '\n';

        downloadCsv(csvContent, '월마감_요약_' + state.startMonth + (state.startMonth !== state.endMonth ? '_' + state.endMonth : '') + '.csv');
      }
    }

    // 상세 엑셀 출력 (발주건별 품목 상세 - 서버 API 호출)
    function exportDetailExcel(byCompany) {
      OB.showLoading('상세 데이터 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('데이터 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          var headers = result.headers;
          var rows = result.rows;

          if (!rows || rows.length === 0) {
            alert('출력할 상세 데이터가 없습니다.');
            return;
          }

          if (byCompany) {
            // 거래처별 파일 분리
            var companyIndex = headers.indexOf('거래처');
            var companyGroups = {};

            rows.forEach(function(row) {
              var company = row[companyIndex] || '미지정';
              if (!companyGroups[company]) {
                companyGroups[company] = [];
              }
              companyGroups[company].push(row);
            });

            var companies = Object.keys(companyGroups).sort();

            companies.forEach(function(company, index) {
              var companyRows = companyGroups[company];
              var csvContent = '\uFEFF';
              csvContent += headers.join(',') + '\n';

              companyRows.forEach(function(row) {
                var rowData = row.map(function(cell) {
                  if (cell === null || cell === undefined) return '';
                  var str = String(cell);
                  if (str.indexOf(',') !== -1 || str.indexOf('"') !== -1) {
                    str = '"' + str.replace(/"/g, '""') + '"';
                  }
                  return str;
                });
                csvContent += rowData.join(',') + '\n';
              });

              var safeCompany = company.replace(/[\/\\:*?"<>|]/g, '_');
              var fileName = '월마감_상세_' + state.startMonth + '_' + safeCompany + '.csv';

              setTimeout(function() {
                downloadCsv(csvContent, fileName);
              }, index * 300);
            });

            alert(companies.length + '개 거래처별 파일이 다운로드됩니다.');
          } else {
            // 단일 파일
            var csvContent = '\uFEFF';
            csvContent += headers.join(',') + '\n';

            rows.forEach(function(row) {
              var rowData = row.map(function(cell) {
                if (cell === null || cell === undefined) return '';
                var str = String(cell);
                if (str.indexOf(',') !== -1 || str.indexOf('"') !== -1) {
                  str = '"' + str.replace(/"/g, '""') + '"';
                }
                return str;
              });
              csvContent += rowData.join(',') + '\n';
            });

            downloadCsv(csvContent, '월마감_상세_' + state.startMonth + (state.startMonth !== state.endMonth ? '_' + state.endMonth : '') + '.csv');
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('상세 데이터 조회 실패:', error);
          alert('상세 데이터 조회 실패: ' + error.message);
        })
        .getMonthlyClosingExcelDataApi({
          startMonth: state.startMonth,
          endMonth: state.endMonth,
          company: state.company,
          type: 'detail'
        });
    }

    // CSV 다운로드
    function downloadCsv(content, fileName) {
      var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      console.log('✅ 엑셀 다운로드 완료:', fileName);
    }

    console.log('✅ MonthlyClosing 페이지 초기화 완료 (V3)');
  };

  // ========================================
  // 청구서 관리 페이지 (BillingManagement)
  // ========================================
  OB.initBillingManagementPage = function() {
    console.log('🔄 BillingManagement 페이지 초기화 시작...');

    // DOM 요소
    var typeSelect = document.getElementById('billing-mgmt-type');
    var companyInput = document.getElementById('billing-mgmt-company');
    var statusSelect = document.getElementById('billing-mgmt-status');
    var startDateInput = document.getElementById('billing-mgmt-start-date');
    var endDateInput = document.getElementById('billing-mgmt-end-date');
    var searchBtn = document.getElementById('billing-mgmt-search-btn');
    var resetBtn = document.getElementById('billing-mgmt-reset-btn');

    var summaryDiv = document.getElementById('billing-mgmt-summary');
    var totalCountSpan = document.getElementById('billing-mgmt-total-count');
    var totalAmountSpan = document.getElementById('billing-mgmt-total-amount');
    var issuedAmountSpan = document.getElementById('billing-mgmt-issued-amount');
    var unpaidAmountSpan = document.getElementById('billing-mgmt-unpaid-amount');

    var tbody = document.getElementById('billing-mgmt-tbody');

    var detailModal = document.getElementById('billing-detail-modal');
    var modalCloseBtn = document.getElementById('billing-modal-close-btn');

    // 현재 선택된 청구서
    var currentBilling = null;

    // 날짜 기본값 설정 (당월 1일 ~ 말일)
    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    var lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

    startDateInput.value = formatDateInput(firstDay);
    endDateInput.value = formatDateInput(lastDay);

    function formatDateInput(date) {
      var year = date.getFullYear();
      var month = String(date.getMonth() + 1).padStart(2, '0');
      var day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    // 검색 버튼 클릭
    searchBtn.addEventListener('click', function() {
      var type = typeSelect.value;
      var company = companyInput.value.trim();
      var status = statusSelect.value;
      var startDate = startDateInput.value;
      var endDate = endDateInput.value;

      console.log('📋 청구서 조회:', { type: type, company: company, status: status, startDate: startDate, endDate: endDate });

      OB.showLoading('청구서 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('✅ 청구서 조회 완료:', result);

          if (!result || !result.success) {
            alert('조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          renderSummary(result.billings || []);
          renderTable(result.billings || []);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('❌ 청구서 조회 실패:', error);
          alert('청구서 조회 실패: ' + error.message);
        })
        .getBillingsApi({
          type: type,
          company: company,
          status: status,
          startDate: startDate,
          endDate: endDate
        });
    });

    // 초기화 버튼 클릭
    resetBtn.addEventListener('click', function() {
      typeSelect.value = '';
      companyInput.value = '';
      statusSelect.value = '';
      startDateInput.value = formatDateInput(firstDay);
      endDateInput.value = formatDateInput(lastDay);

      summaryDiv.style.display = 'none';
      tbody.innerHTML =
        '<tr><td colspan="8" class="billing-empty">' +
        '<div class="billing-empty-icon">📋</div>' +
        '<div class="billing-empty-text">조회 버튼을 눌러 청구서 목록을 확인하세요</div>' +
        '</td></tr>';
    });

    // 요약 카드 렌더링
    function renderSummary(billings) {
      if (!billings || billings.length === 0) {
        summaryDiv.style.display = 'none';
        return;
      }

      summaryDiv.style.display = 'grid';

      var totalCount = billings.length;
      var totalAmount = 0;
      var issuedAmount = 0;  // 발행/요청된 금액 (DRAFT 제외)
      var paidAmount = 0;    // 결제완료 금액

      billings.forEach(function(billing) {
        var amount = Number(billing.amount) || 0;
        totalAmount += amount;

        // 발행/요청 이상 상태 (DRAFT 제외)
        if (billing.status !== 'DRAFT') {
          issuedAmount += amount;
        }

        // 결제완료 또는 마감완료 (부분결제 제외)
        if (billing.status === 'PAID' || billing.status === 'LOCKED') {
          paidAmount += amount;
        }
      });

      var unpaidAmount = issuedAmount - paidAmount;

      totalCountSpan.textContent = OB.formatNumber(totalCount);
      totalAmountSpan.textContent = '₩' + OB.formatNumber(totalAmount);
      issuedAmountSpan.textContent = '₩' + OB.formatNumber(issuedAmount);
      unpaidAmountSpan.textContent = '₩' + OB.formatNumber(unpaidAmount);
    }

    // 테이블 렌더링
    function renderTable(billings) {
      if (!billings || billings.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="8" class="billing-empty">' +
          '<div class="billing-empty-icon">📋</div>' +
          '<div class="billing-empty-text">조회 결과가 없습니다</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      billings.forEach(function(billing) {
        var tr = document.createElement('tr');

        var statusBadge = '<span class="billing-status-badge ' +
          billing.status + '">' +
          getStatusText(billing.status) + '</span>';

        var typeText = billing.type === 'PURCHASE' ? '매입' : '매출';

        tr.innerHTML =
          '<td>' + billing.billingId + '</td>' +
          '<td>' + typeText + '</td>' +
          '<td>' + billing.company + '</td>' +
          '<td>' + billing.billingDate + '</td>' +
          '<td class="num">₩' + OB.formatNumber(billing.amount) + '</td>' +
          '<td class="center">' + statusBadge + '</td>' +
          '<td>' + (billing.notes || '-') + '</td>' +
          '<td class="center">' +
          '<button class="billing-btn primary small" data-billing-id="' + billing.billingId + '">상세</button>' +
          '</td>';

        tbody.appendChild(tr);
      });

      // 상세보기 버튼 이벤트
      tbody.querySelectorAll('button[data-billing-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var billingId = this.getAttribute('data-billing-id');
          var billing = billings.find(function(b) { return b.billingId === billingId; });
          if (billing) {
            showDetailModal(billing);
          }
        });
      });
    }

    function getStatusText(status) {
      switch (status) {
        case 'DRAFT': return '임시저장';
        case 'ISSUED': return '발행완료';
        case 'REQUESTED': return '지급요청';
        case 'PAID_PARTIAL': return '부분결제';
        case 'PAID': return '결제완료';
        case 'LOCKED': return '마감완료';
        default: return status;
      }
    }

    // 상세보기 모달 열기 (Phase 5: 변경이력 표시 추가)
    function showDetailModal(billing) {
      currentBilling = billing;

      // 기본 정보
      document.getElementById('detail-billing-id').textContent = billing.billingId || '-';
      document.getElementById('detail-type').textContent = billing.type === 'PURCHASE' ? '매입' : '매출';
      document.getElementById('detail-company').textContent = billing.company || '-';
      document.getElementById('detail-settlement-id').textContent = billing.settlementId || '-';
      document.getElementById('detail-billing-date').textContent = billing.billingDate || '-';
      document.getElementById('detail-amount').textContent = '₩' + OB.formatNumber(billing.amount);
      document.getElementById('detail-status').textContent = getStatusText(billing.status);
      document.getElementById('detail-notes').textContent = billing.notes || '-';

      // 발행 정보
      document.getElementById('detail-created-at').textContent = billing.createdAt || '-';
      document.getElementById('detail-created-by').textContent = billing.createdBy || '-';
      document.getElementById('detail-issued-at').textContent = billing.issuedAt || '-';
      document.getElementById('detail-issued-by').textContent = billing.issuedBy || '-';
      document.getElementById('detail-paid-at').textContent = billing.paidAt || '-';

      // 결제 정보
      var totalAmountEl = document.getElementById('detail-total-amount');
      var paidAmountEl = document.getElementById('detail-paid-amount');
      var remainingEl = document.getElementById('detail-remaining-balance');

      if (totalAmountEl) {
        totalAmountEl.textContent = '₩' + OB.formatNumber(billing.amount || 0);
      }
      if (paidAmountEl) {
        paidAmountEl.textContent = '₩' + OB.formatNumber(billing.paidAmount || 0);
      }
      if (remainingEl) {
        var remaining = (billing.amount || 0) - (billing.paidAmount || 0);
        if (billing.remainingBalance !== undefined) {
          remaining = billing.remainingBalance;
        }
        remainingEl.textContent = '₩' + OB.formatNumber(remaining);
      }

      // 변경이력 표시
      var historySection = document.getElementById('detail-change-history-section');
      var historyContent = document.getElementById('detail-change-history-content');

      if (historySection && historyContent) {
        var historyData = [];

        // changeHistory 파싱
        if (billing.changeHistory) {
          try {
            if (typeof billing.changeHistory === 'string') {
              historyData = JSON.parse(billing.changeHistory);
            } else if (Array.isArray(billing.changeHistory)) {
              historyData = billing.changeHistory;
            }
          } catch (e) {
            console.warn('변경이력 파싱 오류:', e);
          }
        }

        if (historyData && historyData.length > 0) {
          historySection.style.display = 'block';

          var tableHtml = '<table class="billing-history-table">' +
            '<thead><tr>' +
            '<th>변경일시</th>' +
            '<th class="num">변경 전</th>' +
            '<th class="num">변경 후</th>' +
            '<th>변경자</th>' +
            '</tr></thead><tbody>';

          historyData.forEach(function(h) {
            tableHtml += '<tr>' +
              '<td>' + (h.date || '-') + '</td>' +
              '<td class="num">₩' + OB.formatNumber(h.before || 0) + '</td>' +
              '<td class="num">₩' + OB.formatNumber(h.after || 0) + '</td>' +
              '<td>' + (h.by || '-') + '</td>' +
              '</tr>';
          });

          tableHtml += '</tbody></table>';
          historyContent.innerHTML = tableHtml;
        } else {
          historySection.style.display = 'none';
          historyContent.innerHTML = '';
        }
      }

      // 연결 발주번호 표시
      var orderNumbersSection = document.getElementById('detail-order-numbers-section');
      var orderNumbersDiv = document.getElementById('detail-order-numbers');

      if (orderNumbersSection && orderNumbersDiv) {
        var orderNumbers = [];

        if (billing.orderNumbers) {
          try {
            if (typeof billing.orderNumbers === 'string') {
              orderNumbers = JSON.parse(billing.orderNumbers);
            } else if (Array.isArray(billing.orderNumbers)) {
              orderNumbers = billing.orderNumbers;
            }
          } catch (e) {
            console.warn('발주번호 파싱 오류:', e);
          }
        }

        if (orderNumbers && orderNumbers.length > 0) {
          orderNumbersSection.style.display = 'block';
          var tagsHtml = orderNumbers.map(function(num) {
            return '<span class="billing-order-tag">' + num + '</span>';
          }).join('');
          orderNumbersDiv.innerHTML = tagsHtml;
        } else {
          orderNumbersSection.style.display = 'none';
          orderNumbersDiv.innerHTML = '';
        }
      }

      // 금액 동기화 버튼 표시 여부 결정
      var syncBtn = document.getElementById('billing-sync-amount-btn');
      if (syncBtn) {
        // LOCKED가 아니고, orderNumbers가 있을 때만 표시
        var hasOrderNumbers = billing.orderNumbers &&
          (Array.isArray(billing.orderNumbers) ? billing.orderNumbers.length > 0 :
           typeof billing.orderNumbers === 'string' && billing.orderNumbers !== '[]');
        var isNotLocked = billing.status !== 'LOCKED';

        if (hasOrderNumbers && isNotLocked) {
          syncBtn.style.display = 'inline-block';
        } else {
          syncBtn.style.display = 'none';
        }
      }

      detailModal.classList.add('active');
    }

    // 모달 닫기
    function closeDetailModal() {
      detailModal.classList.remove('active');
      currentBilling = null;
    }

    modalCloseBtn.addEventListener('click', closeDetailModal);

    // 모달 배경 클릭 시 닫기
    detailModal.addEventListener('click', function(e) {
      if (e.target === detailModal) {
        closeDetailModal();
      }
    });

    // 하단 닫기 버튼 (Phase 5: 기존 버튼 대체)
    var footerCloseBtn = document.getElementById('billing-detail-close-footer-btn');
    if (footerCloseBtn) {
      footerCloseBtn.addEventListener('click', closeDetailModal);
    }

    // 금액 동기화 버튼 클릭
    var syncAmountBtn = document.getElementById('billing-sync-amount-btn');
    if (syncAmountBtn) {
      syncAmountBtn.addEventListener('click', function() {
        if (!currentBilling || !currentBilling.billingId) {
          alert('청구서 정보가 없습니다.');
          return;
        }

        if (!confirm('거래원장 기준으로 금액을 재계산하시겠습니까?')) {
          return;
        }

        OB.showLoading('금액 동기화 중...');

        google.script.run
          .withSuccessHandler(function(result) {
            OB.hideLoading();
            console.log('✅ 금액 동기화 결과:', result);

            if (!result || !result.success) {
              alert('동기화 실패: ' + (result ? result.error : '알 수 없는 오류'));
              return;
            }

            if (result.updated) {
              var log = result.changeLog || {};
              alert('금액이 동기화되었습니다.\n\n' +
                '변경 전: ₩' + OB.formatNumber(log.before || 0) + '\n' +
                '변경 후: ₩' + OB.formatNumber(log.after || 0));

              // 모달 닫고 목록 새로고침
              closeDetailModal();
              searchBtn.click();
            } else {
              alert(result.message || '금액이 동일하여 업데이트하지 않았습니다.');
            }
          })
          .withFailureHandler(function(error) {
            OB.hideLoading();
            console.error('❌ 금액 동기화 실패:', error);
            alert('금액 동기화 실패: ' + error.message);
          })
          .syncBillingAmountFromLedgerApi({
            billingId: currentBilling.billingId
          });
      });
    }

    console.log('✅ BillingManagement 페이지 초기화 완료');
  };

  // ===========================================================
  // ✅ OrderFile 페이지 초기화 함수
  // ===========================================================
  OB.initOrderFilePage = function() {
    var wrap = document.getElementById('ob-orderfile-wrap');
    if (!wrap) {
      console.warn('OrderFile wrapper not found');
      return;
    }

    if (wrap.dataset.bound === '1') {
      console.log('OrderFile already initialized');
      return;
    }
    wrap.dataset.bound = '1';

    console.log('✅ OrderFile Page 초기화 완료');

    var parsedItems = [];
    var currentFilter = 'all'; // 'all' or 'unmatched'

    var customerSelect = document.getElementById('ob-customer-select');
    var fileInput = document.getElementById('ob-orderfile-input');
    var btnParse = document.getElementById('ob-btn-parse');
    var btnSave = document.getElementById('ob-btn-save');
    var tableBody = document.querySelector('#ob-orderfile-table tbody');

    var summaryCards = document.getElementById('ob-summary-cards');
    var summaryTotal = document.getElementById('summary-total');
    var summaryMatched = document.getElementById('summary-matched');
    var summaryUnmatched = document.getElementById('summary-unmatched');
    var summaryAmount = document.getElementById('summary-amount');
    var summaryMatchCard = document.getElementById('summary-match-card');

    var filterControls = document.getElementById('ob-filter-controls');
    var btnFilterUnmatched = document.getElementById('ob-btn-filter-unmatched');
    var btnFilterAll = document.getElementById('ob-btn-filter-all');

    var duplicateModal = document.getElementById('ob-duplicate-modal');
    var duplicateOrderList = document.getElementById('duplicate-order-list');
    var btnDuplicateCancel = document.getElementById('ob-btn-duplicate-cancel');
    var btnDuplicateContinue = document.getElementById('ob-btn-duplicate-continue');

    loadCustomers();

    function loadCustomers() {
      console.log('📄 발주처 목록 로드 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          console.log('✅ 발주처 응답:', result);

          var customerList = [];
          if (result && result.success) {
            if (Array.isArray(result.data)) {
              customerList = result.data;
            } else if (Array.isArray(result.customers)) {
              customerList = result.customers;
            }
          }

          if (!customerList.length) {
            console.warn('⚠️ 발주처 데이터가 비어있습니다.');
            return;
          }

          customerList.forEach(function(customerName) {
            var option = document.createElement('option');
            option.value = customerName;
            option.textContent = customerName;
            customerSelect.appendChild(option);
          });

          console.log('✅ 발주처 드롭다운 채우기 완료');
        })
        .withFailureHandler(function(error) {
          console.error('❌ 발주처 목록 로드 실패:', error);
          alert('발주처 목록을 불러올 수 없습니다: ' + error.message);
        })
        .getCustomers();
    }

    if (btnParse) {
      btnParse.addEventListener('click', function() {
        var file = fileInput.files[0];
        var selectedCustomer = customerSelect.value;

        if (!selectedCustomer) {
          alert('발주처를 먼저 선택해주세요.');
          return;
        }

        if (!file) {
          alert('파일을 먼저 선택해주세요.');
          return;
        }

        console.log('파싱 시작:', file.name, '발주처:', selectedCustomer);
        OB.showLoading('파일을 읽는 중...');

        var reader = new FileReader();

        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });

            var firstSheetName = workbook.SheetNames[0];
            var worksheet = workbook.Sheets[firstSheetName];

            var rows = XLSX.utils.sheet_to_json(worksheet, {
              header: 1,
              defval: '',
              blankrows: false
            });

            console.log('엑셀 읽기 완료. 행 수:', rows.length);

            if (rows.length === 0) {
              OB.hideLoading();
              alert('파일이 비어있습니다.');
              return;
            }

            OB.showLoading('서버에서 매칭 중...');

            google.script.run
              .withSuccessHandler(function(result) {
                OB.hideLoading();
                console.log('파싱 결과:', result);

                if (result && result.items) {
                  parsedItems = result.items.map(function(item) {
                    item.customer = selectedCustomer;
                    return item;
                  });
                  displayParseResult(result);
                  btnSave.disabled = false;
                } else {
                  alert('파싱 결과가 올바르지 않습니다.');
                }
              })
              .withFailureHandler(function(error) {
                OB.hideLoading();
                console.error('파싱 실패:', error);
                alert('파싱 중 오류 발생: ' + error.message);
              })
              .processParsedOrderRows(rows);

          } catch (err) {
            OB.hideLoading();
            console.error('파일 읽기 오류:', err);
            alert('파일을 읽는 중 오류가 발생했습니다.');
          }
        };

        reader.onerror = function(err) {
          OB.hideLoading();
          console.error('파일 로드 실패:', err);
          alert('파일을 불러오는 중 오류가 발생했습니다.');
        };

        reader.readAsArrayBuffer(file);
      });
    }

    if (btnSave) {
      btnSave.addEventListener('click', function() {
        if (!parsedItems || parsedItems.length === 0) {
          alert('저장할 데이터가 없습니다. 먼저 파일을 파싱해주세요.');
          return;
        }

        var unmatched = parsedItems.filter(function(item) { return item.matchStatus !== 'MATCHED'; });

        if (unmatched.length > 0) {
          var confirmMessage = '매칭되지 않은 품목이 ' + unmatched.length + '건 있습니다.\n' +
                               '이대로 저장하시겠습니까?';
          if (!confirm(confirmMessage)) {
            return;
          }
        }

        checkDuplicateOrders(parsedItems, function(canProceed, duplicates) {
          if (!canProceed) {
            duplicateModal.style.display = 'flex';
            renderDuplicates(duplicates);
            return;
          }

          saveOrders(parsedItems);
        });
      });
    }

    function renderDuplicates(duplicates) {
      duplicateOrderList.innerHTML = '';

      // checkTodayDuplicateOrder 반환 형식:
      // { orderCode, brands, itemCount, totalAmount }
      duplicates.forEach(function(dup) {
        var li = document.createElement('div');
        li.className = 'ob-modal-list-item';
        li.innerHTML = '<div><div class="title">' + (dup.orderCode || '발주번호 없음') + '</div>' +
                       '<div class="sub">브랜드: ' + (dup.brands || '-') + ', 품목수: ' + (dup.itemCount || 0) + '건</div></div>' +
                       '<div class="status">₩' + OB.formatNumber(dup.totalAmount || 0) + '</div>';
        duplicateOrderList.appendChild(li);
      });
    }

    if (btnDuplicateCancel) {
      btnDuplicateCancel.addEventListener('click', function() {
        duplicateModal.style.display = 'none';
      });
    }

    if (btnDuplicateContinue) {
      btnDuplicateContinue.addEventListener('click', function() {
        duplicateModal.style.display = 'none';
        saveOrders(parsedItems);
      });
    }

    function checkDuplicateOrders(items, callback) {
      var today = new Date();
      var yyyy = today.getFullYear();
      var mm = ('0' + (today.getMonth() + 1)).slice(-2);
      var dd = ('0' + today.getDate()).slice(-2);
      var todayStr = yyyy + '-' + mm + '-' + dd;

      var customer = items[0] ? items[0].customer : '';
      if (!customer) {
        callback(true, []);
        return;
      }

      OB.showLoading('오늘 발주 내역 확인 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('중복 체크 결과:', result);

          if (!result || !result.success || !result.hasDuplicate) {
            callback(true, []);
            return;
          }

          // 중복 발주가 있으면 orders 배열 전달
          if (result.orders && result.orders.length > 0) {
            callback(false, result.orders);
          } else {
            callback(true, []);
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('중복 확인 실패:', error);
          alert('중복 확인 중 오류가 발생했습니다: ' + error.message);
          callback(true, []);
        })
        .checkTodayDuplicateOrder(customer, todayStr);
    }

    function saveOrders(items) {
      OB.showLoading('발주 저장 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          console.log('발주 저장 결과:', result);

          if (result && result.success) {
            alert('발주 저장이 완료되었습니다. (' + result.savedRows + '건)');
            btnSave.disabled = true;
            // 테이블 초기화
            parsedItems = [];
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #9ca3af;">파일을 선택하고 파싱 버튼을 클릭하세요</td></tr>';
            summaryCards.style.display = 'none';
            filterControls.style.display = 'none';
          } else {
            var errorMsg = '발주 저장 실패:\n';
            if (result && result.errors && result.errors.length > 0) {
              errorMsg += result.errors.slice(0, 5).join('\n');
              if (result.errors.length > 5) {
                errorMsg += '\n... 외 ' + (result.errors.length - 5) + '건';
              }
            } else {
              errorMsg += (result ? result.error : '알 수 없는 오류');
            }
            alert(errorMsg);
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('발주 저장 실패:', error);
          alert('발주 저장 중 오류 발생: ' + error.message);
        })
        .saveParsedOrdersToDB(items);
    }

    function displayParseResult(result) {
      if (!result || !result.items) {
        alert('파싱 결과가 올바르지 않습니다.');
        return;
      }

      // ✅ 디버그 정보 확인 및 경고 표시
      if (result.debug) {
        console.log('=== 파싱 디버그 정보 ===');
        console.log('원본 헤더:', result.debug.originalHeader);
        console.log('컬럼 매핑:', result.debug.columnMap);

        var warnings = [];
        if (!result.debug.barcodeDetected) {
          warnings.push('바코드 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.brandDetected) {
          warnings.push('브랜드 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.productNameDetected) {
          warnings.push('제품명 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.supplyPriceDetected) {
          warnings.push('공급가 컬럼을 찾을 수 없습니다');
        }
        if (!result.debug.orderQtyDetected) {
          warnings.push('수량 컬럼을 찾을 수 없습니다');
        }

        if (warnings.length > 0) {
          console.warn('⚠️ 컬럼 감지 경고:', warnings);

          // 경고 메시지 표시
          var warningHtml = '<div style="background: #fef3c7; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 16px;">' +
            '<strong style="color: #92400e;">⚠️ 컬럼 감지 경고</strong><br>' +
            '<span style="color: #78350f;">' + warnings.join(', ') + '</span><br>' +
            '<small style="color: #92400e;">엑셀 헤더: ' + (result.debug.originalHeader ? result.debug.originalHeader.slice(0, 10).join(', ') : 'N/A') + '</small>' +
            '</div>';

          // 테이블 위에 경고 삽입
          var tableWrap = document.querySelector('.ob-orderfile-table-wrap');
          if (tableWrap) {
            var existingWarning = tableWrap.querySelector('.column-warning');
            if (existingWarning) existingWarning.remove();

            var warningDiv = document.createElement('div');
            warningDiv.className = 'column-warning';
            warningDiv.innerHTML = warningHtml;
            tableWrap.insertBefore(warningDiv, tableWrap.firstChild);
          }
        }
      }

      // 요약 카드 표시
      summaryCards.style.display = 'grid';

      summaryTotal.textContent = result.items.length + '개';
      summaryMatched.textContent = (result.matchedCount || 0) + '개';
      summaryUnmatched.textContent = '미매칭 ' + (result.unmatchedCount || 0) + '개';
      summaryAmount.textContent = '₩' + OB.formatNumber(result.totalAmount || 0);

      if (result.items.length > 0) {
        var matchRate = ((result.matchedCount || 0) / result.items.length) * 100;
        if (matchRate >= 80) {
          summaryMatchCard.classList.add('success');
          summaryMatchCard.classList.remove('highlight');
        } else {
          summaryMatchCard.classList.add('highlight');
          summaryMatchCard.classList.remove('success');
        }
      }

      var hasUnmatched = (result.unmatchedCount || 0) > 0;
      filterControls.style.display = hasUnmatched ? 'flex' : 'none';
      btnFilterAll.style.display = 'none';
      btnFilterUnmatched.style.display = hasUnmatched ? 'inline-block' : 'none';

      renderTable(result.items);
    }

    function renderTable(items) {
      tableBody.innerHTML = '';

      // HTML 테이블 헤더: #, 브랜드, 제품명, 바코드, 수량, 공급단가, 금액, 상태
      items.forEach(function(item, index) {
        var tr = document.createElement('tr');
        var isMatched = item.matchStatus === 'MATCHED';

        if (isMatched) {
          tr.classList.add('matched');
        } else {
          tr.classList.add('unmatched');
        }

        tr.innerHTML =
          '<td>' + (item.seq || index + 1) + '</td>' +
          '<td>' + (item.brand || '') + '</td>' +
          '<td>' + (item.productName || '') + '</td>' +
          '<td>' + (item.barcode || '-') + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.supplyPrice || 0) + '</td>' +
          '<td class="num">' + OB.formatNumber(item.orderAmount || 0) + '</td>' +
          '<td class="status-cell">' +
            (isMatched ? '<span class="status-text status-matched">매칭</span>' : '<span class="status-text status-unmatched">미매칭</span>') +
          '</td>';

        tableBody.appendChild(tr);
      });
    }

    if (btnFilterUnmatched) {
      btnFilterUnmatched.addEventListener('click', function() {
        currentFilter = 'unmatched';
        applyFilter();
        btnFilterUnmatched.style.display = 'none';
        btnFilterAll.style.display = 'inline-block';
      });
    }

    if (btnFilterAll) {
      btnFilterAll.addEventListener('click', function() {
        currentFilter = 'all';
        applyFilter();
        btnFilterAll.style.display = 'none';
        btnFilterUnmatched.style.display = 'inline-block';
      });
    }

    function applyFilter() {
      var rows = tableBody.querySelectorAll('tr');
      rows.forEach(function(row) {
        if (currentFilter === 'unmatched') {
          if (row.classList.contains('matched')) {
            row.classList.add('hidden');
          } else {
            row.classList.remove('hidden');
          }
        } else {
          row.classList.remove('hidden');
        }
      });
    }
  };

  // ===========================================================
  // ✅ OrderInput 페이지 초기화 함수 (발주 직접 입력)
  // ===========================================================
  OB.orderInputState = {
    items: [],
    customers: [],
    brands: [],
    brandToSupplierMap: {}
  };

  OB.initOrderInputPage = function() {
    console.log('📝 OrderInput 페이지 초기화 시작...');

    var state = OB.orderInputState;

    // DOM 요소
    var dateInput = document.getElementById('ob-orderinput-date');
    var customerSelect = document.getElementById('ob-orderinput-customer');
    var brandSelect = document.getElementById('ob-orderinput-brand');
    var supplierInput = document.getElementById('ob-orderinput-supplier');

    var productSearch = document.getElementById('ob-product-search');
    var autocompleteList = document.getElementById('ob-product-autocomplete');

    var itemNameInput = document.getElementById('ob-item-name');
    var itemCodeInput = document.getElementById('ob-item-code');
    var itemQtyInput = document.getElementById('ob-item-qty');
    var itemBuyPriceInput = document.getElementById('ob-item-buyprice');
    var itemSupplyPriceInput = document.getElementById('ob-item-supplyprice');
    var itemAmountInput = document.getElementById('ob-item-amount');

    var addItemBtn = document.getElementById('ob-add-item-btn');
    var clearAllBtn = document.getElementById('ob-clear-all-btn');
    var resetBtn = document.getElementById('ob-reset-btn');
    var saveBtn = document.getElementById('ob-save-btn');

    var tbody = document.getElementById('ob-orderinput-tbody');
    var emptyRow = document.getElementById('ob-empty-row');
    var itemCountSpan = document.getElementById('ob-item-count');
    var summaryArea = document.getElementById('ob-summary-area');

    var totalItemsSpan = document.getElementById('ob-total-items');
    var totalQtySpan = document.getElementById('ob-total-qty');
    var totalBuySpan = document.getElementById('ob-total-buy');
    var totalSupplySpan = document.getElementById('ob-total-supply');
    var totalMarginSpan = document.getElementById('ob-total-margin');

    var modeTabs = document.querySelectorAll('.ob-input-mode-tab');
    var searchMode = document.getElementById('ob-search-mode');

    // 오늘 날짜 설정
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = ('0' + (today.getMonth() + 1)).slice(-2);
    var dd = ('0' + today.getDate()).slice(-2);
    dateInput.value = yyyy + '-' + mm + '-' + dd;

    // 입력 모드 탭 전환
    modeTabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        modeTabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var mode = tab.getAttribute('data-mode');
        if (mode === 'search') {
          searchMode.style.display = 'flex';
        } else {
          searchMode.style.display = 'none';
        }
      });
    });

    // 마스터 데이터 로드
    function loadMasterData() {
      OB.showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          if (result && result.success) {
            state.customers = result.customers || [];
            state.brands = result.brands || [];
            state.brandToSupplierMap = result.brandToSupplierMap || {};

            // 발주처 드롭다운
            customerSelect.innerHTML = '<option value="">-- 발주처 선택 --</option>';
            state.customers.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c.name;
              opt.textContent = c.name;
              customerSelect.appendChild(opt);
            });

            // 브랜드 드롭다운
            brandSelect.innerHTML = '<option value="">-- 브랜드 선택 --</option>';
            state.brands.forEach(function(b) {
              var opt = document.createElement('option');
              opt.value = b;
              opt.textContent = b;
              brandSelect.appendChild(opt);
            });

            console.log('✅ 마스터 데이터 로드 완료:', {
              customers: state.customers.length,
              brands: state.brands.length
            });
          } else {
            alert('마스터 데이터 로드 실패: ' + (result ? result.error : '알 수 없는 오류'));
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          alert('마스터 데이터 로드 실패: ' + error.message);
        })
        .getOrderInputMasterDataApi();
