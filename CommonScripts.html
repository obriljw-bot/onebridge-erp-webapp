    // 브랜드 선택 시 매입처 자동 입력
    brandSelect.addEventListener('change', function() {
      var brand = brandSelect.value;
      if (brand && state.brandToSupplierMap[brand]) {
        supplierInput.value = state.brandToSupplierMap[brand];
      } else {
        supplierInput.value = '';
      }
    });

    // 품목 검색 자동완성 (서버 API 호출)
    var searchTimeout = null;
    productSearch.addEventListener('input', function() {
      clearTimeout(searchTimeout);
      var query = productSearch.value.trim();
      if (query.length < 2) {
        autocompleteList.classList.remove('show');
        return;
      }

      searchTimeout = setTimeout(function() {
        // 서버에서 품목 검색
        google.script.run
          .withSuccessHandler(function(result) {
            if (result && result.success) {
              renderAutocomplete(result.products || []);
            } else {
              autocompleteList.classList.remove('show');
            }
          })
          .withFailureHandler(function() {
            autocompleteList.classList.remove('show');
          })
          .searchProductsForOrderApi(query, 10);
      }, 300);
    });

    productSearch.addEventListener('blur', function() {
      setTimeout(function() {
        autocompleteList.classList.remove('show');
      }, 200);
    });

    function renderAutocomplete(results) {
      if (results.length === 0) {
        autocompleteList.classList.remove('show');
        return;
      }

      autocompleteList.innerHTML = '';
      results.forEach(function(p) {
        var div = document.createElement('div');
        div.className = 'ob-autocomplete-item';
        div.innerHTML = '<span class="barcode">' + p.barcode + '</span> ' +
                        '<span class="name">' + (p.name || '') + '</span>' +
                        '<span class="brand">' + (p.brand || '') + '</span>';
        div.addEventListener('click', function() {
          selectProduct(p);
          autocompleteList.classList.remove('show');
          productSearch.value = '';
        });
        autocompleteList.appendChild(div);
      });
      autocompleteList.classList.add('show');
    }

    function selectProduct(product) {
      itemNameInput.value = product.name || '';
      itemCodeInput.value = product.barcode || '';
      itemBuyPriceInput.value = product.buyPrice || '';
      itemQtyInput.value = '';
      itemSupplyPriceInput.value = '';
      itemAmountInput.value = '';
      itemQtyInput.focus();

      // 브랜드 자동 선택
      if (product.brand && brandSelect.value === '') {
        for (var i = 0; i < brandSelect.options.length; i++) {
          if (brandSelect.options[i].value === product.brand) {
            brandSelect.value = product.brand;
            brandSelect.dispatchEvent(new Event('change'));
            break;
          }
        }
      }
    }

    // 수량/단가 입력 시 금액 자동 계산
    function updateItemAmount() {
      var qty = parseInt(itemQtyInput.value) || 0;
      var supplyPrice = parseInt(itemSupplyPriceInput.value) || 0;
      var amount = qty * supplyPrice;
      itemAmountInput.value = OB.formatNumber(amount);
    }

    itemQtyInput.addEventListener('input', updateItemAmount);
    itemSupplyPriceInput.addEventListener('input', updateItemAmount);

    // 품목 추가
    addItemBtn.addEventListener('click', function() {
      var name = itemNameInput.value.trim();
      var code = itemCodeInput.value.trim();
      var qty = parseInt(itemQtyInput.value) || 0;
      var buyPrice = parseInt(itemBuyPriceInput.value) || 0;
      var supplyPrice = parseInt(itemSupplyPriceInput.value) || 0;

      // 필수값 검증
      if (!name) {
        alert('제품명을 입력해주세요.');
        itemNameInput.focus();
        return;
      }
      if (!code) {
        alert('품목코드를 입력해주세요.');
        itemCodeInput.focus();
        return;
      }
      if (qty <= 0) {
        alert('수량을 입력해주세요.');
        itemQtyInput.focus();
        return;
      }
      if (buyPrice <= 0) {
        alert('매입가를 입력해주세요.');
        itemBuyPriceInput.focus();
        return;
      }
      if (supplyPrice <= 0) {
        alert('공급가를 입력해주세요.');
        itemSupplyPriceInput.focus();
        return;
      }

      var item = {
        name: name,
        code: code,
        qty: qty,
        buyPrice: buyPrice,
        supplyPrice: supplyPrice,
        supplyAmount: qty * supplyPrice,
        buyAmount: qty * buyPrice,
        marginAmount: (qty * supplyPrice) - (qty * buyPrice)
      };

      state.items.push(item);
      renderItems();
      clearItemForm();
      productSearch.focus();
    });

    function clearItemForm() {
      itemNameInput.value = '';
      itemCodeInput.value = '';
      itemQtyInput.value = '';
      itemBuyPriceInput.value = '';
      itemSupplyPriceInput.value = '';
      itemAmountInput.value = '';
    }

    function renderItems() {
      if (state.items.length === 0) {
        emptyRow.style.display = '';
        summaryArea.style.display = 'none';
        clearAllBtn.style.display = 'none';
        saveBtn.disabled = true;
        itemCountSpan.textContent = '0';
        return;
      }

      emptyRow.style.display = 'none';
      summaryArea.style.display = 'flex';
      clearAllBtn.style.display = '';
      saveBtn.disabled = false;
      itemCountSpan.textContent = state.items.length;

      // 기존 행 삭제 (빈 행 제외)
      var existingRows = tbody.querySelectorAll('tr:not(#ob-empty-row)');
      existingRows.forEach(function(row) { row.remove(); });

      var totals = { items: 0, qty: 0, buy: 0, supply: 0, margin: 0 };

      state.items.forEach(function(item, index) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (index + 1) + '</td>' +
          '<td>' + item.name + '</td>' +
          '<td>' + item.code + '</td>' +
          '<td class="text-right">' + OB.formatNumber(item.qty) + '</td>' +
          '<td class="text-right">' + OB.formatNumber(item.buyPrice) + '</td>' +
          '<td class="text-right">' + OB.formatNumber(item.supplyPrice) + '</td>' +
          '<td class="text-right">' + OB.formatNumber(item.supplyAmount) + '</td>' +
          '<td class="text-right">' + OB.formatNumber(item.marginAmount) + '</td>' +
          '<td class="text-center"><button type="button" class="ob-item-delete-btn" data-index="' + index + '">삭제</button></td>';

        tbody.insertBefore(tr, emptyRow);

        totals.items++;
        totals.qty += item.qty;
        totals.buy += item.buyAmount;
        totals.supply += item.supplyAmount;
        totals.margin += item.marginAmount;
      });

      // 합계 업데이트
      totalItemsSpan.textContent = OB.formatNumber(totals.items);
      totalQtySpan.textContent = OB.formatNumber(totals.qty);
      totalBuySpan.textContent = OB.formatNumber(totals.buy);
      totalSupplySpan.textContent = OB.formatNumber(totals.supply);
      totalMarginSpan.textContent = OB.formatNumber(totals.margin);

      // 삭제 버튼 이벤트
      tbody.querySelectorAll('.ob-item-delete-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-index'));
          state.items.splice(idx, 1);
          renderItems();
        });
      });
    }

    // 전체 삭제
    clearAllBtn.addEventListener('click', function() {
      if (confirm('모든 품목을 삭제하시겠습니까?')) {
        state.items = [];
        renderItems();
      }
    });

    // 초기화
    resetBtn.addEventListener('click', function() {
      if (state.items.length > 0) {
        if (!confirm('입력한 내용이 모두 삭제됩니다. 초기화하시겠습니까?')) {
          return;
        }
      }
      state.items = [];
      customerSelect.value = '';
      brandSelect.value = '';
      supplierInput.value = '';
      clearItemForm();
      renderItems();

      // 오늘 날짜 재설정
      var today = new Date();
      var yyyy = today.getFullYear();
      var mm = ('0' + (today.getMonth() + 1)).slice(-2);
      var dd = ('0' + today.getDate()).slice(-2);
      dateInput.value = yyyy + '-' + mm + '-' + dd;
    });

    // 저장
    saveBtn.addEventListener('click', function() {
      var orderDate = dateInput.value;
      var customer = customerSelect.value.trim();
      var brand = brandSelect.value.trim();
      var supplier = supplierInput.value.trim();

      // 필수값 검증
      if (!orderDate) {
        alert('발주일을 선택해주세요.');
        dateInput.focus();
        return;
      }
      if (!customer) {
        alert('발주처를 선택해주세요.');
        customerSelect.focus();
        return;
      }
      if (!brand) {
        alert('브랜드를 선택해주세요.');
        brandSelect.focus();
        return;
      }
      if (state.items.length === 0) {
        alert('품목을 추가해주세요.');
        return;
      }

      var saveData = {
        orderDate: orderDate,
        customer: customer,
        brand: brand,
        supplier: supplier,
        items: state.items
      };

      if (!confirm('발주를 저장하시겠습니까?\n\n' +
          '발주처: ' + customer + '\n' +
          '브랜드: ' + brand + '\n' +
          '품목수: ' + state.items.length + '건')) {
        return;
      }

      OB.showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();
          if (result && result.success) {
            alert('발주가 저장되었습니다.\n\n' +
                  '발주번호: ' + result.orderCode + '\n' +
                  '저장건수: ' + result.savedRows + '건');

            // 초기화
            state.items = [];
            customerSelect.value = '';
            brandSelect.value = '';
            supplierInput.value = '';
            clearItemForm();
            renderItems();
          } else {
            var errorMsg = '발주 저장 실패';
            if (result && result.error) {
              errorMsg += ': ' + result.error;
            }
            if (result && result.errors && result.errors.length > 0) {
              errorMsg += '\n\n' + result.errors.slice(0, 5).join('\n');
            }
            alert(errorMsg);
          }
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          alert('발주 저장 실패: ' + error.message);
        })
        .saveWebOrderInputApi(saveData);
    });

    // 초기화 실행
    loadMasterData();
    console.log('✅ OrderInput 페이지 초기화 완료');
  };

  // ===========================================================
  // ✅ TransactionLedger 페이지 초기화 함수
  // ===========================================================
  OB.transactionLedgerState = {
    raw: [],
    filtered: [],
    paymentTermsMap: {}
  };

  OB.initTransactionLedgerPage = function() {
    console.log('🔄 TransactionLedger 페이지 초기화 시작...');

    var state = OB.transactionLedgerState;

    var startDateInput = document.getElementById('ledger-start-date');
    var endDateInput = document.getElementById('ledger-end-date');
    var companyInput = document.getElementById('ledger-company');
    var statusSelect = document.getElementById('ledger-status');
    var paymentTermsSelect = document.getElementById('ledger-payment-terms');
    var orderCodeInput = document.getElementById('ledger-order-code');
    var searchBtn = document.getElementById('ledger-search-btn');
    var resetBtn = document.getElementById('ledger-reset-btn');
    var tbody = document.getElementById('ledger-tbody');

    var summaryCount = document.getElementById('ledger-summary-count');
    var summaryOrderQty = document.getElementById('ledger-summary-order-qty');
    var summaryConfirmedQty = document.getElementById('ledger-summary-confirmed-qty');
    var summaryAmount = document.getElementById('ledger-summary-amount');

    // 체크박스 및 일괄 액션 버튼
    var selectAllCheckbox = document.getElementById('ledger-select-all');
    var bulkInvoiceBtn = document.getElementById('ledger-bulk-invoice-btn');
    var bulkPaymentRequestBtn = document.getElementById('ledger-bulk-payment-request-btn');
    var bulkStatusBtn = document.getElementById('ledger-bulk-status-btn');
    var selectedCountSpan = document.getElementById('ledger-selected-count');

    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    startDateInput.value = formatDateInput(firstDay);
    endDateInput.value = formatDateInput(today);

    function formatDateInput(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function parseDate(value) {
      if (!value) return null;
      var d = value instanceof Date ? value : new Date(value);
      return isNaN(d.getTime()) ? null : d;
    }

    function applyFilters() {
      var start = parseDate(startDateInput.value);
      var end = parseDate(endDateInput.value);
      var company = (companyInput.value || '').trim();
      var status = statusSelect.value;
      var paymentTerms = paymentTermsSelect ? paymentTermsSelect.value : '';
      var orderCode = (orderCodeInput.value || '').trim();

      state.filtered = state.raw.filter(function(tx) {
        var keep = true;

        if (orderCode) {
          keep = keep && String(tx['발주번호'] || '').indexOf(orderCode) !== -1;
        }

        if (company) {
          keep = keep && String(tx['발주처'] || '').indexOf(company) !== -1;
        }

        if (status) {
          // 4개 상태 컬럼 중 하나라도 매칭되면 포함
          var matchFound = false;
          var statusUpper = status.toUpperCase();
          if (String(tx['매입발주'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['매입결제'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['매출결제'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          if (String(tx['출고'] || '').toUpperCase().indexOf(statusUpper) !== -1) matchFound = true;
          keep = keep && matchFound;
        }

        // 결제조건 필터 (매입처의 거래처DB 결제조건 기준)
        if (paymentTerms) {
          var supplier = String(tx['매입처'] || '').trim();
          var supplierTerms = state.paymentTermsMap[supplier] || '';
          keep = keep && (supplierTerms === paymentTerms);
        }

        if (start || end) {
          var orderDate = parseDate(tx['발주일']);
          if (start && (!orderDate || orderDate < start)) keep = false;
          if (end && (!orderDate || orderDate > end)) keep = false;
        }

        return keep;
      });

      renderSummary();
      renderTable();
    }

    function renderSummary() {
      var totalOrderQty = 0;
      var totalConfirmedQty = 0;
      var totalAmount = 0;

      state.filtered.forEach(function(tx) {
        totalOrderQty += Number(tx['발주수량']) || 0;
        totalConfirmedQty += Number(tx['확정수량']) || 0;
        totalAmount += Number(tx['공급액']) || 0;
      });

      summaryCount.textContent = (state.filtered.length || 0) + '건';
      summaryOrderQty.textContent = OB.formatNumber(totalOrderQty);
      summaryConfirmedQty.textContent = OB.formatNumber(totalConfirmedQty);
      summaryAmount.textContent = '₩' + OB.formatNumber(totalAmount);
    }

    function buildStatusSelect(current) {
      var select = document.createElement('select');
      select.className = 'ledger-status-select';
      var options = ['DRAFT', 'CONFIRMED', 'ISSUED', 'PAID', 'CANCELLED'];

      if (current && options.indexOf(current) === -1) {
        options.unshift(current);
      }

      options.forEach(function(opt) {
        var optionEl = document.createElement('option');
        optionEl.value = opt;
        optionEl.textContent = opt;
        if (current === opt) {
          optionEl.selected = true;
        }
        select.appendChild(optionEl);
      });

      return select;
    }

    function renderTable() {
      if (!tbody) return;

      if (!state.filtered.length) {
        tbody.innerHTML = '<tr><td colspan="13" class="ledger-empty">조회 결과가 없습니다.</td></tr>';
        return;
      }

      // 거래번호 단위로 집계
      var aggregated = {};
      state.filtered.forEach(function(tx) {
        var orderNum = tx['발주번호'];
        if (!orderNum) return;

        if (!aggregated[orderNum]) {
          aggregated[orderNum] = {
            orderDate: tx['발주일'],
            orderNumber: orderNum,
            company: tx['발주처'],      // 발주처 (고객사) - 매출청구서용
            supplier: tx['매입처'],     // 매입처 (공급사) - 매입청구서용
            brand: tx['브랜드'] || '-',
            items: [],
            totalOrderQty: 0,
            totalConfirmedQty: 0,
            totalPurchaseAmt: 0,
            totalSupplyAmt: 0,
            totalMarginAmt: 0,
            buyOrder: tx['매입발주'] || '',
            payBuy: tx['매입결제'] || '',
            paySell: tx['매출결제'] || '',
            ship: tx['출고'] || ''
          };
        }

        aggregated[orderNum].items.push(tx);
        var confirmedQty = Number(tx['확정수량']) || 0;
        var buyPrice = Number(tx['매입가']) || 0;
        var supplyPrice = Number(tx['공급가']) || 0;

        aggregated[orderNum].totalOrderQty += Number(tx['발주수량']) || 0;

          var isCompleted = completed.indexOf(status) !== -1;

    function updateBulkButtons() {

        var checkedBoxes = Array.prototype.filter.call(checkboxes, function(cb) { return cb.checked; });
        var count = checkedBoxes.length;

        // 버튼 항상 표시, disabled 속성으로 제어
        if (bulkInvoiceBtn) {
          bulkInvoiceBtn.disabled = count === 0;
        }
        if (bulkPaymentRequestBtn) {
          bulkPaymentRequestBtn.disabled = count === 0;
        }
        if (bulkStatusBtn) {
          bulkStatusBtn.disabled = count === 0;
        }
        if (selectedCountSpan) {
          selectedCountSpan.textContent = count;
        }

        // 전체 선택 체크박스 상태 업데이트
        if (selectAllCheckbox && checkboxes.length > 0) {
          selectAllCheckbox.checked = count === checkboxes.length;
          selectAllCheckbox.indeterminate = count > 0 && count < checkboxes.length;
        }

        config.options.forEach(function(opt) {
          var selected = opt === config.current ? ' selected' : '';
          var displayText = opt === '' ? '- 선택 -' : opt;
          html += '<option value="' + opt + '"' + selected + '>' + displayText + '</option>';
        });
        html += '</select>';
        html += '</div>';
      });

      content.innerHTML = html;

      var btnContainer = document.createElement('div');
      btnContainer.style.cssText = 'margin-top:24px; display:flex; gap:8px; justify-content:flex-end;';

      var saveBtn = document.createElement('button');
      saveBtn.textContent = '저장';
      saveBtn.className = 'ledger-btn primary';
      saveBtn.addEventListener('click', function() {
        var statuses = {
          buyOrder: content.querySelector('#status-buyOrder').value,
          payBuy: content.querySelector('#status-payBuy').value,
          paySell: content.querySelector('#status-paySell').value,
          ship: content.querySelector('#status-ship').value
        };

        document.body.removeChild(modal);
        OB.showLoading('상태 변경 중...');

        google.script.run
          .withSuccessHandler(function(res) {
            OB.hideLoading();

            if (!res || !res.success) {
              alert('상태 변경 실패: ' + (res ? res.error : '알 수 없는 오류'));
              return;
            }

            alert('상태가 업데이트되었습니다.');
            fetchTransactions();
          })
          .withFailureHandler(function(err) {
            OB.hideLoading();
            alert('상태 변경 실패: ' + err.message);
          })
          .updateOrderStatusApi(orderId, statuses);
      });

      var cancelBtn = document.createElement('button');
      cancelBtn.textContent = '취소';
      cancelBtn.className = 'ledger-btn secondary';
      cancelBtn.addEventListener('click', function() {
        document.body.removeChild(modal);
      });

      btnContainer.appendChild(saveBtn);
      btnContainer.appendChild(cancelBtn);
      content.appendChild(btnContainer);

      modal.appendChild(content);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          document.body.removeChild(modal);
        }
      });

      document.body.appendChild(modal);
    }

    function fetchTransactions() {
      var orderCode = (orderCodeInput.value || '').trim();

      OB.showLoading('거래원장 불러오는 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('거래원장 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          state.raw = result.transactions || [];
          applyFilters();
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          alert('거래원장 조회 실패: ' + error.message);
        })
        .getTransactionsApi({ orderCode: orderCode });
    }

    searchBtn.addEventListener('click', function() {
      fetchTransactions();
    });

    resetBtn.addEventListener('click', function() {
      companyInput.value = '';
      statusSelect.value = '';
      if (paymentTermsSelect) paymentTermsSelect.value = '';
      orderCodeInput.value = '';
      startDateInput.value = formatDateInput(firstDay);
      endDateInput.value = formatDateInput(today);
      state.filtered = state.raw.slice();
      applyFilters();
    });

    // 전체 선택 체크박스
    if (selectAllCheckbox) {
      selectAllCheckbox.addEventListener('change', function() {
        var checkboxes = document.querySelectorAll('.ledger-row-checkbox');
        checkboxes.forEach(function(cb) {
          cb.checked = selectAllCheckbox.checked;
        });
        updateBulkButtons();
      });
    }

    // 테이블 바디에 이벤트 위임 (체크박스 개별 선택)
    if (tbody) {
      tbody.addEventListener('change', function(e) {
        if (e.target.classList.contains('ledger-row-checkbox')) {
          updateBulkButtons();
        }
      });

      // 발주번호 클릭 이벤트 (상세 모달 표시)
      tbody.addEventListener('click', function(e) {
        var target = e.target;
        if (target.classList.contains('order-number-link')) {
          var orderNumber = target.dataset.orderNumber;
          var aggregated = {};

          // 해당 발주번호의 데이터 재집계
          state.filtered.forEach(function(tx) {
            var orderNum = tx['발주번호'];
            if (orderNum !== orderNumber) return;

            if (!aggregated[orderNum]) {
              aggregated[orderNum] = {
                orderDate: tx['발주일'],
                orderNumber: orderNum,
                company: tx['발주처'],
                brand: tx['브랜드'] || '-',
                items: [],
                buyOrder: tx['매입발주'] || '',
                payBuy: tx['매입결제'] || '',
                paySell: tx['매출결제'] || '',
                ship: tx['출고'] || ''
              };
            }
            aggregated[orderNum].items.push(tx);
          });

          if (aggregated[orderNumber]) {
            showOrderDetailModal(aggregated[orderNumber]);
          }
        }
      });
    }

    // 일괄 청구서 생성 버튼 - 모달 기반 통합 버전 (Phase 4)
    if (bulkInvoiceBtn) {
      bulkInvoiceBtn.addEventListener('click', function() {
        var checkboxes = document.querySelectorAll('.ledger-row-checkbox:checked');
        if (checkboxes.length === 0) {
          alert('청구서를 생성할 발주를 선택해주세요.');
          return;
        }

        // 선택된 발주 정보 수집
        var selectedOrders = [];
        var companies = {};
        var suppliers = {};
        var totalSupplyAmt = 0;
        var totalPurchaseAmt = 0;

        checkboxes.forEach(function(cb) {
          var orderNum = cb.dataset.orderNumber;
          var buyer = cb.dataset.buyer;
          var supplier = cb.dataset.supplier;
          var supplyAmt = parseFloat(cb.dataset.supplyAmt) || 0;
          var purchaseAmt = parseFloat(cb.dataset.purchaseAmt) || 0;

          selectedOrders.push({
            orderNumber: orderNum,
            buyer: buyer,
            supplier: supplier,
            supplyAmt: supplyAmt,
            purchaseAmt: purchaseAmt
          });

          companies[buyer] = true;
          suppliers[supplier] = true;
          totalSupplyAmt += supplyAmt;
          totalPurchaseAmt += purchaseAmt;
        });

        var companyList = Object.keys(companies);
        var supplierList = Object.keys(suppliers);

        // 청구서 생성/출력 모달 표시
        showInvoiceCreationModal({
          selectedOrders: selectedOrders,
          companies: companyList,
          suppliers: supplierList,
          totalSupplyAmt: totalSupplyAmt,
          totalPurchaseAmt: totalPurchaseAmt,

        });
      });

    // 지급요청서 생성 버튼 클릭 핸들러
    if (bulkPaymentRequestBtn) {
      bulkPaymentRequestBtn.addEventListener('click', function() {
        var checkboxes = document.querySelectorAll('.ledger-row-checkbox:checked');
        if (checkboxes.length === 0) {
          alert('지급요청서를 생성할 발주를 선택해주세요.');
          return;
        }

        // 선택된 발주 정보 수집
        var orderNumbers = [];
        var suppliers = {};
        var totalPurchaseAmt = 0;

        checkboxes.forEach(function(cb) {
          var orderNum = cb.dataset.orderNumber;
          var supplier = cb.dataset.supplier;
          var purchaseAmt = parseFloat(cb.dataset.purchaseAmt) || 0;

          orderNumbers.push(orderNum);
          suppliers[supplier] = (suppliers[supplier] || 0) + purchaseAmt;
          totalPurchaseAmt += purchaseAmt;
        });

        var supplierList = Object.keys(suppliers);

        // 매입처가 여러 개인 경우 경고
        if (supplierList.length > 1) {
          if (!confirm('선택한 발주의 매입처가 ' + supplierList.length + '개입니다.\n' +
              supplierList.join(', ') + '\n\n매입처별로 지급요청서가 생성됩니다.\n계속하시겠습니까?')) {
            return;
          }
        }

        // 지급요청서 생성 확인
        var confirmMsg = '지급요청서 생성 정보\n\n' +
          '- 선택 발주: ' + orderNumbers.length + '건\n' +
          '- 매입처: ' + supplierList.join(', ') + '\n' +
          '- 총 매입액: ₩' + OB.formatNumber(totalPurchaseAmt) + '\n\n' +
          '지급요청서를 생성하시겠습니까?';

        if (!confirm(confirmMsg)) {
          return;
        }

        OB.showLoading('지급요청서 생성 중...');

        // 매입처별로 지급요청서 생성
        var createPromises = supplierList.map(function(supplier) {
          var supplierOrders = [];
          checkboxes.forEach(function(cb) {
            if (cb.dataset.supplier === supplier) {
              supplierOrders.push(cb.dataset.orderNumber);
            }
          });

          return new Promise(function(resolve, reject) {
            google.script.run
              .withSuccessHandler(function(result) {
                resolve({ supplier: supplier, result: result });
              })
              .withFailureHandler(function(error) {
                reject({ supplier: supplier, error: error });
              })
              .createPaymentRequestApi({
                supplier: supplier,
                orderNumbers: supplierOrders,
                requestDate: new Date().toISOString().split('T')[0],
                notes: '거래원장에서 일괄 생성'
              });
          });
        });

        Promise.all(createPromises)
          .then(function(results) {
            OB.hideLoading();

            var successCount = 0;
            var failCount = 0;
            var messages = [];

            results.forEach(function(r) {
              if (r.result && r.result.success) {
                successCount++;
                messages.push('✅ ' + r.supplier + ': ' + r.result.billingId);
              } else {
                failCount++;
                messages.push('❌ ' + r.supplier + ': ' + (r.result ? r.result.error : '오류'));
              }
            });

            alert('지급요청서 생성 완료\n\n' +
              '성공: ' + successCount + '건\n' +
              '실패: ' + failCount + '건\n\n' +
              messages.join('\n'));

            // 체크박스 해제
            checkboxes.forEach(function(cb) { cb.checked = false; });
            updateBulkButtons();
          })
          .catch(function(error) {
            OB.hideLoading();
            console.error('지급요청서 생성 오류:', error);
            alert('지급요청서 생성 중 오류가 발생했습니다.');
          });
      });
    }

    // 청구서 생성/출력 통합 처리 (Phase 4)
    function processInvoiceCreation(params) {
      var orderNumbers = params.orderNumbers;
      var invoiceType = params.invoiceType;
      var outputPdf = params.outputPdf;
      var saveDb = params.saveDb;

      OB.showLoading('청구서 처리 중...');

      // 1. 기존 청구서 확인 및 금액 동기화
      google.script.run
        .withSuccessHandler(function(syncRes) {
          console.log('[InvoiceCreation] syncBillingBeforeOutput 결과:', syncRes);

          if (syncRes && syncRes.exists) {
            // 기존 청구서 있음 - 금액 동기화 완료
            console.log('[InvoiceCreation] 기존 청구서 금액 동기화 완료:', syncRes.billingId);

            if (syncRes.syncResult && syncRes.syncResult.updated) {
              console.log('[InvoiceCreation] 금액 변경됨:', syncRes.syncResult.changeLog);
            }

            // PDF 출력 (요청된 경우)
            if (outputPdf) {
              generateInvoicePdf(orderNumbers, invoiceType, params.checkboxes);
            } else {
              OB.hideLoading();
              alert('기존 청구서 금액이 동기화되었습니다.\n청구ID: ' + syncRes.billingId);
              params.checkboxes.forEach(function(cb) { cb.checked = false; });
              updateBulkButtons();
            }
          } else {
            // 기존 청구서 없음 - 신규 생성
            if (saveDb) {
              if (invoiceType === 'SALES') {
                // 매출청구서 단일 생성
                createSingleInvoice({
                  orderNumbers: orderNumbers,
                  type: 'SALES',
                  company: params.company,
                  amount: params.totalAmount,
                  outputPdf: outputPdf,
                  checkboxes: params.checkboxes
                });
              } else {
                // 매입청구서 매입처별 분리 생성
                createPurchaseInvoices(params);
              }
            } else if (outputPdf) {
              // DB 저장 없이 PDF만 출력
              generateInvoicePdf(orderNumbers, invoiceType, params.checkboxes);
            } else {
              OB.hideLoading();
              alert('출력 옵션을 선택해주세요.');
            }
          }
        })
        .withFailureHandler(function(err) {
          console.error('[InvoiceCreation] 동기화 확인 실패:', err);
          // 동기화 실패해도 생성 진행
          if (saveDb) {
            if (invoiceType === 'SALES') {
              createSingleInvoice({
                orderNumbers: orderNumbers,
                type: 'SALES',
                company: params.company,
                amount: params.totalAmount,
                outputPdf: outputPdf,
                checkboxes: params.checkboxes
              });
            } else {
              createPurchaseInvoices(params);
            }
          } else if (outputPdf) {
            generateInvoicePdf(orderNumbers, invoiceType, params.checkboxes);
          } else {
            OB.hideLoading();
            alert('처리 실패: ' + err.message);
          }
        })
        .syncBillingBeforeOutputApi({ orderNumbers: orderNumbers });
    }

    // 단일 청구서 생성 (매출용)
    function createSingleInvoice(params) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            OB.hideLoading();
            alert('청구서 생성 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          console.log('[InvoiceCreation] 청구서 생성 완료:', res.invoiceId);

          if (params.outputPdf) {
            generateInvoicePdf(params.orderNumbers, 'SALES', params.checkboxes);
          } else {
            OB.hideLoading();
            alert('청구서가 생성되었습니다!\n청구ID: ' + res.invoiceId);
            params.checkboxes.forEach(function(cb) { cb.checked = false; });
            updateBulkButtons();
          }
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('청구서 생성 실패: ' + err.message);
        })
        .createDirectBillingApi({
          orderNumbers: params.orderNumbers,
          type: params.type,
          company: params.company,
          amount: params.amount
        });
    }

    // 매입청구서 매입처별 분리 생성
    function createPurchaseInvoices(params) {
      // 매입처별 그룹핑
      var supplierGroups = {};
      params.selectedOrders.forEach(function(order) {
        var supplier = order.supplier;
        if (!supplierGroups[supplier]) {
          supplierGroups[supplier] = {
            orderNumbers: [],
            totalAmount: 0
          };
        }
        supplierGroups[supplier].orderNumbers.push(order.orderNumber);
        supplierGroups[supplier].totalAmount += order.purchaseAmt;
      });

      var supplierList = Object.keys(supplierGroups);
      var createdInvoices = [];
      var currentIndex = 0;

      function createNextPurchaseInvoice() {
        if (currentIndex >= supplierList.length) {
          // 모두 완료
          if (params.outputPdf && createdInvoices.length > 0) {
            // 첫 번째 그룹의 발주번호로 PDF 출력
            var firstGroup = supplierGroups[supplierList[0]];
            generateInvoicePdf(firstGroup.orderNumbers, 'PURCHASE', params.checkboxes);
          } else {
            OB.hideLoading();
            var resultMsg = createdInvoices.length + '개의 매입청구서가 생성되었습니다!\n\n';
            createdInvoices.forEach(function(inv) {
              resultMsg += '- ' + inv.invoiceId + ' (' + inv.company + ')\n';
            });
            alert(resultMsg);
            params.checkboxes.forEach(function(cb) { cb.checked = false; });
            updateBulkButtons();
          }
          return;
        }

        var supplier = supplierList[currentIndex];
        var group = supplierGroups[supplier];

        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              createdInvoices.push({ invoiceId: res.invoiceId, company: supplier });
            }
            currentIndex++;
            createNextPurchaseInvoice();
          })
          .withFailureHandler(function(err) {
            console.error('[InvoiceCreation] 매입청구서 생성 실패:', supplier, err);
            currentIndex++;
            createNextPurchaseInvoice();
          })
          .createDirectBillingApi({
            orderNumbers: group.orderNumbers,
            type: 'PURCHASE',
            company: supplier,
            amount: group.totalAmount
          });
      }

      createNextPurchaseInvoice();
    }

    // PDF 출력 (거래명세서 템플릿 사용)
    function generateInvoicePdf(orderNumbers, invoiceType, checkboxes) {
      OB.showLoading('거래명세서(부) PDF 생성 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('PDF 생성 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          // 다운로드 처리
          if (res.downloadUrl) {
            window.open(res.downloadUrl, '_blank');
          } else if (res.base64) {
            // Base64 다운로드
            var link = document.createElement('a');
            link.href = 'data:application/pdf;base64,' + res.base64;
            link.download = res.fileName || 'invoice.pdf';
            link.click();
          }

          alert('PDF가 생성되었습니다!\n' + (res.fileName || ''));

          if (checkboxes) {
            checkboxes.forEach(function(cb) { cb.checked = false; });
            updateBulkButtons();
          }
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('PDF 생성 실패: ' + err.message);
        })
        .generateInvoiceZipApi({
          orderCodes: orderNumbers,
          docType: 'INVOICE_VAT',  // 거래명세서(부) 템플릿
          outputFormat: 'PDF',
          printMode: 'auto'  // 품목 수에 따라 자동 결정
        });
    }

    // 일괄 상태 변경 버튼
    if (bulkStatusBtn) {
      bulkStatusBtn.addEventListener('click', function() {
        var checkboxes = document.querySelectorAll('.ledger-row-checkbox:checked');
        if (checkboxes.length === 0) {
          alert('상태를 변경할 발주를 선택해주세요.');
          return;
        }

        var orderNumbers = [];
        checkboxes.forEach(function(cb) {
          orderNumbers.push(cb.dataset.orderNumber);
        });

        showBulkStatusChangeModal(orderNumbers, checkboxes);
      });
    }

    // 일괄 상태 변경 모달
    function showBulkStatusChangeModal(orderNumbers, checkboxes) {
      var modal = document.createElement('div');
      modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:10000; display:flex; align-items:center; justify-content:center;';

      var content = document.createElement('div');
      content.style.cssText = 'background:white; padding:24px; border-radius:12px; max-width:500px; width:90%;';

      var html = '<h3 style="margin:0 0 20px;">일괄 상태 변경</h3>';
      html += '<div style="margin-bottom:16px; padding:12px; background:#f0f9ff; border-left:4px solid #3b82f6; border-radius:4px;">';
      html += '<strong>' + orderNumbers.length + '건</strong>의 발주 상태를 일괄 변경합니다.';
      html += '</div>';

      var statusConfigs = [
        { label: '매입발주', key: 'buyOrder', options: ['', '발주대기', '발주완료', '발주취소'] },
        { label: '매입결제', key: 'payBuy', options: ['', '미결제', '부분결제', '결제완료'] },
        { label: '매출결제', key: 'paySell', options: ['', '미결제', '부분결제', '결제완료'] },
        { label: '출고', key: 'ship', options: ['', '미출고', '출고준비', '출고완료', '배송중', '배송완료'] }
      ];

      statusConfigs.forEach(function(config) {
        html += '<div style="margin-bottom:16px;">';
        html += '<label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">' + config.label + '</label>';
        html += '<select id="bulk-status-' + config.key + '" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px;">';
        config.options.forEach(function(opt) {
          var displayText = opt === '' ? '- 변경 안 함 -' : opt;
          html += '<option value="' + opt + '">' + displayText + '</option>';
        });
        html += '</select>';
        html += '</div>';
      });

      content.innerHTML = html;

      var btnContainer = document.createElement('div');
      btnContainer.style.cssText = 'margin-top:24px; display:flex; gap:8px; justify-content:flex-end;';

      var saveBtn = document.createElement('button');
      saveBtn.textContent = '일괄 적용';
      saveBtn.className = 'ledger-btn primary';
      saveBtn.addEventListener('click', function() {
        var statuses = {
          buyOrder: content.querySelector('#bulk-status-buyOrder').value,
          payBuy: content.querySelector('#bulk-status-payBuy').value,
          paySell: content.querySelector('#bulk-status-paySell').value,
          ship: content.querySelector('#bulk-status-ship').value
        };

        // 하나라도 선택되었는지 확인
        var hasChange = statuses.buyOrder || statuses.payBuy || statuses.paySell || statuses.ship;
        if (!hasChange) {
          alert('변경할 상태를 하나 이상 선택해주세요.');
          return;
        }

        document.body.removeChild(modal);
        OB.showLoading('상태 일괄 변경 중...');

        google.script.run
          .withSuccessHandler(function(res) {
            OB.hideLoading();
            if (!res || !res.success) {
              alert('상태 변경 실패: ' + (res ? res.error : '알 수 없는 오류'));
              return;
            }
            alert(orderNumbers.length + '건의 상태가 업데이트되었습니다.');
            // 체크박스 해제
            checkboxes.forEach(function(cb) { cb.checked = false; });
            updateBulkButtons();
            fetchTransactions();
          })
          .withFailureHandler(function(err) {
            OB.hideLoading();
            alert('상태 변경 실패: ' + err.message);
          })
          .updateBulkOrderStatusApi({ orderNumbers: orderNumbers, statuses: statuses });
      });

      var cancelBtn = document.createElement('button');
      cancelBtn.textContent = '취소';
      cancelBtn.className = 'ledger-btn secondary';
      cancelBtn.addEventListener('click', function() {
        document.body.removeChild(modal);
      });

      btnContainer.appendChild(saveBtn);
      btnContainer.appendChild(cancelBtn);
      content.appendChild(btnContainer);

      modal.appendChild(content);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          document.body.removeChild(modal);
        }
      });

      document.body.appendChild(modal);
    }

    // 매입처별 결제조건 맵 로드 후 초기 조회
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          state.paymentTermsMap = result.paymentTermsMap || {};
          console.log('✅ 결제조건 맵 로드 완료:', Object.keys(state.paymentTermsMap).length + '건');
        } else {
          console.warn('⚠️ 결제조건 맵 로드 실패:', result ? result.error : '알 수 없는 오류');
        }
        fetchTransactions();
      })
      .withFailureHandler(function(error) {
        console.warn('⚠️ 결제조건 맵 로드 실패:', error.message);
        fetchTransactions();
      })
      .getPaymentTermsMapApi();

    console.log('✅ TransactionLedger 페이지 초기화 완료');
  };

  // ===========================================================
  // ✅ InvoiceManagement 페이지 초기화 함수
  // ===========================================================
  OB.invoiceManagementState = {
    aggItems: [],
    aggAmount: 0,
    invoices: []
  };

  OB.initInvoiceManagementPage = function() {
    console.log('🔄 InvoiceManagement 페이지 초기화 시작...');

    var state = OB.invoiceManagementState;

    // 집계 UI
    var aggCompany = document.getElementById('invoice-agg-company');
    var aggStart = document.getElementById('invoice-agg-start');
    var aggEnd = document.getElementById('invoice-agg-end');
    var aggBtn = document.getElementById('invoice-agg-btn');
    var aggSummary = document.getElementById('invoice-agg-summary');
    var aggTableWrap = document.getElementById('invoice-agg-table-wrap');
    var aggTbody = document.getElementById('invoice-agg-tbody');
    var aggItemsEl = document.getElementById('invoice-agg-items');
    var aggOrderQtyEl = document.getElementById('invoice-agg-order-qty');
    var aggConfirmedQtyEl = document.getElementById('invoice-agg-confirmed-qty');
    var aggAmountEl = document.getElementById('invoice-agg-amount');

    // 생성 UI
    var createSettlement = document.getElementById('invoice-create-settlement');
    var createType = document.getElementById('invoice-create-type');
    var createCompany = document.getElementById('invoice-create-company');
    var createDate = document.getElementById('invoice-create-date');
    var createAmount = document.getElementById('invoice-create-amount');
    var createNotes = document.getElementById('invoice-create-notes');
    var createBtn = document.getElementById('invoice-create-btn');

    // 목록 UI
    var filterType = document.getElementById('invoice-filter-type');
    var filterCompany = document.getElementById('invoice-filter-company');
    var filterStatus = document.getElementById('invoice-filter-status');
    var filterStart = document.getElementById('invoice-filter-start');
    var filterEnd = document.getElementById('invoice-filter-end');
    var searchBtn = document.getElementById('invoice-search-btn');
    var resetBtn = document.getElementById('invoice-reset-btn');
    var listTbody = document.getElementById('invoice-list-tbody');
    var listCount = document.getElementById('invoice-list-count');
    var listAmount = document.getElementById('invoice-list-amount');

    var today = new Date();
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    aggStart.value = formatDateInput(firstDay);
    aggEnd.value = formatDateInput(today);
    filterStart.value = formatDateInput(firstDay);
    filterEnd.value = formatDateInput(today);
    createDate.value = formatDateInput(today);

    function formatDateInput(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function renderAggTable(items) {
      if (!items || !items.length) {
        aggTbody.innerHTML = '<tr><td colspan="8" class="invoice-empty">집계 결과가 없습니다.</td></tr>';
        return;
      }

      aggTbody.innerHTML = '';

      items.forEach(function(item) {
        var tr = document.createElement('tr');
        function td(text, cls) {
          var cell = document.createElement('td');
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }

        td(item.orderDate || '-');
        td(item.orderCode || '-');
        td(item.supplier || '-');
        td(item.brand || '-');
        td(item.productName || '-');
        td(OB.formatNumber(item.confirmedQty || 0), 'num');
        td(OB.formatNumber(item.supplyPrice || 0), 'num');
        td(OB.formatNumber(item.supplyAmount || 0), 'num');

        aggTbody.appendChild(tr);
      });
    }

    function renderAggSummary(result) {
      aggItemsEl.textContent = OB.formatNumber(result.totalItems || 0);
      aggOrderQtyEl.textContent = OB.formatNumber(result.totalOrderQty || 0);
      aggConfirmedQtyEl.textContent = OB.formatNumber(result.totalConfirmedQty || 0);
      aggAmountEl.textContent = '₩' + OB.formatNumber(result.totalAmount || 0);
    }

    function aggregate() {
      var company = (aggCompany.value || '').trim();
      var startDate = aggStart.value;
      var endDate = aggEnd.value;

      OB.showLoading('청구 데이터 집계 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('집계 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          state.aggItems = res.items || [];
          state.aggAmount = res.totalAmount || 0;

          renderAggSummary(res);
          renderAggTable(state.aggItems);
          aggSummary.style.display = 'grid';
          aggTableWrap.style.display = 'block';

          if (company) {
            createCompany.value = company;
          }
          if (state.aggAmount) {
            createAmount.value = state.aggAmount;
          }
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('집계 실패: ' + err.message);
        })
        .aggregateInvoiceDataApi({ company: company, startDate: startDate, endDate: endDate });
    }

    aggBtn.addEventListener('click', aggregate);

    function createInvoice() {
      var settlementId = (createSettlement.value || '').trim();
      var type = createType.value;
      var company = (createCompany.value || '').trim();
      var invoiceDate = createDate.value;
      var amount = Number(createAmount.value) || 0;
      var notes = (createNotes.value || '').trim();

      if (!settlementId || !type || !company) {
        alert('마감 ID, 유형, 거래처를 입력해주세요.');
        return;
      }

      if (!amount && state.aggAmount) {
        amount = state.aggAmount;
      }

      OB.showLoading('청구서 생성 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('청구서 생성 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          alert('청구서가 생성되었습니다! ID: ' + res.invoiceId);
          loadInvoices();
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('청구서 생성 실패: ' + err.message);
        })
        .createInvoiceFromSettlementApi({
          settlementId: settlementId,
          type: type,
          company: company,
          invoiceDate: invoiceDate,
          amount: amount,
          notes: notes
        });
    }

    createBtn.addEventListener('click', createInvoice);

    function renderInvoiceTable(list) {
      if (!list || !list.length) {
        listTbody.innerHTML = '<tr><td colspan="9" class="invoice-empty">조회된 인보이스가 없습니다.</td></tr>';
        return;
      }

      listTbody.innerHTML = '';

      list.forEach(function(inv) {
        var tr = document.createElement('tr');

        function td(text, cls) {
          var cell = document.createElement('td');
          cell.textContent = text;
          if (cls) cell.className = cls;
          tr.appendChild(cell);
        }

        td(inv.invoiceId || '-');
        td(inv.type || '-');
        td(inv.company || '-');
        td(inv.settlementId || '-');
        td(inv.invoiceDate || '-');
        td(OB.formatNumber(inv.amount || 0), 'num');

        var statusTd = document.createElement('td');
        var badge = document.createElement('span');
        badge.className = 'invoice-badge';
        badge.textContent = inv.status || 'N/A';
        statusTd.appendChild(badge);
        tr.appendChild(statusTd);

        td(inv.notes || '-');

        var actionTd = document.createElement('td');
        var btn = document.createElement('button');
        btn.className = 'invoice-btn primary';
        btn.textContent = '상태 변경';

        btn.addEventListener('click', function() {
          var nextStatus = '';
          var status = inv.status || 'DRAFT';

          if (status === 'DRAFT') {
            nextStatus = 'ISSUED';
          } else if (status === 'ISSUED') {
            nextStatus = 'PAID';
          } else {
            alert('변경 가능한 상태가 없습니다.');
            return;
          }

          if (!confirm('상태를 ' + nextStatus + ' 로 변경하시겠습니까?')) return;

          OB.showLoading('인보이스 상태 변경 중...');

          google.script.run
            .withSuccessHandler(function(res) {
              OB.hideLoading();

              if (!res || !res.success) {
                alert('상태 변경 실패: ' + (res ? res.error : '알 수 없는 오류'));
                return;
              }

              alert('상태가 변경되었습니다.');
              loadInvoices();
            })
            .withFailureHandler(function(err) {
              OB.hideLoading();
              alert('상태 변경 실패: ' + err.message);
            })
            .updateInvoiceStatusApi({ invoiceId: inv.invoiceId, status: nextStatus });
        });

        actionTd.appendChild(btn);
        tr.appendChild(actionTd);

        listTbody.appendChild(tr);
      });
    }

    function renderInvoiceSummary(list) {
      var totalAmount = 0;
      list.forEach(function(inv) {
        totalAmount += Number(inv.amount) || 0;
      });

      listCount.textContent = (list.length || 0) + '건';
      listAmount.textContent = '₩' + OB.formatNumber(totalAmount);
    }

    function loadInvoices() {
      var params = {
        type: filterType.value,
        company: (filterCompany.value || '').trim(),
        status: filterStatus.value,
        startDate: filterStart.value,
        endDate: filterEnd.value
      };

      OB.showLoading('인보이스 목록 조회 중...');

      google.script.run
        .withSuccessHandler(function(res) {
          OB.hideLoading();

          if (!res || !res.success) {
            alert('조회 실패: ' + (res ? res.error : '알 수 없는 오류'));
            return;
          }

          state.invoices = res.invoices || [];
          renderInvoiceTable(state.invoices);
          renderInvoiceSummary(state.invoices);
        })
        .withFailureHandler(function(err) {
          OB.hideLoading();
          alert('조회 실패: ' + err.message);
        })
        .getInvoicesApi(params);
    }

    searchBtn.addEventListener('click', loadInvoices);

    resetBtn.addEventListener('click', function() {
      filterType.value = '';
      filterCompany.value = '';
      filterStatus.value = '';
      filterStart.value = formatDateInput(firstDay);
      filterEnd.value = formatDateInput(today);
      loadInvoices();
    });

    // 초기 데이터
    aggregate();
    loadInvoices();

    console.log('✅ InvoiceManagement 페이지 초기화 완료');
  };

  // ✅ Settlement 통합 페이지 초기화 (매입/매출 탭)

  OB.initSettlementPage = function() {

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          if (!result || !result.success) {
            alert('조회 실패: ' + (result ? result.error : '알 수 없는 오류'));

          }

  // ========================================
  // 마감 상세 공용 모달
  // ========================================
  (function() {
    var modal = document.getElementById('settlement-detail-modal');
    var closeBtn = document.getElementById('settlement-detail-close');
    var tbody = document.getElementById('settlement-detail-tbody');
    var isBound = false;

    function bindModalEvents() {
      if (isBound || !modal) return;
      if (closeBtn) {
        closeBtn.addEventListener('click', hideModal);
      }
      modal.addEventListener('click', function(e) {
        if (e.target === modal) hideModal();
      });
      isBound = true;
    }

    function hideModal() {
      if (modal) {
        modal.classList.remove('active');
      }
    }

    function renderDetail(data) {
      var settlement = data.settlement || {};
      var items = data.items || [];
      var isSales = settlement.type === 'SALES';

      document.getElementById('settlement-detail-id').textContent = settlement.settlementId || '-';
      document.getElementById('settlement-detail-type').textContent = isSales ? '매출 마감' : '매입 마감';
      document.getElementById('settlement-detail-partner').textContent = settlement.partner || settlement.company || '-';
      document.getElementById('settlement-detail-period').textContent = (settlement.startDate || '-') + ' ~ ' + (settlement.endDate || '-');
      document.getElementById('settlement-detail-status').textContent = settlement.status || 'DRAFT';
      document.getElementById('settlement-detail-items').textContent = OB.formatNumber(settlement.totalItems || 0);
      document.getElementById('settlement-detail-order-qty').textContent = OB.formatNumber(settlement.totalOrderQty || 0);
      document.getElementById('settlement-detail-confirmed-qty').textContent = OB.formatNumber(settlement.totalConfirmedQty || 0);
      document.getElementById('settlement-detail-amount').textContent = '₩' + OB.formatNumber(settlement.totalAmount || 0);

      document.getElementById('settlement-detail-title').textContent = (isSales ? '매출' : '매입') + ' 마감 상세';
      document.getElementById('settlement-detail-price-label').textContent = isSales ? '매출가' : '매입가';
      document.getElementById('settlement-detail-amount-label').textContent = isSales ? '매출액' : '매입액';

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="settlement-detail-empty">마감 상세 데이터가 없습니다.</td></tr>';
      } else {
        var rows = items.map(function(item) {
          var diffQty = (item.orderQty || 0) - (item.confirmedQty || 0);
          var unitPrice = isSales ? (item.supplyPrice || 0) : (item.buyPrice || 0);
          var amount = isSales ? (item.supplyAmount || 0) : (item.purchaseAmount || 0);
          var counterParty = isSales ? (item.supplier || '') : (item.buyer || '');

          return '<tr>' +
            '<td>' + (item.orderCode || '') + '</td>' +
            '<td>' + (item.orderDate || '') + '</td>' +
            '<td>' + counterParty + '</td>' +
            '<td>' + (item.brand || '') + '</td>' +
            '<td>' + (item.productName || '') + '</td>' +
            '<td>' + (item.productCode || '') + '</td>' +
            '<td class="num">' + OB.formatNumber(item.orderQty || 0) + '</td>' +
            '<td class="num">' + OB.formatNumber(item.confirmedQty || 0) + '</td>' +
            '<td class="num">' + OB.formatNumber(diffQty) + '</td>' +
            '<td class="num">₩' + OB.formatNumber(unitPrice) + '</td>' +
            '<td class="num">₩' + OB.formatNumber(amount) + '</td>' +
          '</tr>';
        }).join('');

        tbody.innerHTML = rows;
      }

      if (modal) {
        modal.classList.add('active');
      }
    }

    OB.viewSettlementDetail = function(settlementId, type) {
      if (!modal) {
        alert('상세 모달을 찾을 수 없습니다.');
        return;
      }

      if (!settlementId) {
        alert('마감ID가 필요합니다.');
        return;
      }

      bindModalEvents();
      OB.showLoading('마감 상세 조회 중...');

      google.script.run
        .withSuccessHandler(function(result) {
          OB.hideLoading();

          console.log('[DEBUG] Settlement detail result:', result);

          if (!result || !result.success) {
            alert('마감 상세 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
            return;
          }

          renderDetail(result);
        })
        .withFailureHandler(function(error) {
          OB.hideLoading();
          console.error('[ERROR] Settlement detail failed:', error);
          alert('마감 상세 조회 실패: ' + error.message);
        })
        .getSettlementDetailApi({ settlementId: settlementId, type: type });
    };
  })();

  /**
   * 입출금 내역 추가
   */
  function handleAddPayment() {
    var date = document.getElementById('payment-date').value;
    var type = document.getElementById('payment-type').value;
    var company = document.getElementById('payment-company').value.trim();
    var amount = parseFloat(document.getElementById('payment-amount').value);
    var method = document.getElementById('payment-method').value;
    var docNumber = document.getElementById('payment-docnum').value.trim();
    var orderNumber = document.getElementById('payment-ordernum').value.trim();
    var notes = document.getElementById('payment-notes').value.trim();

    // 유효성 검사
    if (!date) {
      alert('결제일을 입력하세요.');
      return;
    }
    if (!type) {
      alert('결제유형을 선택하세요.');
      return;
    }
    if (!company) {
      alert('거래처명을 입력하세요.');
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      alert('금액을 올바르게 입력하세요.');
      return;
    }
    if (!method) {
      alert('결제수단을 선택하세요.');
      return;
    }

    var params = {
      date: date,
      type: type,
      company: company,
      amount: amount,
      method: method,
      docNumber: docNumber || '',
      orderNumber: orderNumber || '',
      notes: notes || ''
    };

    OB.showLoading('입출금 내역 추가 중...');

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('입출금 내역 추가 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('입출금 내역이 추가되었습니다.\n결제ID: ' + result.paymentId);
        resetPaymentForm();
        loadPaymentList();
        loadPaymentSummary();
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Add payment failed:', error);
        alert('입출금 내역 추가 실패: ' + error.message);
      })
      .addPaymentRecordApi(params);
  }

  /**
   * 입출금 목록 렌더링
   */
  function renderPaymentList(payments) {
    var tbody = document.getElementById('payment-list-tbody');

    if (!payments || payments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="payment-empty">조회된 입출금 내역이 없습니다.</td></tr>';
      return;
    }

    var rows = payments.map(function(payment) {
      var isDeleted = payment.deleted === true || payment.deleted === 'TRUE';
      var badgeClass = payment.type === '입금' ? 'income' : 'expense';
      if (isDeleted) badgeClass = 'deleted';

      var actionButtons = '';
      if (!isDeleted) {
        actionButtons =
          '<button class="payment-btn payment-btn-small warning" onclick="editPayment(\'' + payment.paymentId + '\')">수정</button>' +
          '<button class="payment-btn payment-btn-small danger" onclick="deletePayment(\'' + payment.paymentId + '\')">삭제</button>';
      } else {
        actionButtons = '<span style="color:#9ca3af; font-size:11px;">삭제됨</span>';
      }

      // 거래처명 요약 처리
      var companyDisplay = payment.company || '';
      var companyTooltip = '';
      if (payment.company && payment.company.includes(',')) {
        var companies = payment.company.split(',').map(function(c) { return c.trim(); });
        if (companies.length > 1) {
          companyDisplay = companies[0] + ' 외 ' + (companies.length - 1) + '곳';
          companyTooltip = companies.join('\n');
        }
      }

      // 문서번호 요약 처리 (JSON 배열 또는 쉼표 구분)
      var docDisplay = payment.docNumber || '-';
      var docTooltip = '';
      if (payment.docNumber && payment.docNumber !== '-') {
        try {
          var docs = JSON.parse(payment.docNumber);
          if (Array.isArray(docs) && docs.length > 1) {
            docDisplay = docs[0] + ' 외 ' + (docs.length - 1) + '건';
            docTooltip = docs.join('\n');
          }
        } catch (e) {
          // JSON 파싱 실패 시 그대로 표시
        }
      }

      // SPEC_01: 부분결제 - 금액 컬럼에 상태 표시 및 hover 정보
      var amountDisplay = '₩' + OB.formatNumber(payment.amount || 0);
      var amountTooltip = '';

      if (payment.invoiceStatus) {
        if (payment.invoiceStatus === 'PAID_PARTIAL') {
          // 부분결제: 🔸 emoji + 노란색 + hover tooltip
          var invoiceAmount = payment.invoiceAmount || 0;
          var remainingBalance = payment.invoiceRemainingBalance || 0;
          amountTooltip = '청구금액: ₩' + OB.formatNumber(invoiceAmount) + '\n잔금: ₩' + OB.formatNumber(remainingBalance);
          amountDisplay = '<span title="' + amountTooltip + '" style="color:#f59e0b;font-weight:600;cursor:help;">🔸 ₩' + OB.formatNumber(payment.amount || 0) + '</span>';
        } else if (payment.invoiceStatus === 'PAID') {
          // 결제완료: ✅ emoji + 녹색
          amountDisplay = '<span style="color:#10b981;font-weight:600;">✅ ₩' + OB.formatNumber(payment.amount || 0) + '</span>';
        }
      }

      return '<tr data-payment-id="' + payment.paymentId + '">' +
        '<td>' + (payment.paymentId || '') + '</td>' +
        '<td>' + (payment.date || '') + '</td>' +
        '<td><span class="payment-badge ' + badgeClass + '">' + (payment.type || '') + '</span></td>' +
        '<td>' + (companyTooltip ? '<span class="payment-hover-text" title="' + companyTooltip + '">' + companyDisplay + '</span>' : companyDisplay) + '</td>' +
        '<td class="num">' + amountDisplay + '</td>' +
        '<td>' + (payment.method || '') + '</td>' +
        '<td>' + (docTooltip ? '<span class="payment-hover-text" title="' + docTooltip + '">' + docDisplay + '</span>' : docDisplay) + '</td>' +
        '<td>' + (payment.orderNumber || '-') + '</td>' +
        '<td>' + (payment.notes || '-') + '</td>' +
        '<td>' + (payment.createdAt || '') + '</td>' +
        '<td class="actions">' + actionButtons + '</td>' +
      '</tr>';
    }).join('');

    tbody.innerHTML = rows;
  }

  /**
   * 문서번호 자동완성
   */
  function handleDocNumAutocomplete() {
    var input = document.getElementById('payment-docnum');
    var dropdown = document.getElementById('payment-docnum-dropdown');
    var query = input.value.trim();

    if (query.length < 3) {
      dropdown.style.display = 'none';
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          dropdown.style.display = 'none';
          return;
        }

        var suggestions = result.suggestions || [];

        if (suggestions.length === 0) {
          dropdown.style.display = 'none';
          return;
        }

        var html = suggestions.map(function(item) {
          return '<div class="autocomplete-item" onclick="selectDocNum(\'' + item.invoiceId + '\')">' +
            '<div>' + item.invoiceId + '</div>' +
            '<div class="autocomplete-meta">' + (item.company || '') + ' | ' + (item.invoiceDate || '') + ' | ₩' + OB.formatNumber(item.amount || 0) + '</div>' +
          '</div>';
        }).join('');

        dropdown.innerHTML = html;
        dropdown.style.display = 'block';
      })
      .withFailureHandler(function(error) {
        console.error('[ERROR] Autocomplete failed:', error);
        dropdown.style.display = 'none';
      })
      .searchDocumentNumbersApi({ query: query });
  }

  /**
   * 입출금 내역 수정 - 인라인 편집 모드 활성화
   */
  function editPayment(paymentId) {
    var row = document.querySelector('tr[data-payment-id="' + paymentId + '"]');
    if (!row) {
      alert('해당 결제 내역을 찾을 수 없습니다.');
      return;
    }

    // 이미 편집 중인지 확인
    if (row.classList.contains('editing')) {
      return;
    }

    // 다른 편집 중인 행이 있으면 취소
    var editingRows = document.querySelectorAll('.payment-list tbody tr.editing');
    editingRows.forEach(function(r) {
      if (r.dataset.paymentId) {
        cancelEditPayment(r.dataset.paymentId);
      }
    });

    // 편집 모드로 전환
    row.classList.add('editing');

    var cells = row.cells;

    // 원본 데이터 저장 (취소 시 복원용)
    row.dataset.original = JSON.stringify({
      date: cells[1].textContent.trim(),
      type: cells[2].querySelector('.payment-badge') ? cells[2].querySelector('.payment-badge').textContent.trim() : '',
      company: cells[3].textContent.trim(),
      amount: cells[4].textContent.replace(/[₩,]/g, '').trim(),
      method: cells[5].textContent.trim(),
      docNumber: cells[6].textContent.trim(),
      orderNumber: cells[7].textContent.trim(),
      notes: cells[8].textContent.trim()
    });

    var original = JSON.parse(row.dataset.original);

    // 결제일 (1번 셀)
    cells[1].innerHTML = '<input type="date" class="edit-input" value="' + original.date + '" />';

    // 결제유형 (2번 셀)
    cells[2].innerHTML =
      '<select class="edit-select">' +
      '<option value="입금"' + (original.type === '입금' ? ' selected' : '') + '>입금</option>' +
      '<option value="출금"' + (original.type === '출금' ? ' selected' : '') + '>출금</option>' +
      '</select>';

    // 거래처명 (3번 셀)
    cells[3].innerHTML = '<input type="text" class="edit-input" value="' + original.company + '" />';

    // 금액 (4번 셀)
    cells[4].innerHTML = '<input type="number" class="edit-input" value="' + original.amount + '" min="1" />';

    // 결제수단 (5번 셀)
    cells[5].innerHTML =
      '<select class="edit-select">' +
      '<option value="현금"' + (original.method === '현금' ? ' selected' : '') + '>현금</option>' +
      '<option value="카드"' + (original.method === '카드' ? ' selected' : '') + '>카드</option>' +
      '<option value="계좌이체"' + (original.method === '계좌이체' ? ' selected' : '') + '>계좌이체</option>' +
      '<option value="기타"' + (original.method === '기타' ? ' selected' : '') + '>기타</option>' +
      '</select>';

    // 문서번호 (6번 셀)

    var tbody = document.getElementById('expense-list-tbody');

    if (!expenses || expenses.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="payment-empty">조회된 회사비용 내역이 없습니다.</td></tr>';
      return;
    }

          '<button class="payment-btn payment-btn-small danger" onclick="deleteExpense(\'' + expense.expenseId + '\')">삭제</button>';
      } else {
        actionButtons = '<span style="color:#9ca3af; font-size:11px;">삭제됨</span>';
      }

      var categoryStyle = isDeleted ? 'deleted' : '';

      return '<tr data-expense-id="' + expense.expenseId + '">' +
        '<td>' + (expense.expenseId || '') + '</td>' +
        '<td>' + (expense.date || '') + '</td>' +
        '<td><span class="payment-badge ' + categoryStyle + '">' + (expense.category || '') + '</span></td>' +
        '<td class="num">₩' + OB.formatNumber(expense.amount || 0) + '</td>' +
        '<td>' + (expense.method || '') + '</td>' +
        '<td>' + (expense.notes || '-') + '</td>' +
        '<td>' + (expense.createdAt || '') + '</td>' +
        '<td class="actions">' + actionButtons + '</td>' +
      '</tr>';
    }).join('');

    tbody.innerHTML = rows;
  }

   */
  function editExpense(expenseId) {
    var row = document.querySelector('tr[data-expense-id="' + expenseId + '"]');
    if (!row) {
      alert('해당 비용 내역을 찾을 수 없습니다.');

    // 이미 편집 중인지 확인
    if (row.classList.contains('editing')) {
      return;
    }

    // 다른 편집 중인 행이 있으면 취소
    var editingRows = document.querySelectorAll('.expense-list tbody tr.editing');
    editingRows.forEach(function(r) {
      if (r.dataset.expenseId) {
        cancelEditExpense(r.dataset.expenseId);
      }
    });

    // 편집 모드로 전환
    row.classList.add('editing');

    var cells = row.cells;

    row.dataset.original = JSON.stringify({
      date: cells[1].textContent.trim(),
      category: cells[2].textContent.trim(),
      amount: cells[3].textContent.replace(/[₩,]/g, '').trim(),
      method: cells[4].textContent.trim(),
      notes: cells[5].textContent.trim()
    });

  /**
   * 거래 상세 정보 보기 (문서 정보 포함)
   */
  function viewTransactionDetail(orderCode) {
    if (!orderCode) {
      alert('발주번호가 필요합니다.');
      return;
    }

    OB.showLoading('거래 상세 조회 중...');

    // 거래 정보 조회
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          OB.hideLoading();
          alert('거래 정보 조회 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        // 거래 정보 표시
        var transactions = result.transactions || [];
        if (transactions.length === 0) {
          OB.hideLoading();
          alert('거래 정보를 찾을 수 없습니다.');
          return;
        }

        // 첫 번째 거래 정보로 표시 (같은 발주번호는 동일한 기본 정보를 가짐)
        var tx = transactions[0];

        document.getElementById('detail-order-date').textContent = tx.orderDate || '-';
        document.getElementById('detail-order-code').textContent = tx.orderCode || '-';
        document.getElementById('detail-buyer').textContent = tx.buyer || '-';
        document.getElementById('detail-brand').textContent = tx.brand || '-';

        // 수량과 금액 합계 계산
        var totalOrderQty = 0;
        var totalConfirmedQty = 0;
        var totalPurchaseAmount = 0;
        var totalSupplyAmount = 0;

        transactions.forEach(function(t) {
          totalOrderQty += parseFloat(t.orderQty || 0);
          totalConfirmedQty += parseFloat(t.confirmedQty || 0);
          totalPurchaseAmount += parseFloat(t.purchaseAmount || 0);
          totalSupplyAmount += parseFloat(t.supplyAmount || 0);
        });

        document.getElementById('detail-order-qty').textContent = OB.formatNumber(totalOrderQty);
        document.getElementById('detail-confirmed-qty').textContent = OB.formatNumber(totalConfirmedQty);
        document.getElementById('detail-purchase-amount').textContent = '₩' + OB.formatNumber(totalPurchaseAmount);
        document.getElementById('detail-supply-amount').textContent = '₩' + OB.formatNumber(totalSupplyAmount);

        // 모달 표시
        document.getElementById('ledger-detail-modal').classList.add('active');

        // 관련 결제 내역 로드
        loadDocumentPayments(orderCode);
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Load transaction detail failed:', error);
        alert('거래 정보 조회 실패: ' + error.message);
      })
      .getTransactionsApi({ orderCode: orderCode });
  }

  /**
   * 문서 관련 결제 내역 로드
   */
  function loadDocumentPayments(orderCode) {
    // 발주번호로 결제 내역 조회
    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          console.error('결제 내역 조회 실패:', result);
          renderDocumentPayments([]);
          return;
        }

        renderDocumentPayments(result.payments || []);
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Load document payments failed:', error);
        renderDocumentPayments([]);
      })
      .getPaymentRecordsApi({
        orderNumber: orderCode,
        includeDeleted: false
      });
  }

  /**
   * 문서 정보 섹션 - 결제 내역 렌더링
   */
  function renderDocumentPayments(payments) {
    var tbody = document.getElementById('ledger-payment-tbody');

    if (!payments || payments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="ledger-payment-empty">이 발주와 관련된 결제 내역이 없습니다.</td></tr>';
      return;
    }

    var rows = payments.map(function(payment) {
      var badgeClass = payment.type === '입금' ? 'income' : 'expense';

      return '<tr>' +
        '<td>' + (payment.paymentId || '') + '</td>' +
        '<td>' + (payment.date || '') + '</td>' +
        '<td><span class="ledger-payment-badge ' + badgeClass + '">' + (payment.type || '') + '</span></td>' +
        '<td>' + (payment.company || '') + '</td>' +
        '<td class="num">₩' + OB.formatNumber(payment.amount || 0) + '</td>' +
        '<td>' + (payment.method || '') + '</td>' +
        '<td>' + (payment.notes || '-') + '</td>' +
      '</tr>';
    }).join('');

    tbody.innerHTML = rows;
  }

  /**
   * 청구서 취소 및 재발급 실행
   */
  function confirmCancelAndReissue() {
    var invoiceId = document.getElementById('cancel-invoice-id').value;
    var notes = document.getElementById('cancel-notes').value.trim();

    if (!invoiceId) {
      alert('청구서 ID가 필요합니다.');
      return;
    }

    if (!confirm('정말로 이 청구서를 취소하고 재발급하시겠습니까?\n\n원본: ' + invoiceId + '\n\n이 작업은 되돌릴 수 없습니다.')) {
      return;
    }

    OB.showLoading('청구서 취소 및 재발급 중...');

    google.script.run
      .withSuccessHandler(function(result) {
        OB.hideLoading();

        if (!result || !result.success) {
          alert('청구서 취소/재발급 실패: ' + (result ? result.error : '알 수 없는 오류'));
          return;
        }

        alert('청구서가 취소되고 재발급되었습니다.\n\n원본 청구서: ' + result.oldInvoiceId + '\n새 청구서: ' + result.newInvoiceId);

        // 모달 닫기
        document.getElementById('invoice-cancel-modal').classList.remove('active');

        // 청구서 목록 새로고침
        if (typeof loadInvoiceList === 'function') {
          loadInvoiceList();
        }
      })
      .withFailureHandler(function(error) {
        OB.hideLoading();
        console.error('[ERROR] Cancel and reissue failed:', error);
        alert('청구서 취소/재발급 실패: ' + error.message);
      })
      .cancelAndReissueInvoiceApi({
        invoiceId: invoiceId,
        notes: notes
      });
  }

  /**
   * 청구서 이력 조회
   */
  function viewInvoiceHistory(invoiceId) {
    if (!invoiceId) {
      alert('청구서 ID가 필요합니다.');
      return;
    }

    // 모달 열기
    document.getElementById('invoice-history-modal').classList.add('active');
    document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력을 조회 중입니다...</p>';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력 조회 실패: ' + (result ? result.error : '알 수 없는 오류') + '</p>';
          return;
        }

        var history = result.history || [];

        if (history.length === 0) {
          document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력이 없습니다.</p>';
          return;
        }

        // 이력 렌더링
        var html = history.map(function(invoice, index) {
          var isCancelled = invoice.status === 'CANCELLED';
          var itemClass = isCancelled ? 'invoice-history-item cancelled' : 'invoice-history-item';
          var statusLabel = isCancelled ? '❌ 취소됨' : '✅ 활성';

          return '<div class="' + itemClass + '">' +
            '<div><strong>' + (index + 1) + '. ' + invoice.invoiceId + '</strong> ' + statusLabel + '</div>' +
            '<div class="invoice-history-meta">' +
            '거래처: ' + (invoice.company || '-') + ' | ' +
            '청구일: ' + (invoice.invoiceDate || '-') + ' | ' +
            '금액: ₩' + OB.formatNumber(invoice.amount || 0) + ' | ' +
            '상태: ' + (invoice.status || '-') +
            '</div>' +
            (invoice.notes ? '<div class="invoice-history-meta">비고: ' + invoice.notes + '</div>' : '') +
            (invoice.replacementInvoice ? '<div class="invoice-history-meta">→ 대체청구서: ' + invoice.replacementInvoice + '</div>' : '') +
            (invoice.originalInvoice ? '<div class="invoice-history-meta">← 원본청구서: ' + invoice.originalInvoice + '</div>' : '') +
          '</div>';
        }).join('');

        document.getElementById('invoice-history-list').innerHTML = html;
      })
      .withFailureHandler(function(error) {
        console.error('[ERROR] Load invoice history failed:', error);
        document.getElementById('invoice-history-list').innerHTML = '<p class="invoice-empty">이력 조회 실패: ' + error.message + '</p>';
      })
      .getInvoiceHistoryApi({ invoiceId: invoiceId });
  }

  // ===========================================================
  // ✅ PaymentManagement 페이지 초기화 함수
  // ===========================================================
  OB.initPaymentManagementPage = function() {
    console.log('[PaymentManagement] 페이지 초기화 시작');

    var wrap = document.querySelector('.payment-wrap');
    if (!wrap) {
      console.warn('PaymentManagement wrapper not found');
      return;
    }

    if (wrap.dataset.bound === '1') {
      console.log('PaymentManagement already initialized');
      return;
    }
    wrap.dataset.bound = '1';

    // 탭 전환 이벤트
    document.querySelectorAll('.payment-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var targetTab = this.getAttribute('data-tab');
        switchPaymentTab(targetTab);
      });
    });

    // 입출금 관리 이벤트
    var paymentAddBtn = document.getElementById('payment-add-btn');
    var paymentResetBtn = document.getElementById('payment-reset-btn');
    var paymentSearchBtn = document.getElementById('payment-search-btn');
    var paymentFilterResetBtn = document.getElementById('payment-filter-reset-btn');
    var paymentDocnum = document.getElementById('payment-docnum');

    if (paymentAddBtn) paymentAddBtn.addEventListener('click', handleAddPayment);
    if (paymentResetBtn) paymentResetBtn.addEventListener('click', resetPaymentForm);
    if (paymentSearchBtn) paymentSearchBtn.addEventListener('click', loadPaymentList);
    if (paymentFilterResetBtn) paymentFilterResetBtn.addEventListener('click', resetPaymentFilters);
    if (paymentDocnum) paymentDocnum.addEventListener('input', handleDocNumAutocomplete);

    // 회사비용 관리 이벤트
    var expenseAddBtn = document.getElementById('expense-add-btn');
    var expenseResetBtn = document.getElementById('expense-reset-btn');
    var expenseSearchBtn = document.getElementById('expense-search-btn');
    var expenseFilterResetBtn = document.getElementById('expense-filter-reset-btn');

    if (expenseAddBtn) expenseAddBtn.addEventListener('click', handleAddExpense);
    if (expenseResetBtn) expenseResetBtn.addEventListener('click', resetExpenseForm);
    if (expenseSearchBtn) expenseSearchBtn.addEventListener('click', loadExpenseList);
    if (expenseFilterResetBtn) expenseFilterResetBtn.addEventListener('click', resetExpenseFilters);

    // 오늘 날짜 기본값 설정
    var today = new Date().toISOString().split('T')[0];
    var paymentDate = document.getElementById('payment-date');
    var expenseDate = document.getElementById('expense-date');
    if (paymentDate) paymentDate.value = today;
    if (expenseDate) expenseDate.value = today;

    // 초기 데이터 로드
    loadTodayUpcomingAlerts(); // SPEC_04: 오늘 결제 예정 알림 위젯
    loadPaymentList();
    loadPaymentSummary();
    loadExpenseSummary();

    console.log('✅ PaymentManagement Page 초기화 완료');
  };

  /**

    google.script.run

          document.getElementById('alert-sales-count').textContent = 매출.count + '건';

  /**
   * 탭 전환 함수
   */
  function switchPaymentTab(tabName) {
    // 탭 버튼 활성화
    document.querySelectorAll('.payment-tab').forEach(function(tab) {
      if (tab.getAttribute('data-tab') === tabName) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });

    // 탭 컨텐츠 표시
    document.querySelectorAll('.payment-tab-content').forEach(function(content) {
      if (content.id === 'tab-' + tabName) {
        content.classList.add('active');
      } else {
        content.classList.remove('active');
      }
    });

    // 탭 전환시 데이터 리로드
    if (tabName === 'payments') {
      loadPaymentList();
      loadPaymentSummary();
    } else if (tabName === 'expenses') {
      loadExpenseList();
      loadExpenseSummary();
    }
  }

      '<button class="payment-btn primary" id="invoice-next-step-btn" disabled onclick="proceedWithSelectedInvoices()">다음 단계 →</button>';

    // Enter 키로 검색
    setTimeout(function() {
      var input = document.getElementById('invoice-search-input');
